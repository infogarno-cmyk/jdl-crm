async function fetchCreoAddMetrics(z){
  if(!z.campaign_id)return null
  try{
    let since=null
    const raw=z.date||''
    if(raw){const p=raw.split('.');if(p.length===2){const yr=new Date().getFullYear();since=`${yr}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`}}
    if(!since&&z.created_at)since=z.created_at.split('T')[0]
    const until=new Date().toISOString().split('T')[0]
    const r=await fetch(SB_URL+'/functions/v1/get-campaigns',{
      method:'POST',
      headers:{'Authorization':'Bearer '+SB_ANON,'Content-Type':'application/json'},
      body:JSON.stringify({action:'get_campaign_insights',campaign_id:z.campaign_id,since,until,region:CURRENT_REGION})
    })
    const d=await r.json()
    if(d.ok)return d
    return null
  }catch(e){return null}
}

function _buildCreoAddModalWithMeta(z, meta){
  const spend=meta?meta.spend:0
  const totalLeads=meta?meta.leads:0
  const totalQuals=0
  const autoCpl=meta?meta.cpl:0
  const autoCql=0
  const avgCtr=meta?meta.ctr:0
  const dateStart=z.date||new Date().toLocaleDateString('ru',{day:'2-digit',month:'2-digit'})
  const dateEndFmt=new Date().toLocaleDateString('ru',{day:'2-digit',month:'2-digit'})
  _renderCreoAddForm(z,{spend,totalLeads,totalQuals,autoCpl,autoCql,avgCtr,dateStart,dateEndFmt})
}

function _buildCreoAddModalFallback(z){
  // Use METRICS as fallback
  let dateStartISO=null
  const raw=z.date||''
  if(raw){const p=raw.split('.');if(p.length===2){const yr=new Date().getFullYear();dateStartISO=`${yr}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`}}
  if(!dateStartISO&&z.created_at)dateStartISO=z.created_at.split('T')[0]
  const dateEnd=new Date().toISOString().split('T')[0]
  const metrics=METRICS.filter(m=>(!dateStartISO||m.day>=dateStartISO)&&m.day<=dateEnd)
  let spend=0,totalLeads=0,totalQuals=0
  metrics.forEach(r=>{
    // METRICS columns are spend_pl/spend_plua — main geo → _pl, UA-variant → _plua
    if(z.geo&&!isUaGeo(z.geo)){spend+=parseFloat(r.spend_pl||0);totalLeads+=(r.leads_pl||0)}
    else if(isUaGeo(z.geo)){spend+=parseFloat(r.spend_plua||0);totalLeads+=(r.leads_plua||0)}
    else{spend+=parseFloat(r.spend_pl||0)+parseFloat(r.spend_plua||0);totalLeads+=(r.leads_pl||0)+(r.leads_plua||0)}
    totalQuals+=r.quals||0
  })
  spend=Math.round(spend*100)/100
  const autoCpl=totalLeads>0?Math.round(spend/totalLeads*100)/100:0
  const autoCql=totalQuals>0?Math.round(spend/totalQuals*100)/100:0
  const avgCtr=metrics.length?Math.round(metrics.reduce((s,r)=>s+parseFloat(r.ctr||0),0)/metrics.length*100)/100:0
  const dateStart=z.date||new Date().toLocaleDateString('ru',{day:'2-digit',month:'2-digit'})
  const dateEndFmt=new Date().toLocaleDateString('ru',{day:'2-digit',month:'2-digit'})
  _renderCreoAddForm(z,{spend,totalLeads,totalQuals,autoCpl,autoCql,avgCtr,dateStart,dateEndFmt})
}

function _buildCreoAddModal(z){
  fetchCreoAddMetrics(z).then(meta=>{
    if(meta)_buildCreoAddModalWithMeta(z,meta)
    else _buildCreoAddModalFallback(z)
  })
}

async function saveCreoLib(){

  if(!name){toast('Введи название','err');return}
  const geo=document.getElementById('cl-geo').value
  const funnel=document.getElementById('cl-funnel').value
  const buyer=document.getElementById('cl-buyer').value

  const hall_geo=status==='hall'?geo:null

  let screenshot_url=clEditId?CREO_LIB.find(x=>x.id===clEditId)?.screenshot_url:null
  const fileInp=document.getElementById('cl-img-inp')
  const fileInp2=document.getElementById('cl-img-inp')

    else{const{data:ud}=db.storage.from('creo-screenshots').getPublicUrl(path);screenshot_url=ud.publicUrl}

  }

  const payload={name,geo,funnel,buyer,status,notes,screenshot_url,hall_geo}

  if(clEditId){

    if(!error){const cr=CREO_LIB.find(x=>x.id===clEditId);if(cr)Object.assign(cr,payload);toast('Обновлено','ok')}
    else{toast('Ошибка: '+error.message,'err');return}
  }else{

    if(!error&&data){CREO_LIB.unshift(data);toast('Крео добавлено','ok')}
    else{toast('Ошибка: '+(error?.message||'unknown'),'err');return}
  }
  document.getElementById('mo-creo-lib').classList.remove('open')
  renderCreoTable()
}

// Auto-update creo status when added to zaliv
// Called from openCreoAddModal after archiving
async function markCreosAsUsed(creoNames, stats){
  for(const name of creoNames){
    const cr=CREO_LIB.find(x=>x.name===name||x.name===name.trim())
    if(!cr)continue
    const launches=(cr.launches||0)+1
    // Weighted average: blend old stats with new
    const w=1/launches
    const newCtr=cr.avg_ctr?Math.round((cr.avg_ctr*(1-w)+(stats.ctr||0)*w)*100)/100:(stats.ctr||0)
    const newCpl=cr.avg_cpl?Math.round((cr.avg_cpl*(1-w)+(stats.cpl||0)*w)*100)/100:(stats.cpl||0)
    const newCql=cr.avg_cql?Math.round((cr.avg_cql*(1-w)+(stats.cql||0)*w)*100)/100:(stats.cql||0)
    const upd={status:'used',launches,avg_ctr:newCtr,avg_cpl:newCpl,avg_cql:newCql}
    const{error}=await db.from('creo_library').update(upd).eq('id',cr.id)
    if(!error)Object.assign(cr,upd)
  }
  renderCreoTable()
  toast('Статка по крео обновлена','ok')
}

// Tab key → callout block (Obsidian-style)
document.getElementById('jeditor').addEventListener('keydown',function(e){
  if(e.key==='Tab'){
    e.preventDefault()
    const sel=window.getSelection()
    if(!sel.rangeCount)return
    const range=sel.getRangeAt(0)
    const node=range.startContainer
    // Find the closest block-level element
    const block=node.nodeType===3
      ?node.parentElement?.closest('h1,h2,h3,h4,p,div:not(.jeditor):not(.callout),li')
      :node.closest('h1,h2,h3,h4,p,div:not(.jeditor):not(.callout),li')
    if(block&&block.tagName==='LI'){
      document.execCommand('indent',false,null)
      return
    }
    if(block&&block.id!=='jeditor'){
      // Wrap in callout preserving all content/HTML
      const callout=document.createElement('div')
      callout.className='callout'
      callout.innerHTML=block.innerHTML||block.textContent
      block.parentNode.replaceChild(callout,block)
      // Place cursor at end of callout
      const r=document.createRange()
      r.selectNodeContents(callout)
      r.collapse(false)
      sel.removeAllRanges()
      sel.addRange(r)
    }else{
      // Fallback: insert callout block
      document.execCommand('insertHTML',false,'<div class="callout"><br></div>')
    }
  }
})

// ── AUTO-MATCH CAMPAIGN IDs ──
async function autoMatchCampaignIds(){
  if(!db)return
  setSS('syncing','Матчинг campaign IDs...')
  try{
    const r=await fetch(SB_URL+'/functions/v1/get-campaigns',{
      method:'POST',
      headers:{'Authorization':'Bearer '+SB_ANON,'Content-Type':'application/json'},
      body:JSON.stringify({action:'get_campaigns',region:CURRENT_REGION})
    })
    const d=await r.json()
    if(!d.campaigns?.length){setSS('ok','—');return}

    let matched=0
    // Track which campaign_ids have already been assigned
    const usedCampIds=new Set(ZALIVS.filter(z=>z.campaign_id).map(z=>z.campaign_id))

    for(const camp of d.campaigns){
      // Skip if this campaign_id already assigned to any zaliv
      if(usedCampIds.has(String(camp.id)))continue

      // Find first zaliv without campaign_id that matches this campaign name
      const normCamp=camp.name.toLowerCase().replace(/\s+/g,'').slice(0,25)
      const match=ZALIVS.find(z=>{
        if(z.campaign_id)return false // already has ID
        const normZ=z.name.toLowerCase().replace(/\s+/g,'').slice(0,25)
        return normZ===normCamp||normZ.includes(normCamp.slice(0,15))||normCamp.includes(normZ.slice(0,15))
      })
      if(match){
        await db.from('zalivs').update({campaign_id:String(camp.id)}).eq('id',match.id)
        match.campaign_id=String(camp.id)
        usedCampIds.add(String(camp.id))
        matched++
        console.log('Matched:',match.name,'→',camp.id)
      }
    }
    setSS('ok',matched>0?`Сопоставлено ${matched} кампаний`:'Нет новых совпадений')
    if(matched>0){
      toast(`Автоматически сопоставлено ${matched} campaign IDs`,'ok')
      rzalivs()
    }else{
      toast('Совпадений не найдено — введи ID вручную в редактировании','info')
    }
  }catch(e){
    setSS('','Ошибка');console.error(e)
  }
}

var _anSelZalivId = null
var _anSelYr = null
var _anSelMonth = null

async function loadRkAnalyses(){
  if(!db)return
  const{data}=await db.from('rk_analyses').select('*').eq('region',CURRENT_REGION).order('created_at',{ascending:false})
  RK_ANALYSES=data||[]
}

function initAnalysisPage(){
  renderAnTree()
  const s=document.getElementById('an-search')
  if(s&&!s._anbound){s._anbound=true;s.addEventListener('input',renderAnTree)}
}

function renderAnTree(){
  const el=document.getElementById('an-tree')
  if(!el)return
  const q=(document.getElementById('an-search')?.value||'').toLowerCase()

  // Group zalivs by geo → year → month
  // Use all zalivs + analyses
  const geo_yr_month = {}

  // From analyses - group by period_from month, not created_at
  RK_ANALYSES.forEach(a=>{
    const geo=a.geo||'?'
    // Use period_from to determine month (when the campaign ran)
    let mo=a.month_key||'?'
    if(a.period_from){
      // period_from format: YYYY-MM-DD or DD.MM.YYYY
      let pf=a.period_from
      if(pf.includes('.')){const p=pf.split('.');const yr2=new Date().getFullYear();pf=`${yr2}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`}
      mo=pf.slice(0,7) // YYYY-MM
    }
    const yr=mo.split('-')[0]||'2026'
    const zid=a.zaliv_id
    if(!geo_yr_month[geo])geo_yr_month[geo]={}
    if(!geo_yr_month[geo][yr])geo_yr_month[geo][yr]={}
    if(!geo_yr_month[geo][yr][mo])geo_yr_month[geo][yr][mo]={}
    if(!geo_yr_month[geo][yr][mo][zid])geo_yr_month[geo][yr][mo][zid]={name:a.zaliv_name,count:0,ind:null}
    geo_yr_month[geo][yr][mo][zid].count++
  })

  // Add zalivs without analyses — use REAL date from campaign name, not today
  ZALIVS.forEach(z=>{
    if(q&&!z.name.toLowerCase().includes(q))return
    const geo=z.geo||'?'
    // Parse month from z.date (DD.MM) or from campaign name
    const curYr=new Date().getFullYear().toString()
    let mo=`${curYr}-${String(new Date().getMonth()+1).padStart(2,'0')}` // fallback
    let dateStr=z.date||parseDateFromCampName(z.name)
    if(dateStr&&dateStr.includes('.')){
      const p=dateStr.split('.')
      if(p.length>=2)mo=`${curYr}-${p[1].padStart(2,'0')}`
    }
    const yr=mo.split('-')[0]
    if(!geo_yr_month[geo])geo_yr_month[geo]={}
    if(!geo_yr_month[geo][yr])geo_yr_month[geo][yr]={}
    if(!geo_yr_month[geo][yr][mo])geo_yr_month[geo][yr][mo]={}
    if(!geo_yr_month[geo][yr][mo][z.id]){
      geo_yr_month[geo][yr][mo][z.id]={name:z.name,count:0,ind:z.ind}
    }else{
      geo_yr_month[geo][yr][mo][z.id].ind=z.ind
    }
  })

  const MONTH_NAMES=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь']
  const moName=mk=>{const m=parseInt(mk?.split('-')[1]||1);return MONTH_NAMES[m-1]||mk}
  const indColor=ind=>ind==='profit'?'#2ea043':ind==='drop'?'#e08040':'#e04050'

  let html=''
  Object.entries(geo_yr_month).sort().forEach(([geo,yrs])=>{
    Object.entries(yrs).sort((a,b)=>b[0]-a[0]).forEach(([yr,months])=>{
      html+=`<div class="an-tree-yr" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'':'none'">
        <span class="zgeo gchip ${geoClass(geo)}" style="font-size:9px;padding:1px 5px">${geo}</span>
        <span style="font-weight:700;font-size:12px">RKFB ${geo} ${yr}</span>
        <span style="font-size:10px;color:var(--text3);margin-left:auto">${Object.values(months).reduce((s,m)=>s+Object.keys(m).length,0)} РК</span>
      </div>
      <div class="an-yr-body">`

      Object.entries(months).sort((a,b)=>b[0].localeCompare(a[0])).forEach(([mo,zalivs])=>{
        html+=`<div class="an-tree-sect">${moName(mo)} ${yr}</div>`
        Object.entries(zalivs).forEach(([zid,info])=>{
          if(q&&!info.name.toLowerCase().includes(q))return
          const dot=indColor(info.ind)
          const isActive=_anSelZalivId===parseInt(zid)
          html+=`<div class="an-tree-item${isActive?' active':''}" onclick="selectAnZaliv(${zid})">
            <div class="an-dot" style="background:${dot};flex-shrink:0"></div>
            <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${info.name}</span>
            ${info.count>0?`<span class="an-meta">${info.count}×</span>`:'<span class="an-meta" style="color:var(--bord2)">+ анализ</span>'}
          </div>`
        })
      })
      html+=`</div>`
    })
  })

  el.innerHTML=html||'<div class="empty" style="padding:20px;font-size:11px">Нет данных</div>'
}

function applyAnPreset(preset){
  const zid=parseInt(document.getElementById('an-zaliv-sel')?.value)
  const z=ZALIVS.find(x=>x.id===zid)
  const raw=z?.date||''
  let start=new Date()
  if(raw){const p=raw.split('.');if(p.length===2){const yr=new Date().getFullYear();start=new Date(`${yr}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`)}}
  const fmt=d=>d.toISOString().split('T')[0]
  const add=n=>new Date(start.getTime()+n*864e5)
  const map={'1dc':[fmt(start),fmt(start)],'2dc':[fmt(add(1)),fmt(add(1))],'3dc':[fmt(start),fmt(add(1))],'kwartal':[fmt(start),fmt(add(2))],'2k':[fmt(add(4)),fmt(add(6))]}
  const [f,t]=map[preset]||[fmt(start),fmt(start)]
  document.getElementById('an-from').value=f
  document.getElementById('an-to').value=t
}

function recalcAnalysis(){
  const v=id=>parseFloat(document.getElementById(id)?.value)||0
  const spend=v('an-i-spend')
  const clicks=v('an-i-clicks')
  const leads=v('an-i-leads')
  const quals=v('an-i-quals')
  const cr=clicks>0?Math.round(leads/clicks*10000)/100:0
  const cpl=leads>0?Math.round(spend/leads*100)/100:0
  const ar=leads>0?Math.round(quals/leads*10000)/100:0
  const cql=quals>0?Math.round(spend/quals*100)/100:0
  const cplC=cpl>0&&cpl<10?'#2ea043':cpl<15?'#e08040':cpl>0?'#e04050':'#fff'
  const el=id=>document.getElementById(id)
  if(el('an-v-cr'))el('an-v-cr').textContent=cr+'%'
  if(el('an-v-cpl')){el('an-v-cpl').textContent=cpl>0?'$'+cpl:'—';el('an-v-cpl').style.color=cplC}
  if(el('an-v-ar'))el('an-v-ar').textContent=ar+'%'
  if(el('an-v-cql'))el('an-v-cql').textContent=cql>0?'$'+cql:'—'
}

async function saveCurrentAnalysis(zid,spendArg,clicksArg,reachArg,ctrArg,cpcArg,cpmArg,freqArg,avgViewArg,buyer,geo,funnel,from,to,adsetId,adsetName){
  const z=ZALIVS.find(x=>x.id===zid)
  const vv=id=>parseFloat(document.getElementById(id)?.value)||0
  const spend=vv('an-i-spend')||spendArg
  const clicks=vv('an-i-clicks')||clicksArg
  const reach=vv('an-i-reach')||reachArg
  const ctr=vv('an-i-ctr')||ctrArg
  const cpc=vv('an-i-cpc')||cpcArg
  const cpm=vv('an-i-cpm')||cpmArg
  const freq=vv('an-i-freq')||freqArg
  const avgView=vv('an-i-viewtime')||avgViewArg
  const amfreq=vv('an-i-amfreq')
  const leads=vv('an-i-leads')
  const quals=vv('an-i-quals')
  const notes=document.getElementById('an-notes')?.value||''
  const cr=clicks>0?Math.round(leads/clicks*10000)/100:0
  const cpl=leads>0?Math.round(spend/leads*100)/100:0
  const ar=leads>0?Math.round(quals/leads*10000)/100:0
  const cql=quals>0?Math.round(spend/quals*100)/100:0
  const now=new Date()
  const monthKey=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`

  // Determine month from period_from (when campaign ran)
  let periodMonthKey=monthKey
  if(from){
    let pf=from
    if(pf.includes('.')){const p=pf.split('.');const yr2=new Date().getFullYear();pf=`${yr2}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`}
    periodMonthKey=pf.slice(0,7)
  }
  const payload={
    zaliv_id:zid,zaliv_name:z?.name||'',
    period_from:from,period_to:to,
    reach,frequency:freq,amfreq,cpm,avg_view_time:avgView,
    clicks,cpc,ctr,spend,leads,quals,cr,cpl,ar,cql,
    buyer:buyer||CURRENT_USER?.name||'',geo,funnel,notes,
    month_key:periodMonthKey,
    region:CURRENT_REGION,
    adset_id:adsetId&&adsetId!=='all'&&adsetId!=='undefined'?adsetId:null,
    adset_name:adsetName&&adsetName!=='Вся кампания'?adsetName:null
  }
  // Save to adset_analyses if adset selected
  if(adsetId&&adsetId!=='all'&&adsetId!=='undefined'){
    await db.from('adset_analyses').insert({
      ...payload,campaign_id:ZALIVS.find(x=>x.id===zid)?.campaign_id||'',
      adset_id:adsetId,adset_name:adsetName||''
    })
  }
  const{data,error}=await db.from('rk_analyses').insert(payload).select().single()

  if(!error&&data){
    RK_ANALYSES.unshift(data)
    toast('Анализ сохранён ✓','ok')
    renderAnTree()
    selectAnZaliv(zid)
  }else{
    toast('Ошибка: '+(error?.message||'unknown'),'err')
    console.error(error)
  }
}

    const{data,error}=await db.from('creo_insights').insert({tag,text,buyer,region:CURRENT_REGION}).select().single()

async function delInsight(id){
  // id can be DB id or array index
  const item=INSIGHTS[id]
  if(!item)return
  if(item.id){
    await db.from('creo_insights').delete().eq('id',item.id)
  }
  INSIGHTS.splice(id,1)
  if(!item.id)localStorage.setItem('creo_insights',JSON.stringify(INSIGHTS))
  renderInsightBoard()
}

function normDate(d){
  // Normalize DD.MM or DD.MM.YYYY or YYYY-MM-DD → YYYY-MM-DD
  if(!d)return ''
  if(d.includes('-'))return d.slice(0,10)
  if(d.includes('.')){const p=d.split('.');const yr=p[2]||new Date().getFullYear();return `${yr}-${(p[1]||'01').padStart(2,'0')}-${(p[0]||'01').padStart(2,'0')}`}
  return d
}

async function rdashBuyer(buyer){
  const from=document.getElementById('pd-from')?.value
  const to=document.getElementById('pd-to')?.value
  // Buyer → letter prefix in RK name (D=Danya, I=Illia)
  const letter=buyer==='Danya'?'D':buyer==='Illia'?'I':''

  // Analyses for leads/quals (deduped per RK)
  const analyses=RK_ANALYSES.filter(a=>{
    if(a.buyer!==buyer)return false
    const pf=normDate(a.period_from)
    if(from&&pf&&pf<from)return false
    if(to&&pf&&pf>to)return false
    return true
  })

  // Relabel KPI cards for buyer view
  const setLabel=(idx,txt)=>{const labs=document.querySelectorAll('#page-dash .krow .klab');if(labs[idx])labs[idx].textContent=txt}
  setLabel(0,'SPEND '+buyer.toUpperCase())
  setLabel(1,'ЛИДЫ')
  setLabel(2,'CPL')
  setLabel(3,'CQL')
  setLabel(4,'КВАЛЫ')
  setLabel(5,'CTR AVG')

  const setKpi=(id,val,color)=>{const el=document.getElementById(id);if(el){el.textContent=val;if(color)el.style.color=color;el.style.textShadow=''}}

  // ── LEADS/QUALS from analyses (deduped per RK) ──
  function pickOnePerRK(list){
    const byZaliv={}
    list.forEach(a=>{
      const zid=a.zaliv_id
      if(!byZaliv[zid]){byZaliv[zid]=a;return}
      const cur=byZaliv[zid]
      const aC=!a.adset_id, curC=!cur.adset_id
      if(aC&&!curC){byZaliv[zid]=a;return}
      if(!aC&&curC)return
      const span=x=>{const f=normDate(x.period_from),t=normDate(x.period_to);return f&&t?new Date(t)-new Date(f):0}
      const sa=span(a),sc=span(cur)
      if(sa>sc){byZaliv[zid]=a;return}
      if(sa<sc)return
      if((a.created_at||'')>(cur.created_at||''))byZaliv[zid]=a
    })
    return Object.values(byZaliv)
  }
  const dedup=pickOnePerRK(analyses)
  const totLeads=dedup.reduce((s,a)=>s+(a.leads||0),0)
  const totQuals=dedup.reduce((s,a)=>s+(a.quals||0),0)

  // ── SPEND/METRICS live from Meta for ALL buyer RK (letter D/I) with campaign_id ──
  const buyerZalivs=ZALIVS.filter(z=>parseBuyerFromName(z.name)===buyer&&z.campaign_id)

  // Loading state
  setKpi('d-spend','⏳','var(--yellow)')
  setKpi('d-daily',totLeads,'#2ea043')
  setKpi('d-roi',totQuals,'#4080ff')

  let totSpend=0,totClicks=0,totReach=0,ctrSum=0,ctrN=0
  const spendByDate={}

  // Fetch Meta insights for each buyer RK in parallel
  const results=await Promise.all(buyerZalivs.map(async z=>{
    try{
      const r=await fetch(SB_URL+'/functions/v1/get-campaigns',{
        method:'POST',headers:{'Authorization':'Bearer '+SB_ANON,'Content-Type':'application/json'},
        body:JSON.stringify({action:'get_campaign_insights',campaign_id:z.campaign_id,since:from,until:to,region:CURRENT_REGION})
      })
      const d=await r.json()
      return d.ok?{z,d}:null
    }catch(e){return null}
  }))

  results.forEach(res=>{
    if(!res)return
    const{d}=res
    totSpend+=d.spend||0
    totClicks+=d.clicks||0
    totReach+=d.reach||d.impressions||0
    if(d.ctr>0){ctrSum+=d.ctr;ctrN++}
  })

  totSpend=Math.round(totSpend*100)/100
  const avgCpl=totLeads>0?Math.round(totSpend/totLeads*100)/100:0
  const avgCql=totQuals>0?Math.round(totSpend/totQuals*100)/100:0
  const avgCtr=ctrN>0?Math.round(ctrSum/ctrN*100)/100:0

  setKpi('d-spend','$'+totSpend,'var(--yellow)')
  setKpi('d-daily',totLeads,'#2ea043')
  const cplC=avgCpl>0&&avgCpl<10?'var(--green)':avgCpl<=13?'var(--yellow)':avgCpl>0?'var(--red)':'var(--text)'
  setKpi('d-cpl','$'+avgCpl,cplC)
  const cqlC=avgCql>0&&avgCql<25?'var(--green)':avgCql<=35?'var(--yellow)':avgCql>0?'var(--red)':'var(--text)'
  setKpi('d-cql','$'+avgCql,cqlC)
  setKpi('d-roi',totQuals,'#4080ff')
  setKpi('d-ctr',avgCtr+'%','#fff')

  // Clear comparison arrows
  ;['d-spend','d-daily','d-cpl','d-cql','d-roi','d-ctr'].forEach(id=>{
    const p=document.getElementById(id+'-prev');if(p)p.textContent=''
    const a=document.getElementById(id+'-arr');if(a)a.textContent=''
  })

  // ── CHART: spend from Meta by date is not available per-day here (single period fetch),
  // so build chart from analyses (CPL/CQL/CTR) using deduped set for leads/quals ──
  const byDate={}
  dedup.forEach(a=>{
    const d=normDate(a.period_from||a.period_to)
    if(!d)return
    if(!byDate[d])byDate[d]={spend:0,leads:0,quals:0,ctrSum:0,ctrN:0}
    byDate[d].spend+=a.spend||0
    byDate[d].leads+=a.leads||0
    byDate[d].quals+=a.quals||0
    if(a.ctr>0){byDate[d].ctrSum+=a.ctr;byDate[d].ctrN++}
  })
  const chartRows=Object.entries(byDate).sort().map(([d,v])=>({
    day:d,
    cpl:v.leads>0?Math.round(v.spend/v.leads*100)/100:0,
    cql:v.quals>0?Math.round(v.spend/v.quals*100)/100:0,
    ctr:v.ctrN>0?Math.round(v.ctrSum/v.ctrN*100)/100:0,
    spend_pl:v.spend, spend_plua:0
  }))
  drawChart(chartRows)

  const ctit=document.getElementById('chart-title')
  if(ctit)ctit.textContent='Динамика · '+buyer+' ('+buyerZalivs.length+' РК из Meta)'
}
