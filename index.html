// ── INIT ──
async function init() {
  setSS('syncing','Загрузка...')
  const today = new Date().toISOString().split('T')[0]
  document.getElementById('pd-from').value = today
  document.getElementById('pd-to').value = today
  document.getElementById('sp-from').value = today
  document.getElementById('sp-to').value = today
  try {
    db = supabase.createClient(SB_URL, SB_ANON)
  } catch(e) { console.error('Supabase init:', e) }
  await Promise.all([loadZ(), loadD(), loadT(), loadJ(), loadM(), loadSales()])
  rdash()
  setupRT()
  setSS('ok','Данные загружены')
}

function setSS(s,t){ document.getElementById('sdot').className='sdot '+s; document.getElementById('stxt').textContent=t }

async function manualSync() {
  setSS('syncing','Синхронизация...')
  try {
    const r = await fetch(SB_URL+'/functions/v1/sync', {method:'POST',headers:{'Authorization':'Bearer '+SB_ANON,'Content-Type':'application/json'},body:'{}'})
    const d = await r.json()
    if(d.ok){ await loadM(); await loadSales(); rdash(); setSS('ok','Обновлено · '+d.days+' дней') }
    else setSS('','Ошибка')
  } catch(e){ setSS('','Ошибка соединения') }
}

function setupRT() {
  if(!db) return
  db.channel('jdl-rt')
    .on('postgres_changes',{event:'*',schema:'public',table:'zalivs'},()=>loadZ().then(rzalivs))
    .on('postgres_changes',{event:'*',schema:'public',table:'tasks'},()=>loadT().then(rtasks))
    .on('postgres_changes',{event:'*',schema:'public',table:'domains'},()=>loadD().then(rdomains))
    .on('postgres_changes',{event:'*',schema:'public',table:'journal_docs'},()=>loadJ().then(rtree))
    .on('postgres_changes',{event:'*',schema:'public',table:'metrics_daily'},()=>loadM().then(rdash))
    .subscribe()
}

async function loadZ(){if(!db)return;const{data}=await db.from('zalivs').select('*').order('created_at',{ascending:false});ZALIVS=data||[]}
async function loadD(){if(!db)return;const{data}=await db.from('domains').select('*').order('created_at',{ascending:false});DOMAINS=data||[]}
async function loadT(){if(!db)return;const{data}=await db.from('tasks').select('*').order('created_at',{ascending:true});TASKS=data||[]}
async function loadM(){
  if(!db)return
  const{data}=await db.from('metrics_daily').select('*').order('day',{ascending:true})
  METRICS=data||[]
  if(METRICS.length>0){const l=METRICS[METRICS.length-1];const m=Math.round((Date.now()-new Date(l.synced_at))/60000);setSS('ok','Синк '+m+'м назад')}

async function loadJ(){
  if(!db)return
  const{data}=await db.from('journal_docs').select('*').order('sort_order',{ascending:true})
  const docs=data||[];jFolders=[];jLoose=[]
  const fm={}
  docs.forEach(d=>{if(d.folder_id){if(!fm[d.folder_id])fm[d.folder_id]={id:d.folder_id,name:d.folder_name,docs:[]};fm[d.folder_id].docs.push(d)}else jLoose.push(d)})
  jFolders=Object.values(fm)
  if(!curDoc&&docs.length>0)curDoc=docs[0].id
}
async function loadSales(){
  try {
    const r = await fetch(GARNO_URL+'/rest/v1/garnocrm?select=data&id=eq.1',{headers:{'apikey':GARNO_KEY,'Authorization':'Bearer '+GARNO_KEY}})
    if(!r.ok)return
    const arr = await r.json()
    if(arr&&arr[0]&&arr[0].data&&arr[0].data.sales){

        const src=(s.source||'').toLowerCase()

// ── COUNT UP ──
function countUp(el, target, pre='', suf='', dur=800) {
  const n = parseFloat(target)
  if(isNaN(n)){el.textContent=target;return}
  const start = Date.now()
  const timer = setInterval(()=>{
    const p = Math.min((Date.now()-start)/dur,1)
    const e = 1-Math.pow(1-p,3)
    const cur = n*e
    el.textContent = pre+(Number.isInteger(n)?Math.round(cur):cur.toFixed(1))+suf
    if(p>=1){clearInterval(timer);el.textContent=pre+target+suf}
  },16)
}

// ── DASHBOARD ──
function rdash() {
  const from = document.getElementById('pd-from').value
  const to = document.getElementById('pd-to').value
  const rows = METRICS.filter(m=>m.day>=from&&m.day<=to)
  let tS=0,tPL=0,tPLUA=0,tL=0,tQ=0,tSzl=0
  rows.forEach(r=>{tS+=parseFloat(r.spend_pl||0)+parseFloat(r.spend_plua||0);tPL+=parseFloat(r.spend_pl||0);tPLUA+=parseFloat(r.spend_plua||0);tL+=(r.leads_pl||0)+(r.leads_plua||0);tQ+=r.quals||0;tSzl+=parseFloat(r.sales_amount_zl||0)})
  const days=rows.length||1
  const cpl=tL>0?(tS/tL).toFixed(1):0, cql=tQ>0?(tS/tQ).toFixed(1):0
  const spD=(tS/days).toFixed(0), profit=tSzl*0.3*0.25
  const roi=tS>0?Math.round((profit-tS)/tS*100):0
  const avgCtr=rows.length>0?(rows.reduce((s,r)=>s+parseFloat(r.ctr||0),0)/rows.length).toFixed(2):0

  countUp(document.getElementById('d-spend'), Math.round(tS), '$')
  countUp(document.getElementById('d-daily'), spD, '$')

  const cplEl=document.getElementById('d-cpl'), cplN=parseFloat(cpl)
  if(cplN>0&&cplN<10){cplEl.style.color='var(--green)';cplEl.style.textShadow='0 0 12px rgba(46,160,67,.7)'}
  else if(cplN<=13){cplEl.style.color='var(--yellow)';cplEl.style.textShadow='0 0 12px rgba(212,160,23,.7)'}
  else if(cplN>0){cplEl.style.color='var(--red)';cplEl.style.textShadow='0 0 12px rgba(224,64,80,.6)'}
  else{cplEl.style.color='var(--text)';cplEl.style.textShadow=''}
  countUp(cplEl, cpl, '$')

  const cqlEl=document.getElementById('d-cql'), cqlN=parseFloat(cql)
  if(cqlN>0&&cqlN<25){cqlEl.style.color='var(--green)';cqlEl.style.textShadow='0 0 12px rgba(46,160,67,.7)'}
  else if(cqlN<=35){cqlEl.style.color='var(--yellow)';cqlEl.style.textShadow='0 0 12px rgba(212,160,23,.7)'}
  else if(cqlN>0){cqlEl.style.color='var(--red)';cqlEl.style.textShadow='0 0 12px rgba(224,64,80,.6)'}
  else{cqlEl.style.color='var(--text)';cqlEl.style.textShadow=''}
  countUp(cqlEl, cql, '$')

  const roiEl=document.getElementById('d-roi')
  roiEl.style.color=roi>=100?'var(--green)':roi>0?'var(--yellow)':roi<0?'var(--red)':'var(--text)'
  roiEl.style.textShadow=roi>=100?'0 0 12px rgba(46,160,67,.7)':''
  countUp(roiEl, roi, roi>0?'+':'', '%')
  countUp(document.getElementById('d-ctr'), avgCtr, '', '%')

  document.getElementById('d-zalivs').innerHTML = ZALIVS.slice(0,5).map(z=>`<div class="zrow"><div class="zdot" style="background:${z.ind==='profit'?'var(--green)':z.ind==='drop'?'var(--yellow)':'var(--red)'}"></div><span class="zgeo ${z.geo==='PL'?'gpl':'gplua'}">${z.geo}</span><div class="zname">${z.name}</div><div class="zbud">$${z.rk_budget}/d</div></div>`).join('') || '<div class="empty">Нет заливов</div>'

  const mx=Math.max(tPL,tPLUA,1)
  document.getElementById('d-geo').innerHTML=`<div class="brow"><div class="bhdr"><span class="zgeo gpl">PL</span><span style="font-weight:700;color:var(--yellow);font-family:var(--mono)">$${Math.round(tPL)}</span></div><div class="btrk"><div class="bfill" style="width:${Math.round(tPL/mx*100)}%;background:#4080ff"></div></div></div><div class="brow"><div class="bhdr"><span class="zgeo gplua">PLUA</span><span style="font-weight:700;color:var(--yellow);font-family:var(--mono)">$${Math.round(tPLUA)}</span></div><div class="btrk"><div class="bfill" style="width:${Math.round(tPLUA/mx*100)}%;background:#9060d0"></div></div></div>`

  document.getElementById('d-tasks').innerHTML = TASKS.filter(t=>t.col!=='done').slice(0,4).map(t=>`<div class="tmini"><div class="tpb" style="background:${t.priority==='high'?'var(--red)':t.priority==='mid'?'var(--yellow)':'var(--green)'}"></div><div class="tmt">${t.title}</div><span class="tms ${t.col==='process'?'ts-proc':'ts-todo'}">${t.col==='process'?'In Progress':'TO DO'}</span>${t.assignee?`<span class="tma">${t.assignee}</span>`:''}</div>`).join('') || '<div class="empty">Нет задач</div>'

  drawChart(rows)
}

// ── CHART ──
function drawChart(rows){chartData=rows;const c=document.getElementById('dyn-chart');if(!c)return;c.width=c.parentElement.offsetWidth||600;c.height=130;renderChart()}
function renderChart(){
  if(!chartData||!chartData.length)return
  const rows=chartData,c=document.getElementById('dyn-chart'),ctx=c.getContext('2d')
  const W=c.width,H=c.height,P={t:10,b:22,l:10,r:10},cw=W-P.l-P.r,ch=H-P.t-P.b
  ctx.clearRect(0,0,W,H)
  const S=[{d:rows.map(r=>parseFloat(r.cpl)||0),c:'#4080ff',l:'CPL'},{d:rows.map(r=>parseFloat(r.cql)||0),c:'#d4a017',l:'CQL'},{d:rows.map(r=>parseFloat(r.ctr)||0),c:'#2ea043',l:'CTR'}]
  S.forEach(s=>{s.mn=Math.min(...s.d);s.mx=Math.max(...s.d);if(s.mx===s.mn)s.mx=s.mn+1})
  const n=rows.length,xs=n>1?cw/(n-1):0
  const px=i=>P.l+i*xs,py=(v,s)=>P.t+ch*(1-(v-s.mn)/(s.mx-s.mn))
  ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=1
  for(let i=0;i<=4;i++){const y=P.t+ch*i/4;ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cw,y);ctx.stroke()}
  S.forEach(s=>{
    ctx.save()
    ctx.beginPath();ctx.moveTo(px(0),H-P.b);ctx.lineTo(px(0),py(s.d[0],s))
    for(let i=1;i<n;i++){const x0=px(i-1),y0=py(s.d[i-1],s),x1=px(i),y1=py(s.d[i],s),cx=(x0+x1)/2;ctx.bezierCurveTo(cx,y0,cx,y1,x1,y1)}
    ctx.lineTo(px(n-1),H-P.b);ctx.closePath()
    const g=ctx.createLinearGradient(0,P.t,0,H-P.b);g.addColorStop(0,s.c+'33');g.addColorStop(1,s.c+'00');ctx.fillStyle=g;ctx.fill()
    ctx.beginPath();ctx.moveTo(px(0),py(s.d[0],s))
    for(let i=1;i<n;i++){const x0=px(i-1),y0=py(s.d[i-1],s),x1=px(i),y1=py(s.d[i],s),cx=(x0+x1)/2;ctx.bezierCurveTo(cx,y0,cx,y1,x1,y1)}
    ctx.strokeStyle=s.c;ctx.lineWidth=2;ctx.stroke()
    for(let i=0;i<n;i++){ctx.beginPath();ctx.arc(px(i),py(s.d[i],s),3,0,Math.PI*2);ctx.fillStyle=s.c;ctx.fill()}
    ctx.restore()
  })
  ctx.fillStyle='rgba(144,144,168,.6)';ctx.font='10px Manrope,sans-serif';ctx.textAlign='center'
  const li=[0,Math.floor((n-1)/2),n-1].filter((v,i,a)=>a.indexOf(v)===i)
  li.forEach(i=>ctx.fillText(rows[i]?.day?.slice(5)||'',px(i),H-4))
  c._S=S;c._rows=rows;c._P=P;c._cw=cw;c._ch=ch
}
function chartMouseMove(e){
  const c=this;if(!c._rows)return
  const rect=c.getBoundingClientRect(),mx=(e.clientX-rect.left)*(c.width/rect.width)
  const n=c._rows.length,xs=n>1?c._cw/(n-1):0
  let ci=0,md=9999
  for(let i=0;i<n;i++){const x=c._P.l+i*xs,d=Math.abs(mx-x);if(d<md){md=d;ci=i}}
  if(md>40){document.getElementById('chart-tt').style.display='none';return}
  const tt=document.getElementById('chart-tt');tt.style.display='block'
  let tx=e.clientX-c.closest('.card').getBoundingClientRect().left+14
  if(tx>c.width-170)tx=e.clientX-c.closest('.card').getBoundingClientRect().left-170
  tt.style.left=tx+'px';tt.style.top='4px'
  const r=c._rows[ci]
  tt.innerHTML=`<strong>${r.day}</strong>`+c._S.map(s=>`<div class="ctrow"><span class="ctl" style="color:${s.c}">${s.l}</span><span class="ctv" style="color:${s.c}">${s.d[ci]}</span></div>`).join('')+`<div class="ctrow" style="border-top:1px solid var(--border);margin-top:4px;padding-top:4px"><span class="ctl">Spend</span><span class="ctv">$${Math.round((parseFloat(r.spend_pl)||0)+(parseFloat(r.spend_plua)||0))}</span></div>`
}

const SCLS={Check:'sc',Scale:'ss',OFF:'so',Test:'st',Proliw:'sp',Perezaliw:'sz'}
function s2st(s){return s<=2?'OFF':s<=4?'Check':'Scale'}
function gchip(g){return`<span class="zgeo gchip ${g==='PL'?'gpl':'gplua'}">${g}</span>`}
function spbs(z){return Array.from({length:7},(_,i)=>`<button class="spb${z.score===i?' s'+i:''}" data-zid="${z.id}" data-sc="${i}">${i}</button>`).join('')}

function rzalivs(){
  const geo=document.getElementById('zf-geo').value,st=document.getElementById('zf-status').value,q=document.getElementById('zf-q').value.toLowerCase()
  const f=ZALIVS.filter(z=>(!geo||z.geo===geo)&&(!st||z.status===st)&&(!q||z.name.toLowerCase().includes(q)))
  document.getElementById('z-count').textContent='('+f.length+')'
  let html=''
  f.forEach(z=>{
    const rc=`${z.ind==='profit'?'rp':z.ind==='drop'?'rd':'ro'}${expZ===z.id?' rex':''}`
    html+=`<tr class="${rc}" data-zid="${z.id}" style="cursor:pointer">
      <td><div class="ind-t">
        <button class="itb${z.ind==='profit'?' ap':''}" data-zid="${z.id}" data-ind="profit">P</button>
        <button class="itb${z.ind==='drop'?' ad':''}" data-zid="${z.id}" data-ind="drop">D</button>
        <button class="itb${z.ind==='off'?' ao':''}" data-zid="${z.id}" data-ind="off">O</button>
      </div></td>
      <td style="color:var(--text3);font-size:11px;font-family:var(--mono)">${z.date||'—'}</td>
      <td>${gchip(z.geo)}</td>
      <td><div class="rkn">${z.name}</div></td>
      <td><div style="display:flex;gap:3px">${spbs(z)}</div></td>
      <td><select class="ssel ${SCLS[z.status]||''}" data-zid="${z.id}">${['Check','Scale','OFF','Test','Proliw','Perezaliw'].map(o=>`<option${z.status===o?' selected':''}>${o}</option>`).join('')}</select></td>
      <td class="budg">$${z.ad_budget}<small>/$${z.rk_budget}</small></td>
      <td><a class="dlnk" href="#">${(z.domain||'—').split('/')[0]}</a></td>
      <td><div class="cwrp">${(z.creos||[]).map(c=>`<span class="ctag">${c}</span>`).join('')}${(z.creos||[]).length<5?`<button class="cadd" data-zid="${z.id}">+ крео</button>`:''}</div></td>
      <td>${z.buyer||'—'}</td>
    </tr>`
    if(expZ===z.id) html+=exRow(z)
  })
  document.getElementById('zt-body').innerHTML = html||`<tr><td colspan="10" class="empty">Нет заливов</td></tr>`
  // Bind events
  document.querySelectorAll('#zt-body tr[data-zid]').forEach(tr=>{
    tr.addEventListener('click', e=>{if(!e.target.closest('button,select,a'))togZ(parseInt(tr.dataset.zid))})
  })
  document.querySelectorAll('.itb[data-ind]').forEach(btn=>{
    btn.addEventListener('click', e=>{e.stopPropagation();setInd(parseInt(btn.dataset.zid),btn.dataset.ind)})
  })
  document.querySelectorAll('.spb[data-sc]').forEach(btn=>{
    btn.addEventListener('click', e=>{e.stopPropagation();setScore(parseInt(btn.dataset.zid),parseInt(btn.dataset.sc))})
  })
  document.querySelectorAll('.ssel[data-zid]').forEach(sel=>{
    sel.addEventListener('click', e=>e.stopPropagation())
    sel.addEventListener('change', ()=>setStatus(parseInt(sel.dataset.zid),sel))
  })
  document.querySelectorAll('.cadd[data-zid]').forEach(btn=>{
    btn.addEventListener('click', e=>{e.stopPropagation();addCreoInline(parseInt(btn.dataset.zid))})
  })
  document.querySelectorAll('.dlnk').forEach(a=>a.addEventListener('click',e=>e.preventDefault()))
  // expand row events
  document.querySelectorAll('.sbsv[data-zid]').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();saveEdit(parseInt(btn.dataset.zid))}))
  document.querySelectorAll('.sbdl[data-zid]').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();delZaliv(parseInt(btn.dataset.zid))}))
  document.querySelectorAll('.spb-e[data-sc]').forEach(btn=>{
    btn.addEventListener('click', e=>{e.stopPropagation();setScore(parseInt(btn.dataset.zid),parseInt(btn.dataset.sc))})
  })
}

function togZ(id){expZ=(expZ===id?null:id);rzalivs()}
async function setInd(id,ind){await db.from('zalivs').update({ind,updated_at:new Date().toISOString()}).eq('id',id);const z=ZALIVS.find(x=>x.id===id);if(z)z.ind=ind;rzalivs()}
async function setScore(id,score){
  const z=ZALIVS.find(x=>x.id===id);if(!z)return
  const ns=['OFF','Check','Scale'].includes(z.status)?s2st(score):z.status
  await db.from('zalivs').update({score,status:ns,updated_at:new Date().toISOString()}).eq('id',id)
  z.score=score;z.status=ns;rzalivs()
}
async function setStatus(id,sel){
  const z=ZALIVS.find(x=>x.id===id);if(!z)return
  z.status=sel.value;sel.className='ssel '+(SCLS[sel.value]||'')
  await db.from('zalivs').update({status:sel.value,updated_at:new Date().toISOString()}).eq('id',id)
}
async function saveEdit(id){
  const z=ZALIVS.find(x=>x.id===id);if(!z)return
  const u={name:document.getElementById('ef-name-'+id).value.trim()||z.name,ad_budget:parseFloat(document.getElementById('ef-ad-'+id).value)||z.ad_budget,rk_budget:parseFloat(document.getElementById('ef-rk-'+id).value)||z.rk_budget,domain:document.getElementById('ef-dom-'+id).value.trim(),insights:document.getElementById('ef-ins-'+id).value,updated_at:new Date().toISOString()}
  await db.from('zalivs').update(u).eq('id',id);Object.assign(z,u);rzalivs()
}
async function delZaliv(id){if(!confirm('Удалить?'))return;await db.from('zalivs').delete().eq('id',id);ZALIVS=ZALIVS.filter(z=>z.id!==id);expZ=null;rzalivs()}
async function addCreoInline(id){const v=prompt('Крео ID:');if(!v?.trim())return;const z=ZALIVS.find(x=>x.id===id);if(!z||(z.creos||[]).length>=5)return;z.creos=[...(z.creos||[]),v.trim()];await db.from('zalivs').update({creos:z.creos}).eq('id',id);rzalivs()}

function addCreoField(){const l=document.getElementById('mcreo-list');if(l.children.length>=5)return;const d=document.createElement('div');d.className='gr';const i=document.createElement('input');i.className='fi mcreo-input';i.placeholder='Крео #'+(l.children.length+1);const b=document.createElement('button');b.type='button';b.className='rmbtn';b.textContent='×';b.onclick=()=>{if(l.children.length>1)d.remove()};d.appendChild(i);d.appendChild(b);l.appendChild(d)}
function addGoalField(){const l=document.getElementById('mg-list');const d=document.createElement('div');d.className='gr';const i=document.createElement('input');i.className='fi mgoal-input';i.placeholder='Цель '+(l.children.length+1);const b=document.createElement('button');b.type='button';b.className='rmbtn';b.textContent='×';b.onclick=()=>{if(l.children.length>1)d.remove()};d.appendChild(i);d.appendChild(b);l.appendChild(d)}
async function svz(){
  const name=document.getElementById('mn').value.trim()
  if(!name||!moGeo){alert('Укажи GEO и название');return}
  const creos=[...document.querySelectorAll('.mcreo-input')].map(i=>i.value.trim()).filter(Boolean)
  const goals=[...document.querySelectorAll('.mgoal-input')].map(i=>i.value.trim()).filter(Boolean)
  const today=new Date().toLocaleDateString('ru',{day:'2-digit',month:'2-digit'})
  const{data,error}=await db.from('zalivs').insert({geo:moGeo,name,ad_budget:parseFloat(document.getElementById('ma').value)||0,rk_budget:parseFloat(document.getElementById('mr').value)||0,domain:document.getElementById('md').value,creos,goals,ind:'profit',status:s2st(moScore),insights:'',buyer:document.getElementById('mb').value,funnel:document.getElementById('mf').value,score:moScore,date:today}).select().single()
  if(!error&&data){ZALIVS.unshift(data);document.getElementById('mo-zaliv').classList.remove('open');rzalivs()}
  else alert('Ошибка: '+JSON.stringify(error))
}

// ── SALES ──
function parseDt(ds){if(!ds)return null;if(ds.includes('-'))return new Date(ds);const p=ds.split('.');if(p.length===3)return new Date(p[2]+'-'+p[1]+'-'+p[0]);return null}
function rsales(){
  const from=document.getElementById('sp-from').value,to=document.getElementById('sp-to').value
  const f=SALES_DATA.filter(s=>{const d=parseDt(s.createdAt);if(!d)return false;const day=d.toISOString().split('T')[0];return day>=from&&day<=to})
  document.getElementById('sales-count').textContent='('+f.length+')'
  const total=f.reduce((s,r)=>s+(r.saleAmount||0),0),avg=f.length?Math.round(total/f.length):0
  document.getElementById('sales-kpi').innerHTML=`
    <div class="skc"><div class="sklb">Total Revenue</div><div class="skvl" id="sk-total">0 zł</div><div class="sksb">${f.length} продаж</div></div>
    <div class="skc"><div class="sklb">Avg Deal</div><div class="skvl" id="sk-avg">0 zł</div><div class="sksb">средний чек</div></div>
    <div class="skc"><div class="sklb">Кол-во продаж</div><div class="skvl" id="sk-cnt">0</div><div class="sksb">за период</div></div>`
  setTimeout(()=>{
    countUp(document.getElementById('sk-total'),total.toLocaleString('ru'),'','  zł',1000)
    countUp(document.getElementById('sk-avg'),avg.toLocaleString('ru'),'','  zł',800)
    countUp(document.getElementById('sk-cnt'),f.length,'','',600)
  },50)
  const sm={}
  f.forEach(s=>{const src=s.source||'Неизвестно';if(!sm[src])sm[src]={count:0,amount:0};sm[src].count++;sm[src].amount+=s.saleAmount||0})
  const srcs=Object.entries(sm).sort((a,b)=>b[1].amount-a[1].amount)
  document.getElementById('sales-sources').innerHTML=srcs.map(([src,v])=>`<div class="ssrc"><div class="sstop"><span class="ssn">${src}</span><span class="sscnt">${v.count} пр.</span></div><div class="ssamt">${v.amount.toLocaleString('ru')} zł</div><div class="sssub">avg ${Math.round(v.amount/v.count).toLocaleString('ru')} zł</div></div>`).join('')||'<div class="empty">Нет продаж за период</div>'
  document.getElementById('sales-list').innerHTML=[...f].sort((a,b)=>{const da=parseDt(a.createdAt)||new Date(0),db=parseDt(b.createdAt)||new Date(0);return db-da}).map(s=>`<div class="slrow"><div class="slava">${(s.name||'?').substring(0,2).toUpperCase()}</div><div><div class="slnm">${s.name||'—'}</div><div style="font-size:10px;color:var(--text3)">${s.phone||''}</div></div><span class="slsr">${s.source||'—'}</span><span class="sldt">${s.createdAt||'—'}</span><span class="slam">${(s.saleAmount||0).toLocaleString('ru')} zł</span></div>`).join('')||'<div class="empty">Нет продаж за период</div>'
}

async function saveDomain(){

  if(!error&&data){DOMAINS.push(data);document.getElementById('mo-domain').classList.remove('open');domGeoSel=[];document.querySelectorAll('[data-dgeo]').forEach(b=>b.classList.remove('sel'));rdomains()}

async function delDomain(id){if(!confirm('Удалить?'))return;await db.from('domains').delete().eq('id',id);DOMAINS=DOMAINS.filter(d=>d.id!==id);rdomains()}
function rdomains(){

// ── TASKS ──
async function saveTk(title,col,who){if(!title.trim())return;const{data,error}=await db.from('tasks').insert({title:title.trim(),col,assignee:who||'',priority:'mid',deadline:null}).select().single();if(!error&&data){TASKS.push(data);rtasks()}}
async function delTk(id){if(!confirm('Удалить?'))return;await db.from('tasks').delete().eq('id',id);TASKS=TASKS.filter(t=>t.id!==id);rtasks()}
async function moveTk(id,col){await db.from('tasks').update({col,updated_at:new Date().toISOString()}).eq('id',id);const t=TASKS.find(x=>x.id===id);if(t)t.col=col;rtasks()}
async function cyclePr(id,cur){const o=['low','mid','high'],n=o[(o.indexOf(cur)+1)%3];await db.from('tasks').update({priority:n,updated_at:new Date().toISOString()}).eq('id',id);const t=TASKS.find(x=>x.id===id);if(t)t.priority=n;rtasks()}

function showQA(col){document.querySelectorAll('.kqwrap').forEach(q=>q.classList.remove('open'));const q=document.getElementById('kq-'+col);if(q){q.classList.add('open');q.querySelector('input').focus()}}
function hideQA(col){const q=document.getElementById('kq-'+col);if(q)q.classList.remove('open')}

function rtasks(){
  const uf=document.getElementById('tf-u').value
  const who=CURRENT_USER?CURRENT_USER.name:''
  const cols=[{id:'all',t:'All Tasks',c:'var(--text2)'},{id:'todo',t:'TO DO',c:'var(--blue)'},{id:'process',t:'Process',c:'var(--yellow)'},{id:'done',t:'Done',c:'var(--green)'}]
  const filt=uf?TASKS.filter(t=>t.assignee===uf):TASKS
  document.getElementById('kanban').innerHTML=cols.map(c=>{
    const tasks=filt.filter(t=>t.col===c.id)
    return`<div class="kcol" id="kc-${c.id}">
      <div class="kchdr"><div class="kctit"><div class="kcind" style="background:${c.c}"></div>${c.t}</div><span class="kccnt">${tasks.length}</span></div>
      <div id="kl-${c.id}">${tasks.map(t=>tcard(t)).join('')}</div>
      <button class="kadd" data-col="${c.id}">+ Add a card</button>
      <div class="kqwrap" id="kq-${c.id}">
        <input class="kqinp" placeholder="Название задачи..." data-col="${c.id}" data-who="${who}">
        <div class="kqfoot">
          <button class="kqsv" data-col="${c.id}" data-who="${who}">Создать</button>
          <button class="kqcn" data-col="${c.id}">✕</button>
        </div>
      </div>
    </div>`
  }).join('')
  // bind
  document.querySelectorAll('.kadd[data-col]').forEach(b=>b.addEventListener('click',()=>showQA(b.dataset.col)))
  document.querySelectorAll('.kqinp').forEach(inp=>{
    inp.addEventListener('keydown', e=>{
      if(e.key==='Enter'){const v=inp.value;if(v){saveTk(v,inp.dataset.col,inp.dataset.who);hideQA(inp.dataset.col)}}
      if(e.key==='Escape')hideQA(inp.dataset.col)
    })
  })
  document.querySelectorAll('.kqsv').forEach(b=>{
    b.addEventListener('click',()=>{const inp=document.querySelector(`#kq-${b.dataset.col} .kqinp`);if(inp?.value){saveTk(inp.value,b.dataset.col,b.dataset.who);hideQA(b.dataset.col)}})
  })
  document.querySelectorAll('.kqcn').forEach(b=>b.addEventListener('click',()=>hideQA(b.dataset.col)))
  document.querySelectorAll('.kcol').forEach(col=>{
    col.addEventListener('dragover',e=>e.preventDefault())
    col.addEventListener('drop',e=>{e.preventDefault();if(dragId)moveTk(dragId,col.id.replace('kc-',''))})
  })
}
function tcard(t){
  const ov=t.deadline&&t.deadline<new Date().toISOString().split('T')[0]
  return`<div class="tcard ${t.priority==='high'?'th':t.priority==='mid'?'tm':'tl'}" draggable="true" id="tc-${t.id}" data-id="${t.id}">
    <div class="tnm">${t.title}</div>
    <div class="tft">
      <span class="tpr ${t.priority==='high'?'ph':t.priority==='mid'?'pm':'pl'}" data-id="${t.id}" data-pr="${t.priority}">${t.priority.toUpperCase()}</span>
      ${t.assignee?`<span class="two">${t.assignee}</span>`:''}
      ${t.deadline?`<span class="tdl${ov?' ov':''}">${ov?'⚠ ':''} ${t.deadline}</span>`:''}
      <button class="tdel" data-id="${t.id}">✕</button>
    </div>
  </div>`
}
document.addEventListener('click', e=>{
  const pr=e.target.closest('.tpr[data-id]')
  if(pr){e.stopPropagation();cyclePr(parseInt(pr.dataset.id),pr.dataset.pr);return}
  const del=e.target.closest('.tdel[data-id]')
  if(del){e.stopPropagation();delTk(parseInt(del.dataset.id));return}
})
document.addEventListener('dragstart', e=>{const tc=e.target.closest('.tcard[data-id]');if(tc){dragId=parseInt(tc.dataset.id);setTimeout(()=>tc.classList.add('dragging'),0)}})
document.addEventListener('dragend', e=>{const tc=e.target.closest('.tcard');if(tc)tc.classList.remove('dragging');dragId=null})

// ── JOURNAL ──
function rtree(){
  let h=''
  jLoose.forEach(d=>{h+=ji2(d,false)})
  jFolders.forEach(f=>{
    h+=`<div class="jgrp"><span>📁 ${f.name}</span><div class="jgbtns"><button class="jgbtn" data-fid="${f.id}" data-fname="${f.name}">+</button><button class="jgbtn" style="color:var(--red)" data-delfid="${f.id}">✕</button></div></div>`
    f.docs.forEach(d=>{h+=ji2(d,true)})
  })
  document.getElementById('j-tree').innerHTML=h||'<div class="empty" style="padding:12px">Нет документов</div>'
  document.querySelectorAll('[data-docid]').forEach(el=>el.addEventListener('click',()=>loadDocById(el.dataset.docid)))
  document.querySelectorAll('[data-deldoc]').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();deleteDoc(btn.dataset.deldoc)}))
  document.querySelectorAll('[data-fid]').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();newDocInFolder(btn.dataset.fid,btn.dataset.fname)}))
  document.querySelectorAll('[data-delfid]').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();deleteFolder(btn.dataset.delfid)}))
}
function ji2(d,child){return`<div class="jitem${child?' jich':''}${curDoc===d.id?' active':''}" data-docid="${d.id}"><span>📄</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis">${d.title}</span><div class="jiact"><button class="jiab" data-deldoc="${d.id}">✕</button></div></div>`}
function loadDocById(id){curDoc=id;const all=[...jLoose,...jFolders.flatMap(f=>f.docs)];const d=all.find(x=>x.id===id);if(d){document.getElementById('j-title').value=d.title;document.getElementById('j-ta').value=d.body}rtree()}
async function saveDoc(){if(!curDoc)return;const title=document.getElementById('j-title').value,body=document.getElementById('j-ta').value;await db.from('journal_docs').update({title,body,updated_at:new Date().toISOString()}).eq('id',curDoc);const all=[...jLoose,...jFolders.flatMap(f=>f.docs)];const d=all.find(x=>x.id===curDoc);if(d){d.title=title;d.body=body}const btn=document.getElementById('btn-jsave');btn.textContent='✅ Saved';setTimeout(()=>btn.textContent='💾 Save',1500);rtree()}
async function newDoc(){const title=prompt('Название:');if(!title)return;const id='doc_'+Date.now();const{data}=await db.from('journal_docs').insert({id,title,body:'## '+title+'\n\n',folder_id:'',folder_name:'',sort_order:Date.now()}).select().single();if(data){jLoose.push(data);curDoc=id;rtree();loadDocById(id)}}
async function newFolder(){const name=prompt('Папка:');if(!name)return;const fid='folder_'+Date.now(),docId='doc_'+Date.now();const{data}=await db.from('journal_docs').insert({id:docId,title:'Новый документ',body:'',folder_id:fid,folder_name:name,sort_order:Date.now()}).select().single();if(data){jFolders.push({id:fid,name,docs:[data]});curDoc=docId;rtree();loadDocById(docId)}}
async function newDocInFolder(fid,fname){const title=prompt('Название:');if(!title)return;const id='doc_'+Date.now();const{data}=await db.from('journal_docs').insert({id,title,body:'',folder_id:fid,folder_name:fname,sort_order:Date.now()}).select().single();if(data){const f=jFolders.find(x=>x.id===fid);if(f)f.docs.push(data);curDoc=id;rtree();loadDocById(id)}}
async function deleteDoc(id){if(!confirm('Удалить документ?'))return;await db.from('journal_docs').delete().eq('id',id);jLoose=jLoose.filter(d=>d.id!==id);jFolders.forEach(f=>{f.docs=f.docs.filter(d=>d.id!==id)});const all=[...jLoose,...jFolders.flatMap(f=>f.docs)];curDoc=all[0]?.id||null;rtree();if(curDoc)loadDocById(curDoc)}
async function deleteFolder(fid){if(!confirm('Удалить папку?'))return;const f=jFolders.find(x=>x.id===fid);if(f)for(const d of f.docs)await db.from('journal_docs').delete().eq('id',d.id);jFolders=jFolders.filter(x=>x.id!==fid);curDoc=jLoose[0]?.id||null;rtree();if(curDoc)loadDocById(curDoc)}
function ji(p){const ta=document.getElementById('j-ta'),s=ta.selectionStart;ta.value=ta.value.substring(0,s)+p+ta.value.substring(s);ta.focus();ta.selectionStart=ta.selectionEnd=s+p.length}
function jw(b,a){const ta=document.getElementById('j-ta'),s=ta.selectionStart,e=ta.selectionEnd,sel=ta.value.substring(s,e);ta.value=ta.value.substring(0,s)+b+sel+a+ta.value.substring(e);ta.focus();ta.selectionStart=s+b.length;ta.selectionEnd=e+b.length}
function jtable(){const ta=document.getElementById('j-ta'),s=ta.selectionStart;ta.value=ta.value.substring(0,s)+'\n| Кол1 | Кол2 | Кол3 |\n|------|------|------|\n| val  | val  | val  |\n'+ta.value.substring(s);ta.focus()}
function parseMd(md){return md.replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/`(.+?)`/g,'<code>$1</code>').replace(/^---$/gm,'<hr>').replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>').replace(/^- (.+)$/gm,'<li>$1</li>').replace(/(<li>.*<\/li>\n?)+/g,s=>`<ul>${s}</ul>`).replace(/(\|[^\n]+\|\n?)+/g,t=>{const rows=t.trim().split('\n');if(rows.length<2)return t;const head=rows[0].split('|').filter(c=>c.trim()).map(c=>`<th>${c.trim()}</th>`).join('');const body=rows.slice(2).map(r=>'<tr>'+r.split('|').filter(c=>c.trim()).map(c=>`<td>${c.trim()}</td>`).join('')+'</tr>').join('');return`<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`}).replace(/\n/g,'<br>')}

document.getElementById('btn-new-folder').addEventListener('click', newFolder)
document.getElementById('btn-new-doc').addEventListener('click', newDoc)

// Auto-login
const _saved = localStorage.getItem('jdl_user')
if(_saved && USERS[_saved]) doLogin(_saved)
