// ── Числа словами ──
// Движки читают "428" как попало и путают падежи. Пишем словами — читается всегда верно.
const RU_1=['','один','два','три','четыре','пять','шесть','семь','восемь','девять','десять','одиннадцать','двенадцать','тринадцать','четырнадцать','пятнадцать','шестнадцать','семнадцать','восемнадцать','девятнадцать']
const RU_1F=['','одна','две','три','четыре','пять','шесть','семь','восемь','девять']
const RU_10=['','','двадцать','тридцать','сорок','пятьдесят','шестьдесят','семьдесят','восемьдесят','девяносто']
const RU_100=['','сто','двести','триста','четыреста','пятьсот','шестьсот','семьсот','восемьсот','девятьсот']
function ruTriad(n,fem){
  const out=[]
  const h=Math.floor(n/100),rest=n%100
  if(h)out.push(RU_100[h])
  if(rest<20){if(rest)out.push(fem?(rest<10?RU_1F[rest]:RU_1[rest]):RU_1[rest])}
  else{out.push(RU_10[Math.floor(rest/10)]);const u=rest%10;if(u)out.push(fem?RU_1F[u]:RU_1[u])}
  return out.join(' ')
}
function ruPlural(n,a,b,c){const n1=n%10,n2=n%100
  if(n1===1&&n2!==11)return a
  if(n1>=2&&n1<=4&&(n2<10||n2>=20))return b
  return c}
function num2ru(n,fem){
  n=Math.round(Math.abs(n))
  if(n===0)return 'ноль'
  const parts=[]
  const mil=Math.floor(n/1000000),th=Math.floor(n%1000000/1000),rest=n%1000
  if(mil)parts.push(ruTriad(mil,false),ruPlural(mil,'миллион','миллиона','миллионов'))
  if(th)parts.push(ruTriad(th,true),ruPlural(th,'тысяча','тысячи','тысяч'))
  if(rest)parts.push(ruTriad(rest,!!fem))
  return parts.filter(Boolean).join(' ')
}
// «428 долларов» → «четыреста двадцать восемь долларов» с верным падежом
function ruMoney(n){n=Math.round(n);return num2ru(n)+' '+ruPlural(n,'доллар','доллара','долларов')}
function ruCount(n,a,b,c){n=Math.round(n);return num2ru(n)+' '+ruPlural(n,a,b,c)}
// Синтез читает символы буквально ($, %, ·) — переводим их в слова заранее.
function jvNorm(t){
  return String(t)
    // аббревиатуры расшифровываем словами — «си кью эл» на слух не значит ничего
    .replace(/CQL/gi,'цена квала').replace(/CPL/gi,'цена лида').replace(/CTR/gi,'си ти ар')
    // сначала суммы вместе со словом «долларов», иначе оно продублируется
    // Пробел возвращаем в замене, иначе слова склеиваются («лидадвести»);
    // лишние пробелы схлопываются последним правилом.
    .replace(/\$?\s?([\d\s\u00A0.,]+?)\s*долларов/gi,(m,n)=>' '+ruMoney(parseFloat(String(n).replace(/[\s\u00A0]/g,'').replace(',','.'))||0))
    .replace(/\$\s?([\d\s\u00A0.,]+)/g,(m,n)=>' '+ruMoney(parseFloat(String(n).replace(/[\s\u00A0]/g,'').replace(',','.'))||0))
    .replace(/([\d.,]+)\s?\$/g,(m,n)=>ruMoney(parseFloat(n.replace(',','.'))||0))
    .replace(/([\d.,]+)\s?%/g,(m,n)=>{const v=Math.round(parseFloat(n.replace(',','.'))||0);return num2ru(v)+' '+ruPlural(v,'процент','процента','процентов')})
    // «55 000» и «55 000 zł» — это пятьдесят пять тысяч, а не «пятьдесят пять ноль».
    // Разряды через пробел склеиваем ДО того, как числа разбираются поодиночке.
    .replace(/(\d{1,3})(?:[\s\u00A0](\d{3}))+/g,m=>num2ru(parseInt(m.replace(/[\s\u00A0]/g,''))))
    // существительные женского рода требуют «одна», «две»
    .replace(/(\d{1,9})\s+(задач\w*|заметк\w*|кампани\w*|минут\w*|тысяч\w*|крон\w*)/gi,(m,n,w)=>num2ru(parseInt(n),true)+' '+w)
    .replace(/(^|[^\d])(\d{1,9})(?!\d)/g,(m,p,n)=>p+num2ru(parseInt(n)))
    .replace(/\bPL\b/g,'Польша').replace(/\bCZ\b/g,'Чехия').replace(/\bРК\b/g,'кампаний')
    .replace(/[·•|]/g,', ').replace(/[—–]/g,', ')
    .replace(/\s{2,}/g,' ').replace(/\s+([,.!?])/g,'$1').trim()
}

// Знак ударения U+0301 после гласной — движки читают слово правильно.
// Без него «хасла» звучит как «хаслА», а «квалы» как «квалЫ».
// \b в JS не работает с кириллицей (там только латиница), поэтому границы задаём вручную.
const JV_STRESS=[
  ['хасла','ха\u0301сла'],['хасл','ха\u0301сл'],
  ['квалы','ква\u0301лы'],['квалов','ква\u0301лов'],['квала','ква\u0301ла'],['квал','ква\u0301л'],
  ['залива','зали\u0301ва'],['заливы','зали\u0301вы'],['заливов','зали\u0301вов'],
  ['открут','откру\u0301т'],['открута','откру\u0301та'],
  ['связку','свя\u0301зку'],['связки','свя\u0301зки'],['связка','свя\u0301зка'],
  ['крео','кре\u0301о'],['лиды','ли\u0301ды'],['лидов','ли\u0301дов'],['лида','ли\u0301да']
].map(([w,to])=>[new RegExp('(^|[^а-яёa-z\u0301])'+w+'(?![а-яёa-z])','gi'),to])
function jvStress(t){
  let s=String(t)
  for(const[re,to]of JV_STRESS)s=s.replace(re,(m,p1)=>{
    const body=m.slice((p1||'').length)
    // сохраняем регистр: «Квалов» не должно превращаться в «квалов»
    const rep=/^[А-ЯЁ]/.test(body)?to[0].toUpperCase()+to.slice(1):to
    return (p1||'')+rep
  })
  return s
}
// ── Смешок ──
// Полноценный смех синтез не вытягивает, а короткий выдох перед ироничной фразой
// читается как усмешка. Ставим изредка, иначе приедается.
const JV_LAUGH=['Хм.','Ха.','Хех.','Кхм.']
function jvMaybeLaugh(s){
  if(!/(полагаю|позволю себе|надеюсь|если бы|классика|обед|фонд|смирени|шучу|спонсорство|метро)/i.test(s))return s
  return Math.random()<.35?JV_PICK(JV_LAUGH)+' '+s:s
}
// ── Интонация по смыслу ──
// Приветствие звучит теплее, предупреждение ниже и медленнее, подколка легче и быстрее,
// вопрос идёт вверх. Без этого всё читается одной краской.
function jvTone(s){
  const t=String(s)
  if(/[?]\s*$/.test(t))                                   return{r:.03,p:.16,tag:'вопрос'}
  if(/^(внимание|просрочено|рекомендую|дорого|осторожно)/i.test(t)
     ||/(дорого|из берегов|вмешаться|пересобрать|горит|просроч)/i.test(t)) return{r:-.10,p:-.11,tag:'тревога'}
  if(/(отличн|прекрасн|дёшево|дешевле|масштабируйте|поздравляю|чисто|впечатл)/i.test(t))return{r:.06,p:.13,tag:'одобрение'}
  if(/(полагаю|позволю себе|надеюсь|если бы|классика|обед|фонд|смирени|шучу)/i.test(t))return{r:.08,p:.06,tag:'ирония'}
  // перечисления читаются суше и чуть быстрее — это фон, а не главное
  if(/[:,].*[,].*[,]/.test(t)&&/\d/.test(t))             return{r:.05,p:-.04,tag:'перечень'}
  if(/(сэр\.|доброе утро|добрый день|добрый вечер|доброй ночи|к вашим услугам)/i.test(t)) return{r:-.03,p:.09,tag:'тепло'}
  if(/[!]\s*$/.test(t))                                   return{r:.06,p:.12,tag:'акцент'}
  return{r:0,p:0,tag:''}
}
// ── Просодия ──
// Робот выдаёт себя постоянством: один тон, один темп, равные паузы. Живая речь всё время
// чуть плавает, тормозит на цифрах и по-разному держит паузу после точки и после запятой.
let _jvPhrase=0
function jvChunks(text){
  // длинные фразы дробим по запятым — иначе синтез тараторит их на одном дыхании
  const out=[]
  for(const s of jvNorm(text).split(/(?<=[.!?\u2026])\s+/).filter(Boolean)){
    if(s.length<=70){out.push(s);continue}
    let buf=''
    for(const part of s.split(/(?<=,)\s+/)){
      if((buf+' '+part).trim().length>70&&buf){out.push(buf.trim());buf=part}
      else buf=(buf+' '+part).trim()
    }
    if(buf)out.push(buf)
  }
  // короткий хвост вроде «сэр.» не должен звучать отдельной фразой
  for(let i=out.length-1;i>0;i--){
    if(out[i].length<14){out[i-1]=(out[i-1]+' '+out[i]).trim();out.splice(i,1)}
  }
  return out
}
async function jvSpeakLocal(text){
  const parts=jvChunks(text).map(s=>jvStress(jvMaybeLaugh(s)))
  for(let i=0;i<parts.length;i++){
    if(_jvAbort)return
    const s=parts[i]
    // на цифрах притормаживаем — так их легче разобрать
    const slow=/(долларов|доллара|процент|тысяч)/.test(s)?-.05:0
    // лёгкий разброс тона и темпа: две фразы подряд не звучат одинаково
    const j=_jvPhrase++%4,jt=jvProfile().jitter,tn=jvTone(s)
    await jvUtter(s,{rate:jvRate()+slow+tn.r+[0,1,-.7,.5][j]*jt,
                     pitch:jvPitch()+tn.p+[0,-1,.8,-.5][j]*jt})
    // после точки пауза длиннее, чем после запятой — как при чтении вслух
    const loc=(jvVoice()||{}).localService
    if(i<parts.length-1)await jvWait((/[.!?\u2026]$/.test(s)?170:85)*(loc?1.25:1))
  }
}
function jvUtter(text,opt){
  return new Promise(res=>{
    if(_jvAbort||!text)return res()
    if(_jvNoVoice||!window.speechSynthesis)return setTimeout(res,jvReadMs(text))
    try{
      const u=new SpeechSynthesisUtterance(text)
      const v=jvVoice();if(v){u.voice=v;u.lang=v.lang}
      u.rate=Math.max(.6,Math.min(1.6,(opt&&opt.rate)||jvRate()))
      u.pitch=Math.max(.5,Math.min(1.5,(opt&&opt.pitch)||jvPitch()))
      u.volume=1
      const t0=Date.now();let done=false,keep=null,started=false
      const fin=()=>{
        if(done)return;done=true
        clearInterval(keep)
        if(!started){
          // речь так и не зазвучала — браузер её заблокировал
          console.log('Геннадий: синтез не стартовал (нужен клик по странице)')
          if(!_jvSpeechUnlocked)toast('Нажми в любом месте страницы — браузер блокирует голос','info')
          return setTimeout(res,jvReadMs(text))
        }
        res()
      }
      u.onstart=()=>{started=true;_jvSpeechUnlocked=true}
      u.onend=fin;u.onerror=fin
      // Chrome глушит длинную речь примерно через 15 секунд и не присылает onend —
      // периодический resume() не даёт ему уснуть, иначе между фразами возникают провалы.
      keep=setInterval(()=>{try{
        if(speechSynthesis.speaking){speechSynthesis.resume();return}
        if(started)fin()          // закончил и не прислал onend
      }catch(e){}},1500)
      setTimeout(fin,1500+text.length*75)
      speechSynthesis.speak(u)
    }catch(e){_jvNoVoice=true;setTimeout(res,jvReadMs(text))}
  })
}
const jvWait=ms=>new Promise(r=>setTimeout(r,ms))

// ── Подсветка элемента ──
async function jvSpotEl(sel,label){
  const el=typeof sel==='string'?document.querySelector(sel):sel
  jvClearSpot()
  if(!el)return
  el.scrollIntoView({behavior:'smooth',block:'center'})
  // рамка ставится по координатам ПОСЛЕ прокрутки, иначе при скролле она встаёт мимо цели
  await jvWait(180)
  // подпись не нужна, когда подсвечиваем карточку внутри списка

  if(_jvAbort)return
  const r=el.getBoundingClientRect()
  const pad=10
  const box=document.createElement('div')
  box.className='jv-spot'
  box.style.cssText=`position:fixed;left:${r.left-pad}px;top:${r.top-pad}px;width:${r.width+pad*2}px;height:${r.height+pad*2}px;`
  if(label){const b=document.createElement('i');b.textContent=label;box.appendChild(b)}
  document.body.appendChild(box)
  jvBlip(760+Math.random()*320)
}

async function jvTodayData(){

  const yest=await jvBothYesterday()

  // 3. инсайты — только счётчики
  const ins=(GRIND||[]).filter(g=>g.created_at>=new Date(since).toISOString())
  const byType={};ins.forEach(g=>{const t=g.gtype||'insight';byType[t]=(byType[t]||0)+1})

  // 4. РК в работе — оба баера, все гео, дроп включительно, выключенные не в счёт
  const mine=zWorkingAll()
  const byGeo={};mine.forEach(z=>{const g=z.geo||z.region||'—';byGeo[g]=(byGeo[g]||0)+1})

  // 5. задачи на сегодня — только на экран, голосом здесь не читаются
  const todo=TASKS.filter(t=>t.col==='todo'&&(!me||t.assignee===me))
  const due=TASKS.filter(t=>t.deadline&&t.deadline<todayISO()&&t.col!=='done'&&t.col!=='archived'&&(!me||t.assignee===me))

  return{me,sales,bySrc,yest,ins,byType,mine,byGeo,todo,due}
}
// ── Данные по обоим регионам сразу ──
// METRICS хранит только активный регион, поэтому за вчера тянем оба напрямую.
async function jvBothYesterday(){
  const y=new Date(Date.now()-864e5).toISOString().slice(0,10)
  const out={}
  for(const r of ['PL','CZ']){
    try{
      const{data}=await db.from('metrics_daily').select('*').eq('region',r).eq('day',y).limit(1)
      const m=(data||[])[0]
      out[r]=m?{spend:(+m.spend_pl||0)+(+m.spend_plua||0),leads:(+m.leads_pl||0)+(+m.leads_plua||0),
                quals:+m.quals||0,cpl:+m.cpl||0,cql:+m.cql||0}:null
    }catch(e){out[r]=null}
  }
  return out
}
// Тенденция за три дня — по расходу и CQL.
// Смотрим именно на цену квала: дешёвый лид, который никто не квалифицирует, ничего не стоит.
async function jvTrend3(region){
  try{
    const from=new Date(Date.now()-3*864e5).toISOString().slice(0,10)
    const{data}=await db.from('metrics_daily').select('*').eq('region',region).gte('day',from).order('day',{ascending:true})
    const rows=(data||[]).slice(-3)
    if(rows.length<2)return null
    const sp=rows.map(r=>(+r.spend_pl||0)+(+r.spend_plua||0))
    // если cql в строке не посчитан — считаем сами из расхода и квалов
    const cqlAll=rows.map(r=>{const c=+r.cql||0;if(c>0)return c
      const sr=(+r.spend_pl||0)+(+r.spend_plua||0),q=+r.quals||0;return q>0?sr/q:0})
    const cq=cqlAll.filter(x=>x>0)
    const quals=rows.reduce((a,r)=>a+(+r.quals||0),0)
    const dS=sp[sp.length-1]-sp[0]
    const dQ=cq.length>1?cq[cq.length-1]-cq[0]:0
    const base=cq[0]||0
    return{days:rows.length,region,
      spendDelta:dS,spendFrom:sp[0],spendTo:sp[sp.length-1],
      cqlDelta:dQ,cqlFrom:cq[0]||0,cqlTo:cq[cq.length-1]||0,quals,
      noQuals:quals===0,
      spendUp:dS>sp[0]*.15,spendDown:dS<-sp[0]*.15,
      cqlUp:base?dQ>base*.12:dQ>4,cqlDown:base?dQ<-base*.12:dQ<-4}
  }catch(e){return null}
}
function jvTrendWords(t,regName){
  if(!t)return ''
  const q=`Было ${Math.round(t.cqlFrom)} долларов, стало ${Math.round(t.cqlTo)}.`
  if(t.noQuals)            return `${regName}: за три дня ни одного квала. Тенденцию тут считать не из чего, сэр.`
  if(t.cqlDown&&t.spendUp) return `${regName}: льём больше, а квал дешевеет. ${q} Лучший из возможных раскладов, сэр.`
  if(t.cqlUp&&t.spendUp)   return `${regName}: и расход, и цена квала растут. ${q} Так делать не стоит, сэр.`
  if(t.cqlUp)              return `${regName}: квал за три дня дорожает. ${q} Стоит вмешаться, пока это не вошло в привычку.`
  if(t.cqlDown)            return `${regName}: квал за три дня дешевеет. ${q} Направление верное.`
  if(t.spendDown)          return `${regName}: расход просел, цена квала держится. Мы притормозили намеренно?`
  if(t.spendUp)            return `${regName}: расход растёт, цена квала на месте.`
  return `${regName}: за три дня без заметных движений. ${q}`
}

async function jarvisBrief(){
  if(!jvAllowed())return
  if(_jvRunning)return
  jvBriefMark()   // ручной брифинг тоже закрывает день: второй раз сам не полезет
  _jvAbort=false;_jvRunning=true;_jvNoVoice=false
  try{speechSynthesis.cancel()}catch(e){}
  await jvEnsureVoices()
  const startRegion=CURRENT_REGION
  const own=await jvTrackStart()
  if(!own)jvMusicStart()
  jvHud(true,'')
  // Каждая сцена изолирована: если что-то упало на статистике, задачи и финал всё равно прозвучат.
  const phase=async(fn,label)=>{
    if(_jvAbort)return
    try{await fn()}catch(e){console.log('Геннадий: сбой на этапе «'+label+'» —',e&&e.message)}
  }
  const name=(CURRENT_USER&&CURRENT_USER.name)||''
  const h=new Date().getHours()
  const greet=h<5?'Доброй ночи':h<12?'Доброе утро':h<18?'Добрый день':'Добрый вечер'
  await phase(()=>jvSay(`${greet}, ${name}. Все системы в норме. Позвольте ввести вас в курс дела.`),'приветствие')
  await phase(jvPhaseToday,'события суток')
  await phase(()=>jvPhaseStats('PL',true),'статистика PL')
  await phase(()=>jvPhaseStats('CZ',false),'статистика CZ')
  await phase(async()=>{if(CURRENT_REGION!==startRegion&&typeof switchRegion==='function'){await switchRegion(startRegion);await jvWait(700)}},'возврат региона')
  await phase(jvPhaseTasks,'задачи')
  await phase(()=>jvSay(JV_PICK(JV_BYE)),'прощание')
  jvClearSpot()
  if(!_jvAbort){
    const nb=document.getElementById('nb-tasks');if(nb)nb.click()
    jvHud(true,'Брифинг завершён')
    await jvWait(900);jvHud(false)
    await jvOutro(10000)          // 10 секунд музыки с плавным затуханием
  }else{jvHud(false);jvMusicStop();jvTrackStop()}
  _jvRunning=false
}

async function jvAutoListen(){

  if(localStorage.getItem('jdl_mic_auto')==='0')return
  try{
    if(!navigator.permissions)return
    const st=await navigator.permissions.query({name:'microphone'})
    if(st.state==='granted'){jvListen();return}
    // разрешили позже — включаемся сразу, без повторного клика
    st.onchange=()=>{if(st.state==='granted'&&!_jvListening)jvListen()}

// ── Брифинг сам запускается один раз в сутки ──
// Либо при первом заходе за день, либо в 9:00, если вкладка была открыта раньше.
// Дальше — только по кнопке или голосом: «Геннадий, брифинг».
const JV_BRIEF_HOUR=9
function jvBriefDone(){return localStorage.getItem('jdl_brief_day')===todayISO()}
function jvBriefMark(){localStorage.setItem('jdl_brief_day',todayISO())}
function jvBriefReset(){localStorage.removeItem('jdl_brief_day');console.log('Брифинг за сегодня сброшен — перезагрузи страницу')}
// вкладка живёт сутками: раз в минуту проверяем, не наступило ли утро
function jvBriefClock(){
  setInterval(()=>{
    if(!jvOn()||_jvRunning||jvBriefDone())return
    if(new Date().getHours()<JV_BRIEF_HOUR)return
    jvBriefMark()
    console.log('Геннадий: утренний брифинг')
    jarvisBrief()
  },60000)
}

// Звук в браузере требует жеста пользователя. Пробуем стартовать сразу;
// если контекст заблокирован — показываем ненавязчивую кнопку.
function jarvisMaybeStart(){
  if(!jvOn())return
  jvBriefClock()
  // уже отчитался сегодня — молчим, ждём вызова
  if(jvBriefDone()){console.log('Геннадий: брифинг за сегодня уже был. Кнопка ГЕННАДИЙ или «Геннадий, брифинг».');return}
  jvBriefMark()
  const go=()=>{document.getElementById('jv-unlock')?.remove();jarvisBrief()}
  try{
    const AC=window.AudioContext||window.webkitAudioContext
    if(!AC)return
    _jvAudio=_jvAudio||new AC()
    if(_jvAudio.state==='running'){go();return}
    _jvAudio.resume().then(()=>{
      if(_jvAudio.state==='running')go();else jvUnlockBtn(go)
    }).catch(()=>jvUnlockBtn(go))
  }catch(e){jvUnlockBtn(go)}
}
function jvUnlockBtn(go){
  if(document.getElementById('jv-unlock'))return
  const b=document.createElement('button');b.id='jv-unlock'
  b.innerHTML='<span>▶</span> Брифинг Геннадия'
  b.onclick=go

  setTimeout(()=>b.remove(),25000)
}

function drawChart(rows){chartData=rows;const c=document.getElementById('dyn-chart');if(!c)return;c.width=c.parentElement.offsetWidth||600;c.height=130;renderChart(true)}
function renderChart(animate=false){
  if(!chartData||!chartData.length)return
  const rows=chartData,c=document.getElementById('dyn-chart'),ctx=c.getContext('2d')
  const W=c.width,H=c.height,P={t:10,b:22,l:10,r:10},cw=W-P.l-P.r,ch=H-P.t-P.b
  ctx.clearRect(0,0,W,H)
  const activeMets=new Set([...(document.querySelectorAll('.chleg.active')||[])].map(el=>el.dataset.cmet))
  // For CPL/CQL: 0 means no leads/quals that day → break the line (null), don't drop to bottom
  const nz=v=>{const n=parseFloat(v);return n>0?n:null}
  const allS=[
    {k:'cpl',d:rows.map(r=>nz(r.cpl)),c:'#6E9BFF',l:'CPL',gap:true},
    {k:'cql',d:rows.map(r=>nz(r.cql)),c:'#D4AF37',l:'CQL',gap:true},
    {k:'ctr',d:rows.map(r=>nz(r.ctr)),c:'#3DBE8B',l:'CTR',gap:true},
    {k:'spend',d:rows.map(r=>parseFloat(r.spend_pl||0)+parseFloat(r.spend_plua||0)),c:'#F03A55',l:'Spend'}
  ]
  const S=allS.filter(s=>activeMets.size===0||activeMets.has(s.k))
  // ghost (prev period) series
  const GH=(window._chartPrev&&document.getElementById('chleg-ghost')?.classList.contains('active'))?allS.filter(s=>activeMets.size===0||activeMets.has(s.k)).map(s=>({k:s.k,c:s.c,d:window._chartPrev.map(r=>s.k==='cpl'?nz(r.cpl):s.k==='cql'?nz(r.cql):s.k==='ctr'?nz(r.ctr):(parseFloat(r.spend_pl||0)+parseFloat(r.spend_plua||0)))})):[]
  S.forEach((s,i)=>{const g=GH.find(x=>x.k===s.k);const vals=[...s.d,...(g?g.d:[])].filter(v=>v!=null);s.mn=vals.length?Math.min(...vals):0;s.mx=vals.length?Math.max(...vals):1;if(s.mx===s.mn)s.mx=s.mn+1;if(g){g.mn=s.mn;g.mx=s.mx}})
  const n=rows.length,xs=n>1?cw/(n-1):0,px=i=>P.l+i*xs,py=(v,s)=>P.t+ch*(1-(v-s.mn)/(s.mx-s.mn))
  ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=1
  for(let i=0;i<=4;i++){const y=P.t+ch*i/4;ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cw,y);ctx.stroke()}
  GH.forEach(s=>{ctx.save();ctx.globalAlpha=.4;ctx.setLineDash([4,4]);let st=false;for(let i=0;i<Math.min(n,s.d.length);i++){if(s.d[i]==null){st=false;continue}if(!st){ctx.beginPath();ctx.moveTo(px(i),py(s.d[i],s));st=true}else ctx.lineTo(px(i),py(s.d[i],s));if(i===n-1||s.d[i+1]==null){ctx.strokeStyle=s.c;ctx.lineWidth=1.2;ctx.stroke()}}ctx.restore()})
  S.forEach(s=>{
    ctx.save()
    // Draw line in continuous segments, breaking at null values
    let segStart=-1
    const drawSeg=(a,b)=>{
      if(b<=a)return
      // gradient fill under segment
      ctx.beginPath();ctx.moveTo(px(a),H-P.b);ctx.lineTo(px(a),py(s.d[a],s))
      for(let i=a+1;i<=b;i++){const x0=px(i-1),y0=py(s.d[i-1],s),x1=px(i),y1=py(s.d[i],s),cx=(x0+x1)/2;ctx.bezierCurveTo(cx,y0,cx,y1,x1,y1)}
      ctx.lineTo(px(b),H-P.b);ctx.closePath()
      const g=ctx.createLinearGradient(0,P.t,0,H-P.b);g.addColorStop(0,s.c+'33');g.addColorStop(1,s.c+'00');ctx.fillStyle=g;ctx.fill()
      // stroke
      ctx.beginPath();ctx.moveTo(px(a),py(s.d[a],s))
      for(let i=a+1;i<=b;i++){const x0=px(i-1),y0=py(s.d[i-1],s),x1=px(i),y1=py(s.d[i],s),cx=(x0+x1)/2;ctx.bezierCurveTo(cx,y0,cx,y1,x1,y1)}
      ctx.strokeStyle=s.c;ctx.lineWidth=2;ctx.stroke()
    }
    for(let i=0;i<n;i++){
      if(s.d[i]!=null){
        if(segStart<0)segStart=i
      }else{
        if(segStart>=0){drawSeg(segStart,i-1);segStart=-1}
      }
    }
    if(segStart>=0)drawSeg(segStart,n-1)
    // dots only where data exists; isolated points (no neighbours) get a bigger ringed dot so they're visible
    for(let i=0;i<n;i++){
      if(s.d[i]==null)continue
      const isolated=(i===0||s.d[i-1]==null)&&(i===n-1||s.d[i+1]==null)
      ctx.beginPath();ctx.arc(px(i),py(s.d[i],s),isolated?4.5:3,0,Math.PI*2);ctx.fillStyle=s.c;ctx.fill()
      if(isolated){ctx.beginPath();ctx.arc(px(i),py(s.d[i],s),7,0,Math.PI*2);ctx.strokeStyle=s.c;ctx.lineWidth=1.5;ctx.globalAlpha=.5;ctx.stroke();ctx.globalAlpha=1}
    }
    ctx.restore()
  })
  ctx.fillStyle='rgba(144,144,168,.6)';ctx.font='10px Manrope,sans-serif';ctx.textAlign='center'
  const li=[0,Math.floor((n-1)/2),n-1].filter((v,i,a)=>a.indexOf(v)===i)
  li.forEach(i=>ctx.fillText(rows[i]?.day?.slice(5)||'',px(i),H-4))
  c._S=S;c._rows=rows;c._P=P;c._cw=cw;c._ch=ch
  // Draw-in animation — smooth brush stroke per line using clip
  if(animate&&n>1){
    const FRAMES=120        // total frames for one line
    const STAGGER=50        // frames delay between lines
    const TOTAL=FRAMES + S.length*STAGGER
    let frame=0

    function animFrame(){
      frame++
      ctx.clearRect(0,0,W,H)

      // Grid lines
      ctx.save()
      ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=1
      for(let i=0;i<=4;i++){const y=P.t+ch*i/4;ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cw,y);ctx.stroke()}
      ctx.restore()

      S.forEach((s,si)=>{
        const lineStart=si*STAGGER
        const lf=frame-lineStart
        if(lf<=0)return

        // ease in-out cubic for ultra smooth motion
        const raw=Math.min(lf/FRAMES,1)
        const p=raw<0.5?4*raw*raw*raw:(raw-1)*(2*raw-2)*(2*raw-2)+1

        ctx.save()
        // Clip to left portion of chart as line "draws"
        const clipX=P.l+p*cw+4
        ctx.beginPath()
        ctx.rect(0,0,clipX,H)
        ctx.clip()

        // Draw in gap-aware segments (break where s.d[i]==null)
        const segs=[]
        let ss=-1
        for(let i=0;i<n;i++){
          if(s.d[i]!=null){if(ss<0)ss=i}
          else{if(ss>=0){segs.push([ss,i-1]);ss=-1}}
        }
        if(ss>=0)segs.push([ss,n-1])

        segs.forEach(([a,b])=>{
          if(b<=a){
            // single point — just a dot handled below
            return
          }
          // Gradient fill
          ctx.beginPath()
          ctx.moveTo(px(a),H-P.b)
          ctx.lineTo(px(a),py(s.d[a],s))
          for(let i=a+1;i<=b;i++){const x0=px(i-1),y0=py(s.d[i-1],s),x1=px(i),y1=py(s.d[i],s),cxm=(x0+x1)/2;ctx.bezierCurveTo(cxm,y0,cxm,y1,x1,y1)}
          ctx.lineTo(px(b),H-P.b);ctx.closePath()
          const g=ctx.createLinearGradient(0,P.t,0,H-P.b);g.addColorStop(0,s.c+'45');g.addColorStop(1,s.c+'00');ctx.fillStyle=g;ctx.fill()
          // Stroke with glow
          ctx.beginPath();ctx.moveTo(px(a),py(s.d[a],s))
          for(let i=a+1;i<=b;i++){const x0=px(i-1),y0=py(s.d[i-1],s),x1=px(i),y1=py(s.d[i],s),cxm=(x0+x1)/2;ctx.bezierCurveTo(cxm,y0,cxm,y1,x1,y1)}
          ctx.strokeStyle=s.c;ctx.lineWidth=2;ctx.shadowColor=s.c;ctx.shadowBlur=8;ctx.stroke();ctx.shadowBlur=0
        })

        // Dots fade in as line passes them; isolated points get a bigger ringed dot
        for(let i=0;i<n;i++){
          if(s.d[i]==null)continue
          const dotX=px(i)
          if(dotX>clipX)continue
          const dotProgress=Math.min(1,(clipX-dotX)/20)
          const isolated=(i===0||s.d[i-1]==null)&&(i===n-1||s.d[i+1]==null)
          const dy=py(s.d[i],s)
          ctx.beginPath()
          ctx.arc(dotX,dy,(isolated?4.5:2.5)*dotProgress,0,Math.PI*2)
          ctx.fillStyle=s.c
          ctx.globalAlpha=dotProgress
          ctx.fill()
          if(isolated){ctx.beginPath();ctx.arc(dotX,dy,7*dotProgress,0,Math.PI*2);ctx.strokeStyle=s.c;ctx.lineWidth=1.5;ctx.globalAlpha=dotProgress*.5;ctx.stroke()}
          ctx.globalAlpha=1
        }

        ctx.restore()
      })

      // X-axis labels
      ctx.fillStyle='rgba(144,144,168,.6)'
      ctx.font='10px Manrope,sans-serif'
      ctx.textAlign='center'
      li.forEach(i=>ctx.fillText(rows[i]?.day?.slice(5)||'',px(i),H-4))

      if(frame<TOTAL)requestAnimationFrame(animFrame)
    }
    requestAnimationFrame(animFrame)
  }
}

async function fetchCampaignMetrics(z){
  const el=document.getElementById('ex-metrics-'+z.id)
  if(!el)return
  try{
    // Parse date_start from zaliv date field
    let since=null
    const raw=z.date||''
    if(raw){
      const p=raw.split('.')
      if(p.length===2){
        const yr=new Date().getFullYear()
        since=`${yr}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`
      }
    }
    if(!since&&z.created_at)since=z.created_at.split('T')[0]
    const until=new Date().toISOString().split('T')[0]

    const r=await fetch(SB_URL+'/functions/v1/get-campaigns',{
      method:'POST',
      headers:{'Authorization':'Bearer '+SB_ANON,'Content-Type':'application/json'},
      body:JSON.stringify({action:'get_campaign_insights',campaign_id:z.campaign_id,since,until,region:CURRENT_REGION})
    })
    const d=await r.json()
    if(!d.ok||d.error){
      el.innerHTML='<div style="font-size:11px;color:var(--red)">Ошибка: '+(d.error||'Meta API')+'</div>'
      return
    }
    const cplColor=d.cpl>0&&d.cpl<10?'var(--green)':d.cpl<15?'var(--yellow)':d.cpl>0?'var(--red)':'var(--text)'
    el.innerHTML=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">
      <div style="background:var(--bg5);border-radius:5px;padding:7px 9px;text-align:center">
        <div style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">SPEND</div>
        <div style="font-size:16px;font-weight:800;color:var(--yellow);font-family:var(--mono)">$${d.spend}</div>
        <div style="font-size:9px;color:var(--text3)">${d.days}д · $${d.spend_daily}/д</div>
      </div>
      <div style="background:var(--bg5);border-radius:5px;padding:7px 9px;text-align:center">
        <div style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">CPL</div>
        <div style="font-size:16px;font-weight:800;color:${cplColor};font-family:var(--mono)">${d.cpl>0?'$'+d.cpl:'—'}</div>
        <div style="font-size:9px;color:var(--text3)">CTR: ${d.ctr}%</div>
      </div>
      <div style="background:var(--bg5);border-radius:5px;padding:7px 9px;text-align:center">
        <div style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">LEADS</div>
        <div style="font-size:16px;font-weight:800;color:#fff;font-family:var(--mono)">${d.leads}</div>
        <div style="font-size:9px;color:var(--text3)">${d.clicks} кликов</div>
      </div>
    </div>`
  }catch(e){
    if(el)el.innerHTML='<div style="font-size:11px;color:var(--red)">Ошибка загрузки</div>'
  }
}

async function setScore(id,score){
  const z=ZALIVS.find(x=>x.id===id);if(!z)return
  const isLocked=AUTO_STATUS_LOCKED.includes(z.status)
  let newStatus=z.status;if(!isLocked)newStatus=scoreToAutoStatus(score)
  // Intercept OFF transition — предлагаем архивировать крео
  if(!isLocked&&newStatus==='OFF'&&z.status!=='OFF'&&(z.creos||[]).length>0){
    // Сначала сохраняем score, потом интерсептим
    await db.from('zalivs').update({score,updated_at:new Date().toISOString()}).eq('id',id)
    z.score=score
    if(interceptOFF(id))return // модал открыт, статус применится позже
  }
  await db.from('zalivs').update({score,status:newStatus,updated_at:new Date().toISOString()}).eq('id',id)
  const prev=z.status;z.score=score
  if(!isLocked&&newStatus!==prev){z.status=newStatus;toast(`Score ${score} → ${prev} → ${newStatus}`,'info')}
  rzalivs()
}

  const sm={};f.forEach(s=>{const src=s.source||'Неизвестно';if(!sm[src])sm[src]={count:0,amount:0};sm[src].count++;sm[src].amount+=s.saleAmount||0})

async function saveTk(title,col,who,extra){
  if(!title||!title.trim())return
  const maxSo=TASKS.filter(t=>t.col===col).reduce((mx,t)=>Math.max(mx,t.sort_order||0),0)
  const row={title:title.trim(),col,assignee:who||'',deadline:extra?.deadline||null,sort_order:maxSo+10,
    ttype:extra?.ttype||'other',rk_id:extra?.rk_id||null,rk_name:extra?.rk_name||null,rk_region:extra?.rk_region||null,
    started_at:col==='process'?new Date().toISOString():null,time_spent:0}
  const{data,error}=await db.from('tasks').insert(row).select().single()
  if(!error&&data){TASKS.push(data);rtasks();return data}
  if(error)toast('Ошибка: '+error.message,'err')
}
async function delTkConfirmed(id){await db.from('tasks').delete().eq('id',id);TASKS=TASKS.filter(t=>t.id!==id);rtasks()}

// ── column change with timer ──
async function moveTask(t,newCol){
  if(t.col===newCol)return
  const now=new Date().toISOString();const upd={col:newCol,updated_at:now}
  if(newCol==='process'){upd.started_at=now}
  else if(t.col==='process'&&t.started_at){upd.time_spent=(t.time_spent||0)+Math.round((Date.now()-new Date(t.started_at).getTime())/1000);upd.started_at=null}
  if(newCol==='done'){upd.done_at=now}
  Object.assign(t,upd)
  const{error}=await db.from('tasks').update(upd).eq('id',t.id)
  if(error){const r2=await db.from('tasks').update({col:newCol,updated_at:now}).eq('id',t.id);if(r2.error)toast('Ошибка: '+r2.error.message,'err');else toast('Таймер не сохранён — выполни SQL для tasks','err')}
}

// ── auto-create FDC when RK is added ──
async function backfillFdc(){const y=new Date(Date.now()-864e5).toISOString().slice(0,10)
  // fix assignee of existing FDC tasks by RK letter
  for(const t of TASKS){if(t.ttype!=='fdc'||!t.rk_name)continue;const who=parseBuyerFromName(t.rk_name);if(who&&t.assignee!==who){t.assignee=who;db.from('tasks').update({assignee:who}).eq('id',t.id)}}
  for(const z of ZALIVS){if(z.togo||z.ind==='off')continue;const d=parseDateFromCampName(z.name);if(!d)continue;const p=d.split('.');const dl=`${new Date().getFullYear()}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;if(dl<y)continue;await autoFdcTask(z)}}
async function autoFdcTask(z){
  if(!z||!db||z.togo||z.ind==='off')return
  const nm=(z.name||'').trim().toLowerCase()
  if(TASKS.some(t=>t.ttype==='fdc'&&(t.rk_id===z.id||(t.rk_name||'').trim().toLowerCase()===nm)))return
  const d=parseDateFromCampName(z.name);let dl=todayISO()
  if(d){const p=d.split('.');if(p.length===2)dl=`${new Date().getFullYear()}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`}
  const who=parseBuyerFromName(z.name)||z.buyer||''
  // scheduled: lands in TO DO at 09:00 on its day (see rollover)
  const col=(dl<todayISO()||(dl===todayISO()&&new Date().getHours()>=9))?'todo':'all'
  await saveTk('FDC · '+z.name.slice(0,44),col,who,{deadline:dl,ttype:'fdc',rk_id:z.id,rk_name:z.name,rk_region:z.region||CURRENT_REGION})
}

function moneyRain(){const box=document.createElement('div');box.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden';document.body.appendChild(box);const T=5000
  for(let i=0;i<120;i++){const s=document.createElement('span');const x=Math.random()*100,delay=Math.random()*3200,dur=2600+Math.random()*1800,sz=16+Math.random()*22,g=Math.random()<.45,sway=(Math.random()-.5)*10,rot=(Math.random()-.5)*160
    s.textContent=Math.random()<.85?'$':'💵';s.style.cssText=`position:absolute;left:${x}vw;top:-8vh;font:400 ${sz}px var(--mono);color:${g?'#3DBE8B':'#F0D98A'};text-shadow:0 0 10px ${g?'rgba(61,190,139,.7)':'rgba(240,217,138,.7)'};opacity:0;will-change:transform,opacity`
    s.animate([{transform:'translate(0,0) rotate(0deg)',opacity:0},{opacity:.95,offset:.08},{transform:`translate(${sway}vw,55vh) rotate(${rot/2}deg)`,opacity:.95,offset:.55},{transform:`translate(${sway*1.6}vw,112vh) rotate(${rot}deg)`,opacity:.6}],{duration:dur,delay,easing:'linear',fill:'forwards'});box.appendChild(s)}
  setTimeout(()=>{box.style.transition='opacity .6s';box.style.opacity='0';setTimeout(()=>box.remove(),700)},T)}
async function doneTask(id){const t=TASKS.find(x=>x.id===id);if(!t)return;await moveTask(t,'done');rtasks()}
function rolloverTodayTasks(){
  const td=todayISO(),h=new Date().getHours();let n=0
  TASKS.forEach(t=>{if(t.col!=='all'||!t.deadline||t.deadline>td)return;if(t.ttype==='fdc'&&t.deadline===td&&h<9)return;t.col='todo';db.from('tasks').update({col:'todo',updated_at:new Date().toISOString()}).eq('id',t.id);n++})
  if(n){rtasks();if(typeof rdash==='function')rdash();toast('В TO DO: '+n+' задач на сегодня','ok')}return n
}
function scheduleRollover(){const now=new Date();const t0=new Date(now);t0.setHours(24,0,5,0);const t9=new Date(now);t9.setHours(9,0,5,0);if(t9<=now)t9.setDate(t9.getDate()+1);const next=Math.min(t0-now,t9-now);setTimeout(()=>{rolloverTodayTasks();scheduleRollover()},next)}

// ── STATS ──
function taskStats(){
  const per=+document.getElementById('tf-per')?.value||7;const uf=document.getElementById('tf-u')?.value||'';const tf=document.getElementById('tf-type')?.value||''
  const from=per?new Date(Date.now()-(per-1)*864e5).toISOString().split('T')[0]:'0000'
  const pool=TASKS.filter(t=>(!uf||t.assignee===uf)&&(!tf||(t.ttype||'other')===tf)&&(t.col==='done'||t.col==='archived'||t.col==='process')&&((t.done_at||t.updated_at||'').slice(0,10)>=from||t.col==='process'))
  const byType={};let total=0
  pool.forEach(t=>{const k=t.ttype||'other';const ms=taskElapsed(t);byType[k]=byType[k]||{n:0,ms:0};byType[k].n++;byType[k].ms+=ms;total+=ms})
  const todayMs=TASKS.filter(t=>(!uf||t.assignee===uf)&&((t.done_at||'').slice(0,10)===todayISO()||t.col==='process')).reduce((s,t)=>s+taskElapsed(t),0)
  return{byType,total,todayMs,n:pool.length}
}
function renderStats(){
  const el=document.getElementById('tstat');if(!el)return
  const s=taskStats()
  el.innerHTML=`<div class="tsh"><b>⏱ Время по задачам</b><span style="font-size:11px;color:var(--text3)">за ${({1:'сегодня',7:'неделю',30:'месяц',0:'всё время'})[+document.getElementById('tf-per').value]} · ${s.n} задач</span><span style="margin-left:auto;font:700 13px var(--mono);color:var(--yellow)">Σ ${fmtDur(s.total)}</span><span style="font:600 11px var(--mono);color:var(--green)">сегодня ${fmtDur(s.todayMs)}</span></div>
  <div class="tsg">${Object.keys(TTYPES).map(k=>{const v=s.byType[k]||{n:0,ms:0};return`<div class="tsc"><div class="k"><i style="width:7px;height:7px;border-radius:50%;background:${TTCOL[k]};display:inline-block"></i>${TTYPES[k]}</div><div class="v">${fmtDur(v.ms)}</div><div class="s">${v.n} задач · avg ${v.n?fmtDur(v.ms/v.n):'—'}</div></div>`}).join('')}</div>
  <div class="tsbar">${Object.keys(TTYPES).map(k=>{const v=s.byType[k]||{ms:0};const w=s.total?v.ms/s.total*100:0;return w?`<i style="width:${w}%;background:${TTCOL[k]}" title="${TTYPES[k]} ${Math.round(w)}%"></i>`:''}).join('')}</div>`
}

function tcard(t){

  const el=taskElapsed(t),tt=t.ttype||'other'
  return`<div class="tcard ${ov?'tdue':isT?'ttoday':''}" draggable="true" id="tc-${t.id}" data-id="${t.id}">
    <div class="tnm">${t.title}</div>
    ${t.rk_name?`<div style="margin-bottom:6px"><span class="trk" data-zid="${t.rk_id||0}" data-region="${t.rk_region||''}" title="Открыть РК" style="cursor:pointer">${t.rk_region?t.rk_region+' · ':''}${t.rk_name} →</span></div>`:''}

      <span class="ttype ${tt}">${TTYPES[tt]}</span>
      ${t.assignee?`<span class="two">${t.assignee}</span>`:''}
      ${t.deadline?`<span class="tdl${ov?' ov':''}">${ov?'⚠ ':isT?'📌 ':''}${t.deadline.slice(5).split('-').reverse().join('.')}</span>`:''}

function buildJdlToday(){
  const since=Date.now()-864e5,sinceISO=new Date(since).toISOString();const td=todayISO()
  const ev=[]
  // new RK
  const newRk=(window._ALL_ZALIVS||ZALIVS).filter(z=>z.created_at>=sinceISO)
  if(newRk.length)ev.push(['#6E9BFF','Новые РК: '+newRk.length,newRk.slice(0,4).map(z=>z.name.slice(0,42)).join(' · ')])
  // analyses
  const newAn=RK_ANALYSES.filter(a=>a.created_at>=sinceISO)
  if(newAn.length)ev.push(['#3DBE8B','Анализов сделано: '+newAn.length,newAn.slice(0,4).map(a=>(a.zaliv_name||'').slice(0,30)+' — CPL $'+(a.cpl||0)).join(' · ')])
  // bad CPL from analyses last 24h
  // metrics today/yesterday
  const m=METRICS.slice(-2);if(m.length===2){const[y,t]=m;const sp=x=>+(x.spend_pl||0)+(+x.spend_plua||0);const dl=y.leads_pl+y.leads_plua;ev.push(['#D4AF37','Вчера · '+CURRENT_REGION,'спенд $'+Math.round(sp(y))+' · лиды '+dl+' · квалы '+(y.quals||0)+' · CPL $'+(y.cpl||0)+' · CQL $'+(y.cql||0)])}
  // tasks
  const doneT=TASKS.filter(t=>(t.done_at||'')>=sinceISO);const todoT=TASKS.filter(t=>t.col==='todo'&&(!CURRENT_USER||t.assignee===CURRENT_USER.name));const dueT=TASKS.filter(t=>t.deadline&&t.deadline<td&&t.col!=='done'&&t.col!=='archived')
  if(doneT.length)ev.push(['#3DBE8B','Закрыто задач: '+doneT.length,'время '+fmtDur(doneT.reduce((s,t)=>s+taskElapsed(t),0))])
  if(dueT.length)ev.push(['#F03A55','Просрочено задач: '+dueT.length,dueT.slice(0,3).map(t=>t.title.slice(0,36)).join(' · ')])
  if(todoT.length)ev.push(['#6E9BFF','На сегодня в TO DO: '+todoT.length,todoT.slice(0,4).map(t=>t.title.slice(0,36)).join(' · ')])
  // sales
  const pdt=s=>{if(!s)return null;if(s.includes('-'))return new Date(s);const p=s.split('.');return p.length===3?new Date(p[2]+'-'+p[1]+'-'+p[0]):null};const sl=(SALES_DATA||[]).filter(s=>{const d=pdt(s.createdAt);return d&&d.getTime()>=since});if(sl.length)ev.push(['#D4AF37','Продажи за 24ч: '+sl.length,sl.reduce((a,s)=>a+(s.saleAmount||0),0).toLocaleString('ru')+' '+cur()])
  const ins=GRIND.filter(g=>g.created_at>=sinceISO)
  return{ev,ins}
}
// ── Содержимое сводки TODAY ──
// Тот же порядок, в котором Геннадий её проговаривает: продажи, вчера по обоим регионам,
// Grind, РК в работе, задачи. Секции помечены data-jt, чтобы подсветка попадала точно.
async function jtSections(){
  const since=Date.now()-864e5, sinceISO=new Date(since).toISOString()
  const me=(CURRENT_USER&&CURRENT_USER.name)||''
  const S={}

  // 1) Продажи и с каких калькуляторов
  const pdt=s=>{if(!s)return null;if(s.includes('-'))return new Date(s);const p=s.split('.');return p.length===3?new Date(p[2]+'-'+p[1]+'-'+p[0]):null}
  const sales=(SALES_DATA||[]).filter(s=>{const d=pdt(s.createdAt);return d&&d.getTime()>=since})
  const bySrc={}
  sales.forEach(s=>{const k=(srcParse(s.source||'').key)||(s.source||'без источника');bySrc[k]=(bySrc[k]||0)+1})
  S.sales={n:sales.length,sum:sales.reduce((a,s)=>a+(+s.saleAmount||0),0),
           src:Object.entries(bySrc).sort((a,b)=>b[1]-a[1])}

  // 2) Вчера по обоим регионам
  S.yday=await jvBothYesterday()

  // 3) Grind
  S.grind=(GRIND||[]).filter(g=>g.created_at>=sinceISO)

  // 4) РК в работе — активные кампании обоих баеров по всем гео.
  // «В работе» = не в to-go и не выключена. На дропе кампания тоже в работе, её просто не трогают.
  const work=zWorkingAll()
  const byGeo={},byBuyer={}
  work.forEach(z=>{const g=z.geo||z.region||'—';byGeo[g]=(byGeo[g]||0)+1
                   const b=z.buyer||'без баера';byBuyer[b]=(byBuyer[b]||0)+1})
  S.rk={n:work.length,
        geo:Object.entries(byGeo).sort((a,b)=>b[1]-a[1]),
        buyers:Object.entries(byBuyer).sort((a,b)=>b[1]-a[1]),
        drop:work.filter(z=>z.ind==='drop').length,
        profit:work.filter(z=>z.ind==='profit').length,
        buyer:me}

  // 5) Задачи на сегодня (в модалке пишем, голосом не читаем)
  const td=todayISO()
  S.tasks={
    todo:TASKS.filter(t=>t.col==='todo'&&(!me||t.assignee===me)),
    due:TASKS.filter(t=>t.deadline&&t.deadline<td&&t.col!=='done'&&t.col!=='archived'&&(!me||t.assignee===me))
  }
  return S
}

var dragOverEl=null,dragOverPos=null

document.addEventListener('dragstart',e=>{
  const tc=e.target.closest('.tcard[data-id]');if(!tc)return
  dragId=parseInt(tc.dataset.id)
  e.dataTransfer.effectAllowed='move'
  e.dataTransfer.setData('text/plain',String(dragId))
  setTimeout(()=>tc.classList.add('dragging'),0)
})

document.addEventListener('dragend',()=>{
  document.querySelectorAll('.tcard.dragging,.tcard.drag-over-top,.tcard.drag-over-bot').forEach(t=>t.classList.remove('dragging','drag-over-top','drag-over-bot'))
  document.querySelectorAll('.kcol.dov').forEach(c=>c.classList.remove('dov'))
  dragId=null;dragOverEl=null;dragOverPos=null
})

document.addEventListener('dragover',e=>{
  e.preventDefault();e.dataTransfer.dropEffect='move'
  document.querySelectorAll('.tcard.drag-over-top,.tcard.drag-over-bot').forEach(t=>t.classList.remove('drag-over-top','drag-over-bot'))
  document.querySelectorAll('.kcol.dov').forEach(c=>c.classList.remove('dov'))
  const tc=e.target.closest('.tcard[data-id]')
  if(tc&&dragId&&parseInt(tc.dataset.id)!==dragId){
    const rect=tc.getBoundingClientRect()
    // Зона захвата — верхние 50% = вставить до, нижние 50% = вставить после
    dragOverPos=e.clientY<rect.top+rect.height*0.5?'top':'bot'
    dragOverEl=parseInt(tc.dataset.id)
    tc.classList.add(dragOverPos==='top'?'drag-over-top':'drag-over-bot')
  }else{
    dragOverEl=null;dragOverPos=null
    const col=e.target.closest('.kcol');if(col)col.classList.add('dov')
  }
})

document.addEventListener('drop',e=>{
  e.preventDefault()
  document.querySelectorAll('.tcard.drag-over-top,.tcard.drag-over-bot').forEach(t=>t.classList.remove('drag-over-top','drag-over-bot'))
  document.querySelectorAll('.kcol.dov').forEach(c=>c.classList.remove('dov'))
  if(!dragId)return

  const dragTask=TASKS.find(t=>t.id===dragId);if(!dragTask)return

  if(dragOverEl){
    const targetTask=TASKS.find(t=>t.id===dragOverEl);if(!targetTask)return
    const newCol=targetTask.col
    moveTask(dragTask,newCol)
    TASKS.splice(TASKS.indexOf(dragTask),1)
    const tIdx=TASKS.indexOf(targetTask)
    TASKS.splice(dragOverPos==='top'?tIdx:tIdx+1,0,dragTask)
  }else{
    const col=e.target.closest('.kcol')
    if(col){
      const newCol=col.id.replace('kc-','')
      if(dragTask.col!==newCol)moveTask(dragTask,newCol)
    }
  }

  // Save sort_order to Supabase
  saveTaskOrder()
  rtasks()
  dragId=null;dragOverEl=null;dragOverPos=null
})

function loadDocById(id){
  curDoc=id
  const all=[...jLoose,...jFolders.flatMap(f=>f.docs)],d=all.find(x=>String(x.id)===String(id))
  if(d){
    document.getElementById('j-title').value=d.title
    const ed=document.getElementById('jeditor')
    // Если хранится как HTML — ставим напрямую; если старый markdown — конвертим
    if(d.body&&(d.body.trim().startsWith('<')||d.body.trim()===''))ed.innerHTML=d.body||''
    else ed.innerHTML=d.body?mdToHtml(d.body):''
  }
  rtree()
}

function mdToHtml(md){
  return md
    .replace(/^# (.+)$/gm,'<h1>$1</h1>')
    .replace(/^## (.+)$/gm,'<h2>$1</h2>')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`(.+?)`/g,'<code>$1</code>')
    .replace(/^---$/gm,'<hr>')
    .replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>')
    .replace(/^- (.+)$/gm,'<li>$1</li>')
    .replace(/(<li>.*<\/li>\n?)+/g,s=>`<ul>${s}</ul>`)
    .replace(/(\|[^\n]+\|\n?)+/g,t=>{
      const rows=t.trim().split('\n');if(rows.length<2)return t
      const head=rows[0].split('|').filter(c=>c.trim()).map(c=>`<th>${c.trim()}</th>`).join('')
      const body=rows.slice(2).map(r=>'<tr>'+r.split('|').filter(c=>c.trim()).map(c=>`<td>${c.trim()}</td>`).join('')+'</tr>').join('')
      return`<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`
    })
    .replace(/\n/g,'<br>')
}

// ══════════════════════════════════════════
// Shared fuzzy signature for campaign-name matching — stable prefix (buyer+date+geo code),
// tolerant of trailing decorations added in Meta ("— 1-2-1", extra spaces, etc.)
function campKey(name){return(name||'').toLowerCase().replace(/\s+/g,'').slice(0,25)}
// Ядро названия: только буквы и цифры, без ведущего порядкового номера ("8D{13.09}..." → "d1309...").
// Переживает ручные правки в Meta/CRM — лишние слэши, пробелы, тире, "— 1-2-1" в конце.
function campCore(name){return(name||'').toLowerCase().replace(/^\s*\d+(?=[a-zа-я])/,'').replace(/[^a-z0-9]/g,'')}
// Скопированная в Meta кампания первое время носит имя оригинала с хвостом «- Copy».
// Если связать её в этот момент, она сядет на РК оригинала, а свой ID оригинал потеряет.
// Так случилось с 25D и 26D. Такие кампании не связываем автоматически — ждём переименования.
function isMetaCopy(name){return /(^|[\s\-—–_(])(copy|копия|kopia)(\s*\d+)?\s*\)?\s*$/i.test(String(name||'').trim())
  ||/\s-\s*copy\b/i.test(String(name||''))}
function fuzzyMatchZaliv(campName,pool){
  const nk=campKey(campName),nc=campCore(campName)
  // 1) совпадение по ядру — самое надёжное
  let m=pool.find(z=>{const zc=campCore(z.name);return zc===nc||(nc.length>=18&&zc.startsWith(nc.slice(0,18)))||(zc.length>=18&&nc.startsWith(zc.slice(0,18)))})
  if(m)return m
  // 2) запасной вариант — по сырому префиксу
  return pool.find(z=>{const zk=campKey(z.name);return zk===nk||zk.includes(nk.slice(0,15))||nk.includes(zk.slice(0,15))})
}
async function importCampaignsFromMeta(){
  if(!db)return
  setSS('syncing','Импорт РК из Meta...')
  try{
    // Читаем кампании напрямую из FB API
    const r=await fetch(SB_URL+'/functions/v1/get-campaigns',{
      method:'POST',
      headers:{'Authorization':'Bearer '+SB_ANON,'Content-Type':'application/json'},
      body:JSON.stringify({action:'get_campaigns',region:CURRENT_REGION,days:14})
    })
    if(!r.ok){
      toast('Нужно задеплоить get-campaigns функцию. Пока добавь РК вручную.','info')
      setSS('ok','—')
      return
    }
    const d=await r.json()
    if(!d.campaigns||!d.campaigns.length){setSS('ok','Нет новых РК');toast('Нет новых кампаний в Meta','info');return}

    const normName=n=>n.trim().replace(/\s+/g,' ').toLowerCase()
    const usedCampIds=new Set(ZALIVS.filter(z=>z.campaign_id).map(z=>z.campaign_id))
    let added=0,linked=0,skipped=0

    for(const camp of d.campaigns){
      if(nameRegion(camp.name)!==CURRENT_REGION)continue
      const campIdStr=String(camp.id)
      if(usedCampIds.has(campIdStr)){skipped++;continue} // already attached to some RK

      // 1) exact name match — same RK, just wire up the ID, don't touch anything the person set (cat, budget, tags...)
      if(isMetaCopy(camp.name)){skipped++;console.warn('импорт: пропущена копия — '+camp.name);continue}   // имя ещё от оригинала
      let target=ZALIVS.find(z=>!z.campaign_id&&normName(z.name)===normName(camp.name))
      // 2) fuzzy prefix match — RK created in CRM before Meta, name got extra suffix ("— 1-2-1") once actually launched in Ads Manager
      if(!target)target=fuzzyMatchZaliv(camp.name,ZALIVS.filter(z=>!z.campaign_id))

      if(target){
        // Only attach the ID + budget (for live spend pulls) — never overwrite cat/togo/score/buyer/tags the person already set
        const upd={campaign_id:campIdStr,updated_at:new Date().toISOString()}
        if(!target.ad_budget)upd.ad_budget=parseFloat(camp.daily_budget||0)/100||0
        if(!target.rk_budget)upd.rk_budget=upd.ad_budget??target.rk_budget
        const{error}=await db.from('zalivs').update(upd).eq('id',target.id)
        if(!error){
          Object.assign(target,upd)
          usedCampIds.add(campIdStr)
          await db.from('imported_campaigns').upsert({campaign_id:campIdStr,zaliv_id:target.id},{onConflict:'campaign_id'})
          linked++
          console.log('Linked ID to existing RK:',target.name,'→',campIdStr)
        }
        continue
      }

      // Truly new campaign — no RK for it in CRM yet, create one
      const buyer=parseBuyerFromName(camp.name)||'Danya'
      const geo=parseGeoFromName(camp.name)
      const funnel=parseFunnelFromName(camp.name)
      const date=parseDateFromCampName(camp.name)
      const budget=parseFloat(camp.daily_budget||0)/100||0
      const{data:zData,error}=await db.from('zalivs').insert({
        geo,name:camp.name,
        ad_budget:budget,rk_budget:budget,
        domain:'',creos:[],goals:[],
        ind:'profit',status:'Check',insights:'',
        buyer,funnel,score:3,
        campaign_id:campIdStr,
        date:date||new Date().toLocaleDateString('ru',{day:'2-digit',month:'2-digit'}),
        region:CURRENT_REGION
      }).select().single()
      if(!error&&zData){
        ZALIVS.unshift(zData);(window._ALL_ZALIVS||[]).unshift(zData);autoFdcTask(zData)
        await db.from('imported_campaigns').insert({campaign_id:campIdStr,zaliv_id:zData.id})
        usedCampIds.add(campIdStr)
        added++
      }
    }
    const total=added+linked
    setSS('ok',total>0?`Импорт: ${linked} привязано, +${added} новых`:'Нет изменений')
    if(total>0){
      toast(`Импорт Meta: ${linked} РК привязано по ID, +${added} новых`,'ok')
      rzalivs()
    }else toast('Нет новых кампаний — всё уже привязано','info')
  }catch(e){
    setSS('','Ошибка импорта')
    toast('Нужно задеплоить функцию get-campaigns в Supabase','err')
    console.log('Import error:',e)
  }
}

// ── REGION GEO helpers (config REGION_GEOS declared at top) ──
function regionCfg(){return REGION_GEOS[CURRENT_REGION]||REGION_GEOS.PL}
function regionGeos(){const c=regionCfg();return [c.main,c.ua]}
// Is this GEO the "UA" variant of its region?
function isUaGeo(g){return g==='PLUA'||g==='CZUA'}
// GEO chip css class: main geo → gpl (blue), ua variant → gplua (purple)
function geoClass(g){return isUaGeo(g)?'gplua':'gpl'}
// Map zaliv GEO → creo library GEO (PL→PL, PLUA→UAPL, CZ→CZ, CZUA→UACZ)
function geoToCreoGeo(g){
  const m={PL:'PL',PLUA:'UAPL',CZ:'CZ',CZUA:'UACZ'}
  return m[g]||g
}

function parseGeoFromName(name){
  const n=name.toUpperCase()
  const c=regionCfg()
  const brIdx=n.indexOf('}')
  if(brIdx>=0){
    const after=n.substring(brIdx+1,brIdx+6)
    if(after.startsWith(c.ua))return c.ua
    if(after.startsWith('UA'))return c.ua
    if(after.startsWith(c.main))return c.main
  }
  if(n.includes('UA'))return c.ua
  return c.main
}

function parseFunnelFromName(name){
  const n=name.toLowerCase()
  if(n.includes('kalk')||n.includes('калькул'))return'Калькулятор'
  if(n.includes('vizit')||n.includes('визит'))return'Визита'
  if(n.includes('proj')||n.includes('проект'))return'Проект'
  if(n.includes('lead')||n.includes('лид'))return'Лид-магнит'
  return'Калькулятор'
}

// ВАЖНО: правило должно быть идентично nameRegion() в get-campaigns и sync Edge Functions.
// Раньше здесь стояла проверка по границам слова, из-за чего "cloadczua1" считалась польской
// в CRM и чешской в Edge Function — РК застревала не в том регионе и завышала спенд.
// GEO берём строго из головы имени — сразу после «}». Поиск "CZ" по всей строке
// утаскивал польские кампании с «(cz)» в середине названия в чешский регион.
// Правило обязано совпадать с sync и get-campaigns, иначе цифры разойдутся.
function nameRegion(name){
  const n=(name||'').replace(/\\/g,'').toUpperCase()
  const i=n.indexOf('}')
  if(i>=0){
    const a=n.slice(i+1,i+7)
    if(a.startsWith('CZ'))return 'CZ'
    if(a.startsWith('UACZ'))return 'CZ'
    if(a.startsWith('PL'))return 'PL'
    if(a.startsWith('UAPL'))return 'PL'
    if(a.startsWith('UA'))return 'PL'
  }
  return n.includes('CZ')?'CZ':'PL'
}
function parseBuyerFromName(name){const m=(name||'').match(/^\s*\d*\s*([DIІіДд])\s*[{\[(]?\s*\d/i);if(!m)return'';const L=m[1].toUpperCase();return(L==='I'||L==='І')?'Illia':'Danya'}
function parseDateFromCampName(name){
  // Matches: D{17.06} I[16.06] D[09.06] etc
  // After first letter, optionally {[ then DD.MM
  const m=name.match(/^\s*\d*\s*[A-Za-zІіДд][{\[(]?\s*(\d{2}[.,]\d{2})/)
  if(m)return m[1].replace(',','.')
  // fallback: any DD.MM pattern
  const m2=name.match(/(\d{2}[.,]\d{2})/)
  if(m2)return m2[1].replace(',','.')
  return null
}

async function saveCreoReport(id){
  const r=CREO_REPORTS.find(x=>x.id===id);if(!r)return
  // Collect all inputs for this report
  const fields=['ctr','cr','cpl','cql','notes']
  const upd={}
  fields.forEach(f=>{

    if(inp)upd[f]=f==='notes'?inp.value:parseFloat(inp.value)||0
  })
  await db.from('creo_reports').update(upd).eq('id',id)
  Object.assign(r,upd)
  toast('Сохранено','ok')
}

async function delCreoReport(id){
  if(!confirm('Удалить отчёт?'))return
  await db.from('creo_reports').delete().eq('id',id)
  CREO_REPORTS=CREO_REPORTS.filter(x=>x.id!==id)
  rcreo();toast('Удалено','ok')
}

async function fetchCreoAddMetrics(z){
  if(!z.campaign_id)return null
  try{
    let since=null
    const raw=z.date||''
    if(raw){const p=raw.split('.');if(p.length===2){const yr=new Date().getFullYear();since=`${yr}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`}}
    if(!since&&z.created_at)since=z.created_at.split('T')[0]
    const until=new Date().toISOString().split('T')[0]
    const r=await fetch(SB_URL+'/functions/v1/get-campaigns',{
      method:'POST',
      headers:{'Authorization':'Bearer '+SB_ANON,'Content-Type':'application/json'},
      body:JSON.stringify({action:'get_campaign_insights',campaign_id:z.campaign_id,since,until,region:CURRENT_REGION})
    })
    const d=await r.json()
    if(d.ok)return d
    return null
  }catch(e){return null}
}

  const totalQuals=0
  const autoCpl=meta?meta.cpl:0
  const autoCql=0
  const avgCtr=meta?meta.ctr:0
  const dateStart=z.date||new Date().toLocaleDateString('ru',{day:'2-digit',month:'2-digit'})
  const dateEndFmt=new Date().toLocaleDateString('ru',{day:'2-digit',month:'2-digit'})
  _renderCreoAddForm(z,{spend,totalLeads,totalQuals,autoCpl,autoCql,avgCtr,dateStart,dateEndFmt})
}

function _buildCreoAddModalFallback(z){
  // Use METRICS as fallback
  let dateStartISO=null
  const raw=z.date||''
  if(raw){const p=raw.split('.');if(p.length===2){const yr=new Date().getFullYear();dateStartISO=`${yr}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`}}
  if(!dateStartISO&&z.created_at)dateStartISO=z.created_at.split('T')[0]
  const dateEnd=new Date().toISOString().split('T')[0]
  const metrics=METRICS.filter(m=>(!dateStartISO||m.day>=dateStartISO)&&m.day<=dateEnd)
  let spend=0,totalLeads=0,totalQuals=0
  metrics.forEach(r=>{
    // METRICS columns are spend_pl/spend_plua — main geo → _pl, UA-variant → _plua
    if(z.geo&&!isUaGeo(z.geo)){spend+=parseFloat(r.spend_pl||0);totalLeads+=(r.leads_pl||0)}
    else if(isUaGeo(z.geo)){spend+=parseFloat(r.spend_plua||0);totalLeads+=(r.leads_plua||0)}
    else{spend+=parseFloat(r.spend_pl||0)+parseFloat(r.spend_plua||0);totalLeads+=(r.leads_pl||0)+(r.leads_plua||0)}
    totalQuals+=r.quals||0
  })
  spend=Math.round(spend*100)/100
  const autoCpl=totalLeads>0?Math.round(spend/totalLeads*100)/100:0
  const autoCql=totalQuals>0?Math.round(spend/totalQuals*100)/100:0
  const avgCtr=metrics.length?Math.round(metrics.reduce((s,r)=>s+parseFloat(r.ctr||0),0)/metrics.length*100)/100:0
  const dateStart=z.date||new Date().toLocaleDateString('ru',{day:'2-digit',month:'2-digit'})
  const dateEndFmt=new Date().toLocaleDateString('ru',{day:'2-digit',month:'2-digit'})
  _renderCreoAddForm(z,{spend,totalLeads,totalQuals,autoCpl,autoCql,avgCtr,dateStart,dateEndFmt})
}

function _buildCreoAddModal(z){

    else _buildCreoAddModalFallback(z)

async function loadCreoLib(){
  if(!db)return
  const{data,error}=await db.from('creo_library').select('*').eq('region',CURRENT_REGION).order('created_at',{ascending:false})
  if(error&&error.message?.includes('does not exist')){
    console.log('creo_library table missing — run SQL to create it')
    CREO_LIB=[]
    return
  }
  CREO_LIB=data||[]
  // Load insights from localStorage (no separate table needed)
  try{INSIGHTS=JSON.parse(localStorage.getItem('creo_insights')||'[]')}catch(e){INSIGHTS=[]}
}

function rcreoLib(){

}

function renderCreoPage(){
  renderCreoTable()

}

function renderCreoTable(){
  const geo=document.getElementById('clf-geo')?.value||''
  const status=document.getElementById('clf-status')?.value||''
  const funnel=document.getElementById('clf-funnel')?.value||''
  const q=document.getElementById('clf-q')?.value?.toLowerCase()||''

  const buyer=document.getElementById('clf-buyer')?.value||''
  let f=CREO_LIB.filter(cr=>
    (!geo||cr.geo===geo)&&
    (!status||cr.status===status)&&
    (!funnel||cr.funnel===funnel)&&
    (!buyer||cr.buyer===buyer)&&
    (!q||cr.name?.toLowerCase().includes(q)||cr.notes?.toLowerCase().includes(q))
  )

  const cnt=document.getElementById('creo-lib-count')
  if(cnt)cnt.textContent='('+f.length+')'

  // Stats strip
  const statsEl=document.getElementById('clf-stats')
  if(statsEl){
    const ready=CREO_LIB.filter(x=>x.status==='ready').length
    const used=CREO_LIB.filter(x=>x.status==='used').length
    const hall=CREO_LIB.filter(x=>x.status==='hall').length
    statsEl.innerHTML=`
      <span style="background:rgba(64,128,255,.12);border:1px solid rgba(64,128,255,.25);color:var(--blue);border-radius:20px;padding:3px 12px;font-size:11px;font-weight:700">🎯 ${ready} ждут</span>
      <span style="background:rgba(212,160,23,.12);border:1px solid rgba(212,160,23,.25);color:var(--yellow);border-radius:20px;padding:3px 12px;font-size:11px;font-weight:700">⚡ ${used} в работе</span>
      <span style="background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.25);color:#ffd700;border-radius:20px;padding:3px 12px;font-size:11px;font-weight:700">🏆 ${hall} в зале</span>
    `
  }

  const tbody=document.getElementById('clf-tbody')
  if(!tbody)return

  if(!f.length){
    tbody.innerHTML=`<tr><td colspan="11" class="empty">Нет крео — добавь первый</td></tr>`
    return
  }

  tbody.innerHTML=f.map(cr=>{
    const statusColor=cr.status==='hall'?'#ffd700':cr.status==='used'?'var(--yellow)':'var(--blue)'
    const statusLabel=cr.status==='hall'?'🏆 MWP':cr.status==='used'?'⚡ Use':'✨ Clean'
    const gcls=geoClass(cr.geo)   // нельзя называть переменную как функцию: она перекрывает саму себя
    const ctrColor=cr.avg_ctr>2?'var(--green)':cr.avg_ctr>1?'var(--yellow)':cr.avg_ctr>0?'var(--red)':'var(--text3)'
    const cplColor=cr.avg_cpl>0&&cr.avg_cpl<10?'var(--green)':cr.avg_cpl<15?'var(--yellow)':cr.avg_cpl>0?'var(--red)':'var(--text3)'
    return`<tr>
      <td>
        <div style="display:flex;gap:4px;align-items:center">
          <button class="spb clf-edit-btn" style="width:28px;height:28px;font-size:12px" data-clf-edit="${cr.id}" title="Редактировать">✏️</button>
          ${cr.status!=='hall'?`<button class="spb s5 clf-hall-btn" style="width:28px;height:28px;font-size:11px" data-clf-hall="${cr.id}" title="В зал славы">🏆</button>`:''}
          <button class="spb s0 clf-del-btn" style="width:28px;height:28px;font-size:11px" data-clf-del="${cr.id}" title="Удалить">✕</button>
        </div>
      </td>
      <td>
        ${cr.screenshot_url
          ?`<img class="clf-thumb" src="${cr.screenshot_url}" onclick="event.stopPropagation();window.open('${cr.screenshot_url}','_blank')">`
          :`<div class="clf-thumb-placeholder">${cr.status==='hall'?'🏆':cr.status==='used'?'📊':'🎨'}</div>`
        }
      </td>
      <td>
        <div style="font-weight:700;color:#fff;font-size:12px">${cr.name}</div>
        ${cr.notes?`<div style="font-size:10px;color:var(--text3);margin-top:2px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${cr.notes}</div>`:''}
      </td>
      <td><span class="zgeo gchip ${gcls}">${cr.geo}</span></td>
      <td><span class="fchip">${cr.funnel||'—'}</span></td>
      <td><span style="font-size:10px;font-weight:700;color:${statusColor}">${statusLabel}</span></td>
      <td style="font-family:var(--mono);font-weight:700;color:${ctrColor}">${cr.avg_ctr?cr.avg_ctr+'%':'—'}</td>
      <td style="font-family:var(--mono);font-weight:700;color:${cplColor}">${cr.avg_cpl?'$'+cr.avg_cpl:'—'}</td>
      <td style="font-family:var(--mono);color:var(--text2)">${cr.avg_cql?'$'+cr.avg_cql:'—'}</td>
      <td style="font-family:var(--mono);color:var(--text3)">${cr.launches||0}</td>
      <td><span class="tma">${cr.buyer||'—'}</span></td>

    </tr>`
  }).join('')
}

// ── Insight Board ──
function renderInsightBoard(){
  const el=document.getElementById('insight-cards')
  if(!el)return
  if(!INSIGHTS.length){
    el.innerHTML=`<div style="text-align:center;padding:20px;color:var(--text3);font-size:12px">Нет заметок.<br>Добавь первую мысль 💡</div>`
    return
  }
  el.innerHTML=INSIGHTS.map((n,i)=>`
    <div class="insight-note">
      <button class="insight-note-del" onclick="delInsight(${i})">✕</button>
      <span class="insight-note-tag tag-${n.tag}">${{trend:'📈 Тренд',hypo:'🔬 Гипотеза',insight:'💡 Инсайт',fail:'❌ Провал'}[n.tag]||n.tag}</span>
      <div class="insight-note-text">${n.text}</div>
      <div class="insight-note-meta">
        <span class="tma">${n.buyer}</span>
        <span>${n.date}</span>
      </div>
    </div>
  `).join('')
}

function addInsightInline(){
  try{
    if(!Array.isArray(INSIGHTS))window.INSIGHTS=[]
    const tag=document.getElementById('insight-tag')?.value||'insight'
    const text=document.getElementById('insight-new-text')?.value?.trim()
    if(!text){toast('Напиши мысль','err');return}
    const buyer=CURRENT_USER?.name||'Unknown'
    INSIGHTS.unshift({tag,text,buyer,date:new Date().toLocaleDateString('ru')})
    localStorage.setItem('creo_insights',JSON.stringify(INSIGHTS))
    document.getElementById('insight-new-text').value=''
    renderInsightBoard()
    toast('Сохранено','ok')
  }catch(e){console.error('addInsightInline error:',e);toast('Ошибка: '+e.message,'err')}
}

function delInsight(i){
  INSIGHTS.splice(i,1)
  localStorage.setItem('creo_insights',JSON.stringify(INSIGHTS))
  renderInsightBoard()
}

async function setCreoHall(id){
  const{error}=await db.from('creo_library').update({status:'hall'}).eq('id',id)
  if(!error){const cr=CREO_LIB.find(x=>x.id===id);if(cr)cr.status='hall';renderCreoTable();toast('В Зал Славы 🏆','ok')}

async function delCreoLib(id){
  if(!confirm('Удалить крео из библиотеки?'))return
  await db.from('creo_library').delete().eq('id',id)
  CREO_LIB=CREO_LIB.filter(x=>x.id!==id);renderCreoTable();toast('Удалено','ok')
}

async function saveCreoLib(){
  const name=document.getElementById('cl-name').value.trim()
  if(!name){toast('Введи название','err');return}
  const geo=document.getElementById('cl-geo').value
  const funnel=document.getElementById('cl-funnel').value
  const buyer=document.getElementById('cl-buyer').value
  const status=document.getElementById('cl-status').value
  const notes=document.getElementById('cl-notes').value
  const hall_geo=status==='hall'?geo:null

  let screenshot_url=clEditId?CREO_LIB.find(x=>x.id===clEditId)?.screenshot_url:null
  const fileInp=document.getElementById('cl-img-inp')
  const fileInp2=document.getElementById('cl-img-inp')
  const uploadFile=fileInp2?.files?.[0]||_pastedImageFile
  if(uploadFile){
    const path=`creolib_${Date.now()}.png`
    const{error:upErr}=await db.storage.from('creo-screenshots').upload(path,uploadFile,{upsert:true,contentType:uploadFile.type||'image/png'})
    if(upErr){console.error('Upload error:',upErr);toast('Ошибка загрузки скрина: '+upErr.message,'err')}
    else{const{data:ud}=db.storage.from('creo-screenshots').getPublicUrl(path);screenshot_url=ud.publicUrl}
    _pastedImageFile=null
  }

  const payload={name,geo,funnel,buyer,status,notes,screenshot_url,hall_geo}

  if(clEditId){
    const{error}=await db.from('creo_library').update(payload).eq('id',clEditId)
    if(!error){const cr=CREO_LIB.find(x=>x.id===clEditId);if(cr)Object.assign(cr,payload);toast('Обновлено','ok')}
    else{toast('Ошибка: '+error.message,'err');return}
  }else{
    const{data,error}=await db.from('creo_library').insert({...payload,region:CURRENT_REGION}).select().single()
    if(!error&&data){CREO_LIB.unshift(data);toast('Крео добавлено','ok')}
    else{toast('Ошибка: '+(error?.message||'unknown'),'err');return}
  }
  document.getElementById('mo-creo-lib').classList.remove('open')
  renderCreoTable()
}

// Auto-update creo status when added to zaliv
// Called from openCreoAddModal after archiving
async function markCreosAsUsed(creoNames, stats){
  for(const name of creoNames){
    const cr=CREO_LIB.find(x=>x.name===name||x.name===name.trim())
    if(!cr)continue
    const launches=(cr.launches||0)+1
    // Weighted average: blend old stats with new
    const w=1/launches
    const newCtr=cr.avg_ctr?Math.round((cr.avg_ctr*(1-w)+(stats.ctr||0)*w)*100)/100:(stats.ctr||0)
    const newCpl=cr.avg_cpl?Math.round((cr.avg_cpl*(1-w)+(stats.cpl||0)*w)*100)/100:(stats.cpl||0)
    const newCql=cr.avg_cql?Math.round((cr.avg_cql*(1-w)+(stats.cql||0)*w)*100)/100:(stats.cql||0)
    const upd={status:'used',launches,avg_ctr:newCtr,avg_cpl:newCpl,avg_cql:newCql}
    const{error}=await db.from('creo_library').update(upd).eq('id',cr.id)
    if(!error)Object.assign(cr,upd)
  }
  renderCreoTable()
  toast('Статка по крео обновлена','ok')
}

document.getElementById('cl-img-drop')?.addEventListener('dragover',e=>{e.preventDefault();e.currentTarget.style.borderColor='var(--bord2)'})
document.getElementById('cl-img-drop')?.addEventListener('dragleave',e=>{e.currentTarget.style.borderColor=''})
document.getElementById('cl-img-drop')?.addEventListener('drop',e=>{
  e.preventDefault();e.currentTarget.style.borderColor=''
  const file=e.dataTransfer.files[0]
  if(file?.type.startsWith('image/')){
    const dt=new DataTransfer();dt.items.add(file);document.getElementById('cl-img-inp').files=dt.files
    const r=new FileReader();r.onload=ev=>{document.getElementById('cl-img-preview').innerHTML=`<img src="${ev.target.result}" style="max-height:80px;border-radius:6px;display:block;margin:0 auto">`};r.readAsDataURL(file)
  }
})

// Ctrl+V paste from clipboard - store file directly
document.addEventListener('paste',e=>{
  const mo=document.getElementById('mo-creo-lib')
  if(!mo?.classList.contains('open'))return
  const items=[...e.clipboardData.items]
  const imgItem=items.find(item=>item.type.startsWith('image/'))
  if(!imgItem)return
  e.preventDefault()
  const file=imgItem.getAsFile()
  if(!file)return
  _pastedImageFile=file  // store for upload
  const r=new FileReader()
  r.onload=ev=>{
    document.getElementById('cl-img-preview').innerHTML=`<img src="${ev.target.result}" style="max-height:80px;border-radius:6px;display:block;margin:0 auto">`
    const drop=document.getElementById('cl-img-drop')
    if(drop){drop.style.borderColor='var(--green)';setTimeout(()=>drop.style.borderColor='',1500)}
    toast('Скрин вставлен ✓ — теперь нажми Сохранить','ok')
  }
  r.readAsDataURL(file)
})

// Hook into archiving — mark creos as used with stats
// creoAddSave is overridden here to add markCreosAsUsed
function creoAddSave(){
  // Before saving, collect creo names and stats to mark as used
  const creosRaw=document.getElementById('ca-creos')?.value||''
  const creos=creosRaw?creosRaw.split(',').map(s=>s.trim()).filter(Boolean):[]
  if(!creos.length){toast('Нет крео для сохранения','err');return}

  const zalivId=parseInt(document.getElementById('ca-zaliv-id').value)
  const spend=parseFloat(document.getElementById('ca-spend').value)||0
  const rows=creos.map((cr,i)=>({
    zaliv_id:zalivId,creo_id:cr,
    geo:document.getElementById('ca-geo').value,
    creator:document.getElementById('ca-creator').value,
    funnel:document.getElementById('ca-funnel').value,
    date_start:document.getElementById('ca-date-start').value,
    date_end:document.getElementById('ca-date-end').value,
    spend:Math.round(spend/Math.max(creos.length,1)*100)/100,
    ctr:parseFloat(document.getElementById('ca-ctr-'+i)?.value)||0,
    cr:parseFloat(document.getElementById('ca-cr-'+i)?.value)||0,
    cpl:parseFloat(document.getElementById('ca-cpl-'+i)?.value)||0,
    cql:parseFloat(document.getElementById('ca-cql-'+i)?.value)||0,
    notes:document.getElementById('ca-notes-'+i)?.value||'',region:CURRENT_REGION
  }))

  db.from('creo_reports').insert(rows).then(({error})=>{
    if(!error){
      toast(rows.length+' крео добавлено в отчёт','ok')
      document.getElementById('mo-creo-add').classList.remove('open')
      loadCreoReports()
      applyOFFStatus(zalivId)
      // Mark creos as used in library
      const avgStats={
        ctr:Math.round(rows.reduce((s,r)=>s+(r.ctr||0),0)/rows.length*100)/100,
        cpl:Math.round(rows.reduce((s,r)=>s+(r.cpl||0),0)/rows.length*100)/100,
        cql:Math.round(rows.reduce((s,r)=>s+(r.cql||0),0)/rows.length*100)/100
      }
      markCreosAsUsed(creos,avgStats)
    }else{
      toast('Ошибка: '+error.message,'err')
    }
  })
}

// Tab key → callout block (Obsidian-style)
document.getElementById('jeditor').addEventListener('keydown',function(e){
  if(e.key==='Tab'){
    e.preventDefault()
    const sel=window.getSelection()
    if(!sel.rangeCount)return
    const range=sel.getRangeAt(0)
    const node=range.startContainer
    // Find the closest block-level element
    const block=node.nodeType===3
      ?node.parentElement?.closest('h1,h2,h3,h4,p,div:not(.jeditor):not(.callout),li')
      :node.closest('h1,h2,h3,h4,p,div:not(.jeditor):not(.callout),li')
    if(block&&block.tagName==='LI'){
      document.execCommand('indent',false,null)
      return
    }
    if(block&&block.id!=='jeditor'){
      // Wrap in callout preserving all content/HTML
      const callout=document.createElement('div')
      callout.className='callout'
      callout.innerHTML=block.innerHTML||block.textContent
      block.parentNode.replaceChild(callout,block)
      // Place cursor at end of callout
      const r=document.createRange()
      r.selectNodeContents(callout)
      r.collapse(false)
      sel.removeAllRanges()
      sel.addRange(r)
    }else{
      // Fallback: insert callout block
      document.execCommand('insertHTML',false,'<div class="callout"><br></div>')
    }
  }
})

// ── AUTO-MATCH CAMPAIGN IDs ──
async function autoMatchCampaignIds(){
  if(!db)return
  setSS('syncing','Матчинг campaign IDs...')
  try{
    const r=await fetch(SB_URL+'/functions/v1/get-campaigns',{
      method:'POST',
      headers:{'Authorization':'Bearer '+SB_ANON,'Content-Type':'application/json'},
      body:JSON.stringify({action:'get_campaigns',region:CURRENT_REGION,days:14})
    })
    const d=await r.json()
    if(!d.campaigns?.length){setSS('ok','—');return}

    let matched=0
    // Track which campaign_ids have already been assigned
    const usedCampIds=new Set(ZALIVS.filter(z=>z.campaign_id).map(z=>z.campaign_id))

    for(const camp of d.campaigns){
      // Skip if this campaign_id already assigned to any zaliv
      if(usedCampIds.has(String(camp.id)))continue

      // Find first zaliv without campaign_id that matches this campaign name (same fuzzy logic as import)
      const match=fuzzyMatchZaliv(camp.name,ZALIVS.filter(z=>!z.campaign_id))
      if(match){
        await db.from('zalivs').update({campaign_id:String(camp.id)}).eq('id',match.id)
        match.campaign_id=String(camp.id)
        usedCampIds.add(String(camp.id))
        matched++
        console.log('Matched:',match.name,'→',camp.id)
      }
    }
    setSS('ok',matched>0?`Сопоставлено ${matched} кампаний`:'Нет новых совпадений')
    if(matched>0){
      toast(`Автоматически сопоставлено ${matched} campaign IDs`,'ok')
      rzalivs()
    }else{
      toast('Совпадений не найдено — введи ID вручную в редактировании','info')
    }
  }catch(e){
    setSS('','Ошибка');console.error(e)
  }
}

function renderAnTree(){
  const el=document.getElementById('an-tree')
  if(!el)return
  const q=(document.getElementById('an-search')?.value||'').toLowerCase()

  // Group zalivs by geo → year → month
  // Use all zalivs + analyses
  const geo_yr_month = {}

  // From analyses - group by period_from month, not created_at
  RK_ANALYSES.forEach(a=>{
    const geo=a.geo||'?'
    // Use period_from to determine month (when the campaign ran)
    let mo=a.month_key||'?'
    if(a.period_from){
      // period_from format: YYYY-MM-DD or DD.MM.YYYY
      let pf=a.period_from
      if(pf.includes('.')){const p=pf.split('.');const yr2=new Date().getFullYear();pf=`${yr2}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`}
      mo=pf.slice(0,7) // YYYY-MM
    }
    const yr=mo.split('-')[0]||'2026'
    const zid=a.zaliv_id
    if(!geo_yr_month[geo])geo_yr_month[geo]={}
    if(!geo_yr_month[geo][yr])geo_yr_month[geo][yr]={}
    if(!geo_yr_month[geo][yr][mo])geo_yr_month[geo][yr][mo]={}
    if(!geo_yr_month[geo][yr][mo][zid])geo_yr_month[geo][yr][mo][zid]={name:a.zaliv_name,count:0,ind:null}
    geo_yr_month[geo][yr][mo][zid].count++
  })

  // Add zalivs without analyses — use REAL date from campaign name, not today
  ZALIVS.forEach(z=>{
    if(q&&!z.name.toLowerCase().includes(q))return
    const geo=z.geo||'?'
    // Parse month from z.date (DD.MM) or from campaign name
    const curYr=new Date().getFullYear().toString()
    let mo=`${curYr}-${String(new Date().getMonth()+1).padStart(2,'0')}` // fallback
    let dateStr=z.date||parseDateFromCampName(z.name)
    if(dateStr&&dateStr.includes('.')){
      const p=dateStr.split('.')
      if(p.length>=2)mo=`${curYr}-${p[1].padStart(2,'0')}`
    }
    const yr=mo.split('-')[0]
    if(!geo_yr_month[geo])geo_yr_month[geo]={}
    if(!geo_yr_month[geo][yr])geo_yr_month[geo][yr]={}
    if(!geo_yr_month[geo][yr][mo])geo_yr_month[geo][yr][mo]={}
    if(!geo_yr_month[geo][yr][mo][z.id]){
      geo_yr_month[geo][yr][mo][z.id]={name:z.name,count:0,ind:z.ind}
    }else{
      geo_yr_month[geo][yr][mo][z.id].ind=z.ind
    }
  })

  const MONTH_NAMES=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь']
  const moName=mk=>{const m=parseInt(mk?.split('-')[1]||1);return MONTH_NAMES[m-1]||mk}
  const indColor=ind=>ind==='profit'?'#2ea043':ind==='drop'?'#e08040':'#e04050'

  let html=''
  Object.entries(geo_yr_month).sort().forEach(([geo,yrs])=>{
    Object.entries(yrs).sort((a,b)=>b[0]-a[0]).forEach(([yr,months])=>{
      html+=`<div class="an-tree-yr" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'':'none'">
        <span class="zgeo gchip ${geoClass(geo)}" style="font-size:9px;padding:1px 5px">${geo}</span>
        <span style="font-weight:700;font-size:12px">RKFB ${geo} ${yr}</span>
        <span style="font-size:10px;color:var(--text3);margin-left:auto">${Object.values(months).reduce((s,m)=>s+Object.keys(m).length,0)} РК</span>
      </div>
      <div class="an-yr-body">`

      Object.entries(months).sort((a,b)=>b[0].localeCompare(a[0])).forEach(([mo,zalivs])=>{
        html+=`<div class="an-tree-sect">${moName(mo)} ${yr}</div>`
        Object.entries(zalivs).forEach(([zid,info])=>{
          if(q&&!info.name.toLowerCase().includes(q))return
          const dot=indColor(info.ind)
          const isActive=_anSelZalivId===parseInt(zid)
          html+=`<div class="an-tree-item${isActive?' active':''}" onclick="selectAnZaliv(${zid})">
            <div class="an-dot" style="background:${dot};flex-shrink:0"></div>
            <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${info.name}</span>
            ${info.count>0?`<span class="an-meta">${info.count}×</span>`:'<span class="an-meta" style="color:var(--bord2)">+ анализ</span>'}
          </div>`
        })
      })
      html+=`</div>`
    })
  })

  el.innerHTML=html||'<div class="empty" style="padding:20px;font-size:11px">Нет данных</div>'
}
