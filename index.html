  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();openSearch();return}
  if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();saveDoc();return}
  const mo=document.getElementById('mo-search')

  if(e.key==='Escape'){mo.classList.remove('open');return}
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();const items=document.querySelectorAll('.srch-item');items.forEach(i=>i.classList.remove('sel'))
    srchSelIdx=e.key==='ArrowDown'?Math.min(srchSelIdx+1,items.length-1):Math.max(srchSelIdx-1,0)
    items[srchSelIdx]?.classList.add('sel');items[srchSelIdx]?.scrollIntoView({block:'nearest'});return
  }
  if(e.key==='Enter'){const sel=document.querySelector('.srch-item.sel');if(sel)sel.click()}
})

function countUp(el,target,pre='',suf='',dur=800){
  const n=parseFloat(target);if(isNaN(n)){el.textContent=target;return}
  const start=Date.now();const timer=setInterval(()=>{
    const p=Math.min((Date.now()-start)/dur,1),e=1-Math.pow(1-p,3),cur=n*e
    el.textContent=pre+(Number.isInteger(n)?Math.round(cur):cur.toFixed(1))+suf
    if(p>=1){clearInterval(timer);el.textContent=pre+target+suf}
  },16)
}

function rdash(){
  const buyer=document.getElementById('df-buyer')?.value||''
  if(buyer){rdashBuyer(buyer);return}
  resetDashLabels()
  const from=document.getElementById('pd-from').value,to=document.getElementById('pd-to').value
  const rows=METRICS.filter(m=>m.day>=from&&m.day<=to)
  let tS=0,tPL=0,tPLUA=0,tL=0,tQ=0,tSzl=0
  rows.forEach(r=>{tS+=parseFloat(r.spend_pl||0)+parseFloat(r.spend_plua||0);tPL+=parseFloat(r.spend_pl||0);tPLUA+=parseFloat(r.spend_plua||0);tL+=(r.leads_pl||0)+(r.leads_plua||0);tQ+=r.quals||0;tSzl+=parseFloat(r.sales_amount_zl||0)})
  const days=rows.length||1,cpl=tL>0?(tS/tL).toFixed(1):0,cql=tQ>0?(tS/tQ).toFixed(1):0
  const spD=(tS/days).toFixed(0),profit=tSzl*0.3*0.25,roi=tS>0?Math.round((profit-tS)/tS*100):0
  const avgCtr=rows.length>0?(rows.reduce((s,r)=>s+parseFloat(r.ctr||0),0)/rows.length).toFixed(2):0
  // ── COMPARISON PERIOD ──
  // Calculate previous period of same length
  const fromDate = new Date(from + 'T00:00:00')
  const toDate = new Date(to + 'T00:00:00')
  const periodDays = Math.max(1, Math.round((toDate - fromDate) / 86400000) + 1)
  const prevTo = new Date(fromDate - 86400000).toISOString().split('T')[0]
  const prevFrom = new Date(fromDate - periodDays * 86400000).toISOString().split('T')[0]
  const prevRows = METRICS.filter(m => m.day >= prevFrom && m.day <= prevTo)
  let pS=0, pL=0, pQ=0, pSzl=0
  prevRows.forEach(r=>{pS+=parseFloat(r.spend_pl||0)+parseFloat(r.spend_plua||0);pL+=(r.leads_pl||0)+(r.leads_plua||0);pQ+=r.quals||0;pSzl+=parseFloat(r.sales_amount_zl||0)})
  const pDays = prevRows.length || 1
  const pCpl = pL>0 ? pS/pL : 0
  const pCql = pQ>0 ? pS/pQ : 0
  const pSpD = pS/pDays
  const pProfit = pSzl*0.3*0.25
  const pRoi = pS>0 ? Math.round((pProfit-pS)/pS*100) : 0
  const pCtr = prevRows.length>0 ? prevRows.reduce((s,r)=>s+parseFloat(r.ctr||0),0)/prevRows.length : 0

  function setCompare(id, cur, prev, higherIsBetter) {
    const arrEl = document.getElementById(id+'-arr')
    const prevEl = document.getElementById(id+'-prev')
    if(!arrEl||!prevEl||!prev) return
    const diff = cur - prev
    const pct = prev !== 0 ? Math.round(Math.abs(diff)/Math.abs(prev)*100) : 0
    const isUp = diff > 0
    const isGood = higherIsBetter ? isUp : !isUp
    const flat = Math.abs(diff) < 0.01 * Math.abs(prev || 1)
    if(flat){arrEl.textContent='→';arrEl.className='karr flat'}
    else{
      arrEl.textContent = isUp ? '↑' : '↓'
      arrEl.className = 'karr ' + (isGood ? (isUp?'up-good':'dn-good') : (isUp?'up-bad':'dn-bad'))
    }
    prevEl.textContent = typeof prev === 'number' && prev > 0 ? (id.includes('roi')?prev+'%':'$'+Math.round(prev)) + (pct&&!flat?' ('+pct+'%)':'') : ''
  }

  countUp(document.getElementById('d-spend'),Math.round(tS),'$')
  countUp(document.getElementById('d-daily'),spD,'$')
  setCompare('d-spend', tS, pS, true)
  setCompare('d-daily', parseFloat(spD), pSpD, true)
  const cplEl=document.getElementById('d-cpl'),cplN=parseFloat(cpl)
  cplEl.style.color=cplN>0&&cplN<10?'var(--green)':cplN<=13?'var(--yellow)':cplN>0?'var(--red)':'var(--text)'
  cplEl.style.textShadow=cplN>0&&cplN<10?'0 0 12px rgba(46,160,67,.7)':cplN<=13&&cplN>0?'0 0 12px rgba(212,160,23,.7)':cplN>0?'0 0 12px rgba(224,64,80,.6)':''
  countUp(cplEl,cpl,'$')
  setCompare('d-cpl', parseFloat(cpl), pCpl, false)
  const cqlEl=document.getElementById('d-cql'),cqlN=parseFloat(cql)
  cqlEl.style.color=cqlN>0&&cqlN<25?'var(--green)':cqlN<=35?'var(--yellow)':cqlN>0?'var(--red)':'var(--text)'
  cqlEl.style.textShadow=cqlN>0&&cqlN<25?'0 0 12px rgba(46,160,67,.7)':cqlN<=35&&cqlN>0?'0 0 12px rgba(212,160,23,.7)':cqlN>0?'0 0 12px rgba(224,64,80,.6)':''
  countUp(cqlEl,cql,'$')
  setCompare('d-cql', parseFloat(cql), pCql, false)
  const roiEl=document.getElementById('d-roi')
  roiEl.style.color=roi>=100?'var(--green)':roi>0?'var(--yellow)':roi<0?'var(--red)':'var(--text)'
  roiEl.style.textShadow=roi>=100?'0 0 12px rgba(46,160,67,.7)':''
  countUp(roiEl,roi,roi>0?'+':'','%')
  setCompare('d-roi', roi, pRoi, true)
  countUp(document.getElementById('d-ctr'),avgCtr,'','%')
  setCompare('d-ctr', parseFloat(avgCtr), pCtr, true)
  document.getElementById('d-zalivs').innerHTML=ZALIVS.slice(0,5).map(z=>`<div class="zrow"><div class="zdot" style="background:${z.ind==='profit'?'var(--green)':z.ind==='drop'?'var(--yellow)':'var(--red)'}"></div><span class="zgeo ${z.geo==='PL'?'gpl':'gplua'}">${z.geo}</span><div class="zname">${z.name}</div><div class="zbud">$${z.rk_budget}/d</div></div>`).join('')||'<div class="empty">Нет заливов</div>'
  const mx=Math.max(tPL,tPLUA,1)
  document.getElementById('d-geo').innerHTML=`<div class="brow"><div class="bhdr"><span class="zgeo gpl">PL</span><span style="font-weight:700;color:var(--yellow);font-family:var(--mono)">$${Math.round(tPL)}</span></div><div class="btrk"><div class="bfill" style="width:${Math.round(tPL/mx*100)}%;background:#4080ff"></div></div></div><div class="brow"><div class="bhdr"><span class="zgeo gplua">PLUA</span><span style="font-weight:700;color:var(--yellow);font-family:var(--mono)">$${Math.round(tPLUA)}</span></div><div class="btrk"><div class="bfill" style="width:${Math.round(tPLUA/mx*100)}%;background:#9060d0"></div></div></div>`
  document.getElementById('d-tasks').innerHTML=TASKS.filter(t=>t.col!=='done').slice(0,4).map(t=>`<div class="tmini"><div class="tpb" style="background:${t.priority==='high'?'var(--red)':t.priority==='mid'?'var(--yellow)':'var(--green)'}"></div><div class="tmt">${t.title}</div><span class="tms ${t.col==='process'?'ts-proc':'ts-todo'}">${t.col==='process'?'In Progress':'TO DO'}</span>${t.assignee?`<span class="tma">${t.assignee}</span>`:''}</div>`).join('')||'<div class="empty">Нет задач</div>'
  const sf=SALES_DATA.filter(s=>{const d=parseDt(s.createdAt);if(!d)return false;const day=d.toISOString().split('T')[0];return day>=from&&day<=to})
  const stotal=sf.reduce((s,r)=>s+(r.saleAmount||0),0),savg=sf.length?Math.round(stotal/sf.length):0
  document.getElementById('d-sales-kpi').innerHTML=`
    <div style="background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:14px 16px;position:relative;overflow:hidden"><div style="position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#2ea043,#40c060)"></div><div style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:700">TOTAL REVENUE</div><div style="font-size:28px;font-weight:800;color:var(--yellow);font-family:var(--mono)">${stotal.toLocaleString('ru')} zł</div><div style="font-size:11px;color:var(--text3);margin-top:4px">${sf.length} продаж</div></div>
    <div style="background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:14px 16px;position:relative;overflow:hidden"><div style="position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#4080ff,#60a0ff)"></div><div style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:700">AVG DEAL</div><div style="font-size:28px;font-weight:800;color:#fff;font-family:var(--mono)">${savg.toLocaleString('ru')} zł</div><div style="font-size:11px;color:var(--text3);margin-top:4px">средний чек</div></div>
    <div style="background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:14px 16px;position:relative;overflow:hidden"><div style="position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--bord),var(--bord2))"></div><div style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:700">КОЛ-ВО ПРОДАЖ</div><div style="font-size:28px;font-weight:800;color:#fff;font-family:var(--mono)">${sf.length}</div><div style="font-size:11px;color:var(--text3);margin-top:4px">за период</div></div>`
  drawChart(rows)
}

// ── CHART ──
function renderChartFocused(focusKey){
  if(!chartData||!chartData.length)return
  const rows=chartData,cv=document.getElementById('dyn-chart'),ctx=cv.getContext('2d')
  const W=cv.width,H=cv.height,P={t:10,b:22,l:10,r:10},cw=W-P.l-P.r,ch=H-P.t-P.b
  ctx.clearRect(0,0,W,H)
  const nz=v=>{const x=parseFloat(v);return x>0?x:null}
  const allS=[
    {k:'cpl',d:rows.map(r=>nz(r.cpl)),c:'#4080ff'},
    {k:'cql',d:rows.map(r=>nz(r.cql)),c:'#d4a017'},
    {k:'ctr',d:rows.map(r=>parseFloat(r.ctr)||0),c:'#2ea043'},
    {k:'spend',d:rows.map(r=>parseFloat(r.spend_pl||0)+parseFloat(r.spend_plua||0)),c:'#e04050'}
  ]
  allS.forEach(s=>{const vals=s.d.filter(v=>v!=null);s.mn=vals.length?Math.min(...vals):0;s.mx=vals.length?Math.max(...vals):1;if(s.mx===s.mn)s.mx=s.mn+1})
  const n=rows.length,xs=n>1?cw/(n-1):0,px=i=>P.l+i*xs,py=(v,s)=>P.t+ch*(1-(v-s.mn)/(s.mx-s.mn))
  allS.forEach(s=>{
    const isFocus=s.k===focusKey
    ctx.globalAlpha=isFocus?1:0.1
    // gap-aware
    let started=false
    for(let i=0;i<n;i++){
      if(s.d[i]==null){started=false;continue}
      if(!started){ctx.beginPath();ctx.moveTo(px(i),py(s.d[i],s));started=true}
      else ctx.lineTo(px(i),py(s.d[i],s))
      // if next is null or end, stroke
      if(i===n-1||s.d[i+1]==null){ctx.strokeStyle=s.c;ctx.lineWidth=isFocus?2.5:1;ctx.stroke()}
    }
    ctx.globalAlpha=1
  })
}

function drawChart(rows){chartData=rows;const c=document.getElementById('dyn-chart');if(!c)return;c.width=c.parentElement.offsetWidth||600;c.height=130;renderChart(true)}
function renderChart(animate=false){
  if(!chartData||!chartData.length)return
  const rows=chartData,c=document.getElementById('dyn-chart'),ctx=c.getContext('2d')
  const W=c.width,H=c.height,P={t:10,b:22,l:10,r:10},cw=W-P.l-P.r,ch=H-P.t-P.b
  ctx.clearRect(0,0,W,H)
  const activeMets=new Set([...(document.querySelectorAll('.chleg.active')||[])].map(el=>el.dataset.cmet))
  // For CPL/CQL: 0 means no leads/quals that day → break the line (null), don't drop to bottom
  const nz=v=>{const n=parseFloat(v);return n>0?n:null}
  const allS=[
    {k:'cpl',d:rows.map(r=>nz(r.cpl)),c:'#4080ff',l:'CPL',gap:true},
    {k:'cql',d:rows.map(r=>nz(r.cql)),c:'#d4a017',l:'CQL',gap:true},
    {k:'ctr',d:rows.map(r=>parseFloat(r.ctr)||0),c:'#2ea043',l:'CTR'},
    {k:'spend',d:rows.map(r=>parseFloat(r.spend_pl||0)+parseFloat(r.spend_plua||0)),c:'#e04050',l:'Spend'}
  ]
  const S=allS.filter(s=>activeMets.size===0||activeMets.has(s.k))
  S.forEach(s=>{const vals=s.d.filter(v=>v!=null);s.mn=vals.length?Math.min(...vals):0;s.mx=vals.length?Math.max(...vals):1;if(s.mx===s.mn)s.mx=s.mn+1})
  const n=rows.length,xs=n>1?cw/(n-1):0,px=i=>P.l+i*xs,py=(v,s)=>P.t+ch*(1-(v-s.mn)/(s.mx-s.mn))
  ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=1
  for(let i=0;i<=4;i++){const y=P.t+ch*i/4;ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cw,y);ctx.stroke()}
  S.forEach(s=>{
    ctx.save()
    // Draw line in continuous segments, breaking at null values
    let segStart=-1
    const drawSeg=(a,b)=>{
      if(b<=a)return
      // gradient fill under segment
      ctx.beginPath();ctx.moveTo(px(a),H-P.b);ctx.lineTo(px(a),py(s.d[a],s))
      for(let i=a+1;i<=b;i++){const x0=px(i-1),y0=py(s.d[i-1],s),x1=px(i),y1=py(s.d[i],s),cx=(x0+x1)/2;ctx.bezierCurveTo(cx,y0,cx,y1,x1,y1)}
      ctx.lineTo(px(b),H-P.b);ctx.closePath()
      const g=ctx.createLinearGradient(0,P.t,0,H-P.b);g.addColorStop(0,s.c+'33');g.addColorStop(1,s.c+'00');ctx.fillStyle=g;ctx.fill()
      // stroke
      ctx.beginPath();ctx.moveTo(px(a),py(s.d[a],s))
      for(let i=a+1;i<=b;i++){const x0=px(i-1),y0=py(s.d[i-1],s),x1=px(i),y1=py(s.d[i],s),cx=(x0+x1)/2;ctx.bezierCurveTo(cx,y0,cx,y1,x1,y1)}
      ctx.strokeStyle=s.c;ctx.lineWidth=2;ctx.stroke()
    }
    for(let i=0;i<n;i++){
      if(s.d[i]!=null){
        if(segStart<0)segStart=i
      }else{
        if(segStart>=0){drawSeg(segStart,i-1);segStart=-1}
      }
    }
    if(segStart>=0)drawSeg(segStart,n-1)
    // dots only where data exists
    for(let i=0;i<n;i++){if(s.d[i]!=null){ctx.beginPath();ctx.arc(px(i),py(s.d[i],s),3,0,Math.PI*2);ctx.fillStyle=s.c;ctx.fill()}}
    ctx.restore()
  })
  ctx.fillStyle='rgba(144,144,168,.6)';ctx.font='10px Manrope,sans-serif';ctx.textAlign='center'
  const li=[0,Math.floor((n-1)/2),n-1].filter((v,i,a)=>a.indexOf(v)===i)
  li.forEach(i=>ctx.fillText(rows[i]?.day?.slice(5)||'',px(i),H-4))
  c._S=S;c._rows=rows;c._P=P;c._cw=cw;c._ch=ch
  // Draw-in animation — smooth brush stroke per line using clip
  if(animate&&n>1){
    const FRAMES=120        // total frames for one line
    const STAGGER=50        // frames delay between lines
    const TOTAL=FRAMES + S.length*STAGGER
    let frame=0

    function animFrame(){
      frame++
      ctx.clearRect(0,0,W,H)

      // Grid lines
      ctx.save()
      ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=1
      for(let i=0;i<=4;i++){const y=P.t+ch*i/4;ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cw,y);ctx.stroke()}
      ctx.restore()

      S.forEach((s,si)=>{
        const lineStart=si*STAGGER
        const lf=frame-lineStart
        if(lf<=0)return

        // ease in-out cubic for ultra smooth motion
        const raw=Math.min(lf/FRAMES,1)
        const p=raw<0.5?4*raw*raw*raw:(raw-1)*(2*raw-2)*(2*raw-2)+1

        ctx.save()
        // Clip to left portion of chart as line "draws"
        const clipX=P.l+p*cw+4
        ctx.beginPath()
        ctx.rect(0,0,clipX,H)
        ctx.clip()

        // Draw in gap-aware segments (break where s.d[i]==null)
        const segs=[]
        let ss=-1
        for(let i=0;i<n;i++){
          if(s.d[i]!=null){if(ss<0)ss=i}
          else{if(ss>=0){segs.push([ss,i-1]);ss=-1}}
        }
        if(ss>=0)segs.push([ss,n-1])

        segs.forEach(([a,b])=>{
          if(b<=a){
            // single point — just a dot handled below
            return
          }
          // Gradient fill
          ctx.beginPath()
          ctx.moveTo(px(a),H-P.b)
          ctx.lineTo(px(a),py(s.d[a],s))
          for(let i=a+1;i<=b;i++){const x0=px(i-1),y0=py(s.d[i-1],s),x1=px(i),y1=py(s.d[i],s),cxm=(x0+x1)/2;ctx.bezierCurveTo(cxm,y0,cxm,y1,x1,y1)}
          ctx.lineTo(px(b),H-P.b);ctx.closePath()
          const g=ctx.createLinearGradient(0,P.t,0,H-P.b);g.addColorStop(0,s.c+'45');g.addColorStop(1,s.c+'00');ctx.fillStyle=g;ctx.fill()
          // Stroke with glow
          ctx.beginPath();ctx.moveTo(px(a),py(s.d[a],s))
          for(let i=a+1;i<=b;i++){const x0=px(i-1),y0=py(s.d[i-1],s),x1=px(i),y1=py(s.d[i],s),cxm=(x0+x1)/2;ctx.bezierCurveTo(cxm,y0,cxm,y1,x1,y1)}
          ctx.strokeStyle=s.c;ctx.lineWidth=2;ctx.shadowColor=s.c;ctx.shadowBlur=8;ctx.stroke();ctx.shadowBlur=0
        })

        // Dots fade in as line passes them
        for(let i=0;i<n;i++){
          if(s.d[i]==null)continue
          const dotX=px(i)
          if(dotX>clipX)continue
          const dotProgress=Math.min(1,(clipX-dotX)/20)
          ctx.beginPath()
          ctx.arc(dotX,py(s.d[i],s),2.5*dotProgress,0,Math.PI*2)
          ctx.fillStyle=s.c
          ctx.globalAlpha=dotProgress
          ctx.fill()
          ctx.globalAlpha=1
        }

        ctx.restore()
      })

      // X-axis labels
      ctx.fillStyle='rgba(144,144,168,.6)'
      ctx.font='10px Manrope,sans-serif'
      ctx.textAlign='center'
      li.forEach(i=>ctx.fillText(rows[i]?.day?.slice(5)||'',px(i),H-4))

      if(frame<TOTAL)requestAnimationFrame(animFrame)
    }
    requestAnimationFrame(animFrame)
  }
}
function chartMouseMove(e){
  const c=this;if(!c._rows)return
  const rect=c.getBoundingClientRect(),mx=(e.clientX-rect.left)*(c.width/rect.width)
  const n=c._rows.length,xs=n>1?c._cw/(n-1):0;let ci=0,md=9999
  for(let i=0;i<n;i++){const x=c._P.l+i*xs,d=Math.abs(mx-x);if(d<md){md=d;ci=i}}
  if(md>40){document.getElementById('chart-tt').style.display='none';return}
  const tt=document.getElementById('chart-tt');tt.style.display='block'
  let tx=e.clientX-c.closest('.card').getBoundingClientRect().left+14
  if(tx>c.width-170)tx=e.clientX-c.closest('.card').getBoundingClientRect().left-170
  tt.style.left=tx+'px';tt.style.top='4px'
  const r=c._rows[ci]
  tt.innerHTML=`<strong>${r.day}</strong>`+c._S.map(s=>`<div class="ctrow"><span class="ctl" style="color:${s.c}">${s.l}</span><span class="ctv" style="color:${s.c}">${s.d[ci]}</span></div>`).join('')+`<div class="ctrow" style="border-top:1px solid var(--border);margin-top:4px;padding-top:4px"><span class="ctl">Spend</span><span class="ctv">$${Math.round((parseFloat(r.spend_pl)||0)+(parseFloat(r.spend_plua)||0))}</span></div>`
}

function rzalivs(){
  const geo=document.getElementById('zf-geo').value,st=document.getElementById('zf-status').value,q=document.getElementById('zf-q').value.toLowerCase()
  const sort=document.getElementById('zf-sort')?.value||'new'
  const buyer=document.getElementById('zf-buyer')?.value||''
  let f=ZALIVS.filter(z=>
    (!geo||z.geo===geo)&&
    (!st||z.status===st)&&
    (!buyer||z.buyer===buyer)&&
    (!_zfInd||z.ind===_zfInd)&&
    (!q||z.name.toLowerCase().includes(q))
  )
  // Sort — parse real date from z.date or campaign name
  const getZDate=z=>{
    const raw=z.date||parseDateFromCampName(z.name)||''
    if(!raw)return 0
    const p=raw.split('.')
    if(p.length===2){
      const yr=new Date().getFullYear()
      return new Date(yr+'-'+p[1].padStart(2,'0')+'-'+p[0].padStart(2,'0')).getTime()
    }
    return 0
  }
  if(sort==='new')f=[...f].sort((a,b)=>getZDate(b)-getZDate(a))
  else if(sort==='old')f=[...f].sort((a,b)=>getZDate(a)-getZDate(b))
  else if(sort==='score')f=[...f].sort((a,b)=>(b.score||0)-(a.score||0))
  else if(sort==='budget')f=[...f].sort((a,b)=>(b.rk_budget||0)-(a.rk_budget||0))
  document.getElementById('z-count').textContent='('+f.length+')'
  let html=''
  f.forEach(z=>{
    const rc=`${z.ind==='profit'?'rp':z.ind==='drop'?'rd':'ro'}${expZ===z.id?' rex':''}`
    const isAuto=!AUTO_STATUS_LOCKED.includes(z.status)
    const domHtml=z.domain?`<a class="dlnk" href="https://${z.domain}" target="_blank" rel="noopener">${z.domain.split('/')[0]}</a>`:'—'
    html+=`<tr class="${rc}" data-zid="${z.id}" style="cursor:pointer">
      <td style="width:30px"><input type="checkbox" class="zcheck zrow-check" data-zid="${z.id}" onclick="event.stopPropagation()"></td>
      <td><div class="ind-t"><button class="itb${z.ind==='profit'?' ap':''}" data-zid="${z.id}" data-ind="profit">P</button><button class="itb${z.ind==='drop'?' ad':''}" data-zid="${z.id}" data-ind="drop">D</button><button class="itb${z.ind==='off'?' ao':''}" data-zid="${z.id}" data-ind="off">O</button></div></td>
      <td style="color:var(--text3);font-size:11px;font-family:var(--mono)">${z.date||parseDateFromCampName(z.name)||'—'}</td>
      <td>${gchip(z.geo)}</td>
      <td><div class="rkn">${z.name}</div></td>
      <td><div style="display:flex;gap:3px">${spbs(z)}</div></td>
      <td><select class="ssel ${SCLS[z.status]||''}" data-zid="${z.id}">${['Check','Scale','OFF','Test','Proliw','Perezaliw'].map(o=>`<option${z.status===o?' selected':''}>${o}</option>`).join('')}</select>${isAuto?'<span class="auto-badge">auto</span>':''}</td>
      <td class="budg">$${z.ad_budget}<small>/$${z.rk_budget}</small></td>
      <td>${domHtml}</td>
      <td><div class="cwrp">${(z.creos||[]).map(c=>`<span class="ctag" data-zid="${z.id}" data-creo="${c}">${c}</span>`).join('')}${(z.creos||[]).length<5?`<button class="cadd" data-zid="${z.id}">+ крео</button>`:''}</div></td>
      <td>${z.buyer||'—'}</td>
    </tr>`
    if(expZ===z.id)html+=exRow(z)
  })
  document.getElementById('zt-body').innerHTML=html||`<tr><td colspan="10" class="empty">Нет заливов</td></tr>`
  document.querySelectorAll('#zt-body tr[data-zid]').forEach(tr=>{
    tr.addEventListener('click',e=>{
      if(e.target.closest('button,select,a,.ctag,.exrow,.exin,.exbl,.insta,.efi,.sbsv,.sbdl,.spb-e,.spb,.rmbtn,.ef-creo-del,.ef-creo-row'))return
      togZ(parseInt(tr.dataset.zid))
    })
  })
  // stopPropagation на textarea и inputs в expand чтобы выделение не закрывало строку
  document.querySelectorAll('.exin').forEach(ex=>{
    ex.addEventListener('mousedown',e=>e.stopPropagation())
    ex.addEventListener('mousemove',e=>e.stopPropagation())
    ex.addEventListener('mouseup',e=>e.stopPropagation())
  })
  document.querySelectorAll('.insta,.efi').forEach(inp=>{
    inp.addEventListener('mousedown',e=>e.stopPropagation())
    inp.addEventListener('mousemove',e=>e.stopPropagation())
    inp.addEventListener('mouseup',e=>e.stopPropagation())
    inp.addEventListener('selectstart',e=>e.stopPropagation())
  })
  // Prevent row collapse when selecting text in expand
  document.querySelectorAll('.exrow,.exin,.exbl').forEach(row=>{
    row.addEventListener('mousedown',e=>e.stopPropagation())
    row.addEventListener('click',e=>e.stopPropagation())
    row.addEventListener('mouseup',e=>e.stopPropagation())
  })
  document.querySelectorAll('.itb[data-ind]').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();setInd(parseInt(btn.dataset.zid),btn.dataset.ind)}))
  document.querySelectorAll('.spb[data-sc]').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();setScore(parseInt(btn.dataset.zid),parseInt(btn.dataset.sc))}))
  document.querySelectorAll('.ssel[data-zid]').forEach(sel=>{sel.addEventListener('click',e=>e.stopPropagation());sel.addEventListener('change',()=>setStatus(parseInt(sel.dataset.zid),sel))})
  document.querySelectorAll('.cadd[data-zid]').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();addCreoInline(parseInt(btn.dataset.zid))}))
  document.querySelectorAll('.ctag[data-creo]').forEach(tag=>tag.addEventListener('click',e=>{
    e.stopPropagation()
    openCreoInfo(tag.dataset.creo)
  }))
  document.querySelectorAll('.sbsv[data-zid]').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();saveEdit(parseInt(btn.dataset.zid))}))
  document.querySelectorAll('.sbdl[data-zid]').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();delZaliv(parseInt(btn.dataset.zid))}))
  document.querySelectorAll('.spb-e[data-sc]').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();setScore(parseInt(btn.dataset.zid),parseInt(btn.dataset.sc))}))
  // Checkbox logic
  document.querySelectorAll('.zrow-check').forEach(cb=>{
    cb.addEventListener('change',updateBulkBar)
  })
  const checkAll=document.getElementById('zcheck-all')
  if(checkAll){
    checkAll.addEventListener('click',e=>{
      e.stopPropagation()
      const checked=checkAll.checked
      document.querySelectorAll('.zrow-check').forEach(cb=>{cb.checked=checked})
      updateBulkBar()
    })
  }
}

function updateBulkBar(){
  const sel=[...document.querySelectorAll('.zrow-check:checked')]
  const bar=document.getElementById('zbulk-bar')
  const cnt=document.getElementById('zbulk-cnt')
  if(!bar||!cnt)return
  if(sel.length>0){bar.classList.add('show');cnt.textContent=sel.length+' выбрано'}
  else{bar.classList.remove('show')}
}

async function bulkDeleteZalivs(){
  const sel=[...document.querySelectorAll('.zrow-check:checked')].map(cb=>parseInt(cb.dataset.zid))
  if(!sel.length)return
  if(!confirm(`Удалить ${sel.length} заливов?`))return
  for(const id of sel){
    await db.from('zalivs').delete().eq('id',id)
    ZALIVS=ZALIVS.filter(z=>z.id!==id)
  }
  document.getElementById('zbulk-bar').classList.remove('show')
  toast(`Удалено ${sel.length} заливов`,'ok')
  rzalivs()
}

async function fetchCampaignMetrics(z){
  const el=document.getElementById('ex-metrics-'+z.id)
  if(!el)return
  try{
    // Parse date_start from zaliv date field
    let since=null
    const raw=z.date||''
    if(raw){
      const p=raw.split('.')
      if(p.length===2){
        const yr=new Date().getFullYear()
        since=`${yr}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`
      }
    }
    if(!since&&z.created_at)since=z.created_at.split('T')[0]
    const until=new Date().toISOString().split('T')[0]

    const r=await fetch(SB_URL+'/functions/v1/get-campaigns',{
      method:'POST',
      headers:{'Authorization':'Bearer '+SB_ANON,'Content-Type':'application/json'},
      body:JSON.stringify({action:'get_campaign_insights',campaign_id:z.campaign_id,since,until})
    })
    const d=await r.json()
    if(!d.ok||d.error){
      el.innerHTML='<div style="font-size:11px;color:var(--red)">Ошибка: '+(d.error||'Meta API')+'</div>'
      return
    }
    const cplColor=d.cpl>0&&d.cpl<10?'var(--green)':d.cpl<15?'var(--yellow)':d.cpl>0?'var(--red)':'var(--text)'
    el.innerHTML=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">
      <div style="background:var(--bg5);border-radius:5px;padding:7px 9px;text-align:center">

        <div style="font-size:16px;font-weight:800;color:var(--yellow);font-family:var(--mono)">$${d.spend}</div>
        <div style="font-size:9px;color:var(--text3)">${d.days}д · $${d.spend_daily}/д</div>
      </div>
      <div style="background:var(--bg5);border-radius:5px;padding:7px 9px;text-align:center">
        <div style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">CPL</div>
        <div style="font-size:16px;font-weight:800;color:${cplColor};font-family:var(--mono)">${d.cpl>0?'$'+d.cpl:'—'}</div>
        <div style="font-size:9px;color:var(--text3)">CTR: ${d.ctr}%</div>
      </div>
      <div style="background:var(--bg5);border-radius:5px;padding:7px 9px;text-align:center">
        <div style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">LEADS</div>
        <div style="font-size:16px;font-weight:800;color:#fff;font-family:var(--mono)">${d.leads}</div>
        <div style="font-size:9px;color:var(--text3)">${d.clicks} кликов</div>
      </div>
    </div>`
  }catch(e){
    if(el)el.innerHTML='<div style="font-size:11px;color:var(--red)">Ошибка загрузки</div>'
  }
}

async function setScore(id,score){
  const z=ZALIVS.find(x=>x.id===id);if(!z)return
  const isLocked=AUTO_STATUS_LOCKED.includes(z.status)
  let newStatus=z.status;if(!isLocked)newStatus=scoreToAutoStatus(score)
  // Intercept OFF transition — предлагаем архивировать крео
  if(!isLocked&&newStatus==='OFF'&&z.status!=='OFF'&&(z.creos||[]).length>0){
    // Сначала сохраняем score, потом интерсептим
    await db.from('zalivs').update({score,updated_at:new Date().toISOString()}).eq('id',id)
    z.score=score
    if(interceptOFF(id))return // модал открыт, статус применится позже
  }
  await db.from('zalivs').update({score,status:newStatus,updated_at:new Date().toISOString()}).eq('id',id)
  const prev=z.status;z.score=score
  if(!isLocked&&newStatus!==prev){z.status=newStatus;toast(`Score ${score} → ${prev} → ${newStatus}`,'info')}
  rzalivs()
}

  const z=ZALIVS.find(x=>x.id===id);if(!z)return

    if(interceptOFF(id)){

      sel.value=z.status;sel.className='ssel '+(SCLS[z.status]||'')

var _saveOrderTimer=null,_taskSaveBlock=false
async function saveTaskOrder(){
  // Debounce — wait 300ms after last drag before saving
  clearTimeout(_saveOrderTimer)
  _taskSaveBlock=true
  _saveOrderTimer=setTimeout(async()=>{
    // Save sort_order AND col for every task in current state
    for(let i=0;i<TASKS.length;i++){
      const t=TASKS[i]
      await db.from('tasks').update({
        sort_order:i*10,
        col:t.col,
        updated_at:new Date().toISOString()
      }).eq('id',t.id)
    }
    _saveOrderTimer=null
    // Keep block for extra 1s to prevent RT bounce

  },500)
}

function launchConfetti(){
  const canvas=document.getElementById('confetti-canvas')
  canvas.style.display='block'
  canvas.width=window.innerWidth;canvas.height=window.innerHeight
  const ctx=canvas.getContext('2d')
  const pieces=Array.from({length:150},()=>({
    x:Math.random()*canvas.width,y:Math.random()*canvas.height-canvas.height,
    r:Math.random()*6+4,c:`hsl(${Math.random()*360},90%,60%)`,
    vx:(Math.random()-0.5)*4,vy:Math.random()*4+2,
    rot:Math.random()*360,vr:(Math.random()-0.5)*8
  }))
  let frame=0
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height)
    pieces.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.vy+=0.08
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180)
      ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r)
      ctx.restore()
    })
    frame++
    if(frame<180)requestAnimationFrame(draw)
    else{ctx.clearRect(0,0,canvas.width,canvas.height);canvas.style.display='none'}
  }
  draw()
}

// ── DRAG & DROP v7 — чёткие зоны, сохранение порядка ──
var dragOverEl=null,dragOverPos=null

document.addEventListener('dragstart',e=>{
  const tc=e.target.closest('.tcard[data-id]');if(!tc)return
  dragId=parseInt(tc.dataset.id)
  e.dataTransfer.effectAllowed='move'
  e.dataTransfer.setData('text/plain',String(dragId))
  setTimeout(()=>tc.classList.add('dragging'),0)
})

document.addEventListener('dragend',()=>{
  document.querySelectorAll('.tcard.dragging,.tcard.drag-over-top,.tcard.drag-over-bot').forEach(t=>t.classList.remove('dragging','drag-over-top','drag-over-bot'))
  document.querySelectorAll('.kcol.dov').forEach(c=>c.classList.remove('dov'))
  dragId=null;dragOverEl=null;dragOverPos=null
})

document.addEventListener('dragover',e=>{
  e.preventDefault();e.dataTransfer.dropEffect='move'
  document.querySelectorAll('.tcard.drag-over-top,.tcard.drag-over-bot').forEach(t=>t.classList.remove('drag-over-top','drag-over-bot'))
  document.querySelectorAll('.kcol.dov').forEach(c=>c.classList.remove('dov'))
  const tc=e.target.closest('.tcard[data-id]')
  if(tc&&dragId&&parseInt(tc.dataset.id)!==dragId){
    const rect=tc.getBoundingClientRect()
    // Зона захвата — верхние 50% = вставить до, нижние 50% = вставить после
    dragOverPos=e.clientY<rect.top+rect.height*0.5?'top':'bot'
    dragOverEl=parseInt(tc.dataset.id)
    tc.classList.add(dragOverPos==='top'?'drag-over-top':'drag-over-bot')
  }else{
    dragOverEl=null;dragOverPos=null
    const col=e.target.closest('.kcol');if(col)col.classList.add('dov')
  }
})

document.addEventListener('drop',e=>{
  e.preventDefault()
  document.querySelectorAll('.tcard.drag-over-top,.tcard.drag-over-bot').forEach(t=>t.classList.remove('drag-over-top','drag-over-bot'))
  document.querySelectorAll('.kcol.dov').forEach(c=>c.classList.remove('dov'))
  if(!dragId)return

  const dragTask=TASKS.find(t=>t.id===dragId);if(!dragTask)return

  if(dragOverEl){
    const targetTask=TASKS.find(t=>t.id===dragOverEl);if(!targetTask)return
    const newCol=targetTask.col
    dragTask.col=newCol
    TASKS.splice(TASKS.indexOf(dragTask),1)
    const tIdx=TASKS.indexOf(targetTask)
    TASKS.splice(dragOverPos==='top'?tIdx:tIdx+1,0,dragTask)
    // Update col + sort_order for all affected tasks
    db.from('tasks').update({col:newCol,updated_at:new Date().toISOString()}).eq('id',dragId)
  }else{
    const col=e.target.closest('.kcol')
    if(col){
      const newCol=col.id.replace('kc-','')
      if(dragTask.col!==newCol){
        dragTask.col=newCol
        db.from('tasks').update({col:newCol,updated_at:new Date().toISOString()}).eq('id',dragId)
      }
    }
  }

  // Save sort_order to Supabase
  saveTaskOrder()
  rtasks()
  dragId=null;dragOverEl=null;dragOverPos=null
})

function showInlineNew(afterEl,onConfirm,placeholder='Название...'){
  document.querySelectorAll('.j-new-inline').forEach(el=>el.remove())

function loadDocById(id){
  curDoc=id
  const all=[...jLoose,...jFolders.flatMap(f=>f.docs)],d=all.find(x=>String(x.id)===String(id))
  if(d){
    document.getElementById('j-title').value=d.title
    const ed=document.getElementById('jeditor')
    // Если хранится как HTML — ставим напрямую; если старый markdown — конвертим
    if(d.body&&(d.body.trim().startsWith('<')||d.body.trim()===''))ed.innerHTML=d.body||''
    else ed.innerHTML=d.body?mdToHtml(d.body):''
  }
  rtree()
}

function mdToHtml(md){
  return md
    .replace(/^# (.+)$/gm,'<h1>$1</h1>')
    .replace(/^## (.+)$/gm,'<h2>$1</h2>')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`(.+?)`/g,'<code>$1</code>')
    .replace(/^---$/gm,'<hr>')
    .replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>')
    .replace(/^- (.+)$/gm,'<li>$1</li>')
    .replace(/(<li>.*<\/li>\n?)+/g,s=>`<ul>${s}</ul>`)
    .replace(/(\|[^\n]+\|\n?)+/g,t=>{
      const rows=t.trim().split('\n');if(rows.length<2)return t
      const head=rows[0].split('|').filter(c=>c.trim()).map(c=>`<th>${c.trim()}</th>`).join('')
      const body=rows.slice(2).map(r=>'<tr>'+r.split('|').filter(c=>c.trim()).map(c=>`<td>${c.trim()}</td>`).join('')+'</tr>').join('')
      return`<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`
    })
    .replace(/\n/g,'<br>')
}

    for(const camp of d.campaigns){
      const buyer=camp.name.trim()[0]==='I'?'Illia':'Danya'
      const geo=parseGeoFromName(camp.name)
      const funnel=parseFunnelFromName(camp.name)
      const date=parseDateFromCampName(camp.name)
      const budget=parseFloat(camp.daily_budget||0)/100||0

      // Check if zaliv with exact same name already exists
      // Normalize names for comparison
      const normName=n=>n.trim().replace(/\s+/g,' ').toLowerCase()
      // Find match but ensure campaign_id not already used by another zaliv
      const campIdStr=String(camp.id)
      const alreadyAssigned=ZALIVS.find(z=>z.campaign_id===campIdStr&&z.name.trim()!==camp.name.trim())
      if(alreadyAssigned){
        console.log('campaign_id already assigned to different zaliv:',alreadyAssigned.name)
        replaced++; continue
      }
      const existing=ZALIVS.find(z=>normName(z.name)===normName(camp.name))

      if(existing){
        // Replace: update existing zaliv with fresh data + campaign_id
        const upd={
          campaign_id:String(camp.id),
          ad_budget:budget,
          rk_budget:budget,
          geo,funnel,buyer,
          date:date||existing.date,
          updated_at:new Date().toISOString()
        }
        const{error}=await db.from('zalivs').update(upd).eq('id',existing.id)
        if(!error){
          Object.assign(existing,upd)
          // Update imported_campaigns
          await db.from('imported_campaigns').upsert({campaign_id:String(camp.id),zaliv_id:existing.id},{onConflict:'campaign_id'})
          replaced++
          console.log('Replaced:',camp.name)
        }
        continue
      }

      // Skip if already imported by campaign_id
      if(importedIds.has(String(camp.id)))continue

      // New zaliv
      const{data:zData,error}=await db.from('zalivs').insert({
        geo,name:camp.name,
        ad_budget:budget,rk_budget:budget,
        domain:'',creos:[],goals:[],
        ind:'profit',status:'Check',insights:'',
        buyer,funnel,score:3,
        campaign_id:String(camp.id),
        date:date||new Date().toLocaleDateString('ru',{day:'2-digit',month:'2-digit'})
      }).select().single()
      if(!error&&zData){
        ZALIVS.unshift(zData)
        await db.from('imported_campaigns').insert({campaign_id:String(camp.id),zaliv_id:zData.id})
        added++
      }
    }
    setSS('ok',(added+replaced)>0?`Импорт: +${added} новых, ${replaced} обновлено`:'Нет изменений')
    if(added>0||replaced>0){
      toast(`Импорт Meta: +${added} новых, ${replaced} обновлено`,'ok')
      rzalivs()
    }else toast('Нет новых кампаний за последние 3 дня','info')
    // Auto-match campaign IDs for existing zalivs
    setTimeout(autoMatchCampaignIds,500)
  }catch(e){
    setSS('','Ошибка импорта')
    toast('Нужно задеплоить функцию get-campaigns в Supabase','err')
    console.log('Import error:',e)
  }
}

function parseGeoFromName(name){
  const n=name.toUpperCase()
  const brIdx=n.indexOf('}')
  if(brIdx>=0){
    const after=n.substring(brIdx+1,brIdx+6)
    if(after.startsWith('PLUA'))return'PLUA'
    if(after.startsWith('UA'))return'PLUA'
    if(after.startsWith('PL'))return'PL'
  }
  if(n.includes('UA'))return'PLUA'
  return'PL'
}

function parseFunnelFromName(name){
  const n=name.toLowerCase()
  if(n.includes('kalk')||n.includes('калькул'))return'Калькулятор'
  if(n.includes('vizit')||n.includes('визит'))return'Визита'
  if(n.includes('proj')||n.includes('проект'))return'Проект'
  if(n.includes('lead')||n.includes('лид'))return'Лид-магнит'
  return'Калькулятор'
}

function parseDateFromCampName(name){
  // Matches: D{17.06} I[16.06] D[09.06] etc
  // After first letter, optionally {[ then DD.MM
  const m=name.match(/^[A-Za-z][{\[(]?(\d{2}[.,]\d{2})/)
  if(m)return m[1].replace(',','.')
  // fallback: any DD.MM pattern
  const m2=name.match(/(\d{2}[.,]\d{2})/)
  if(m2)return m2[1].replace(',','.')
  return null
}

async function fetchCreoAddMetrics(z){
  if(!z.campaign_id)return null
  try{
    let since=null
    const raw=z.date||''
    if(raw){const p=raw.split('.');if(p.length===2){const yr=new Date().getFullYear();since=`${yr}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`}}
    if(!since&&z.created_at)since=z.created_at.split('T')[0]
    const until=new Date().toISOString().split('T')[0]
    const r=await fetch(SB_URL+'/functions/v1/get-campaigns',{
      method:'POST',
      headers:{'Authorization':'Bearer '+SB_ANON,'Content-Type':'application/json'},
      body:JSON.stringify({action:'get_campaign_insights',campaign_id:z.campaign_id,since,until})
    })
    const d=await r.json()
    if(d.ok)return d
    return null
  }catch(e){return null}
}

function _buildCreoAddModalFallback(z){
  // Use METRICS as fallback
  let dateStartISO=null
  const raw=z.date||''
  if(raw){const p=raw.split('.');if(p.length===2){const yr=new Date().getFullYear();dateStartISO=`${yr}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`}}
  if(!dateStartISO&&z.created_at)dateStartISO=z.created_at.split('T')[0]
  const dateEnd=new Date().toISOString().split('T')[0]
  const metrics=METRICS.filter(m=>(!dateStartISO||m.day>=dateStartISO)&&m.day<=dateEnd)
  let spend=0,totalLeads=0,totalQuals=0
  metrics.forEach(r=>{
    if(z.geo==='PL'){spend+=parseFloat(r.spend_pl||0);totalLeads+=(r.leads_pl||0)}
    else if(z.geo==='PLUA'){spend+=parseFloat(r.spend_plua||0);totalLeads+=(r.leads_plua||0)}
    else{spend+=parseFloat(r.spend_pl||0)+parseFloat(r.spend_plua||0);totalLeads+=(r.leads_pl||0)+(r.leads_plua||0)}
    totalQuals+=r.quals||0
  })
  spend=Math.round(spend*100)/100
  const autoCpl=totalLeads>0?Math.round(spend/totalLeads*100)/100:0
  const autoCql=totalQuals>0?Math.round(spend/totalQuals*100)/100:0
  const avgCtr=metrics.length?Math.round(metrics.reduce((s,r)=>s+parseFloat(r.ctr||0),0)/metrics.length*100)/100:0
  const dateStart=z.date||new Date().toLocaleDateString('ru',{day:'2-digit',month:'2-digit'})
  const dateEndFmt=new Date().toLocaleDateString('ru',{day:'2-digit',month:'2-digit'})
  _renderCreoAddForm(z,{spend,totalLeads,totalQuals,autoCpl,autoCql,avgCtr,dateStart,dateEndFmt})
}

function renderCreoTable(){

  const cnt=document.getElementById('creo-lib-count')
  if(cnt)cnt.textContent='('+f.length+')'

  // Stats strip

  if(statsEl){
    const ready=CREO_LIB.filter(x=>x.status==='ready').length
    const used=CREO_LIB.filter(x=>x.status==='used').length
    const hall=CREO_LIB.filter(x=>x.status==='hall').length

    `
  }

  const tbody=document.getElementById('clf-tbody')
  if(!tbody)return

  if(!f.length){
    tbody.innerHTML=`<tr><td colspan="11" class="empty">Нет крео — добавь первый</td></tr>`
    return
  }

  tbody.innerHTML=f.map(cr=>{
    const statusColor=cr.status==='hall'?'#ffd700':cr.status==='used'?'var(--yellow)':'var(--blue)'
    const statusLabel=cr.status==='hall'?'🏆 MWP':cr.status==='used'?'⚡ Use':'✨ Clean'
    const geoClass=cr.geo==='PL'?'gpl':'gplua'
    const ctrColor=cr.avg_ctr>2?'var(--green)':cr.avg_ctr>1?'var(--yellow)':cr.avg_ctr>0?'var(--red)':'var(--text3)'
    const cplColor=cr.avg_cpl>0&&cr.avg_cpl<10?'var(--green)':cr.avg_cpl<15?'var(--yellow)':cr.avg_cpl>0?'var(--red)':'var(--text3)'
    return`<tr>
      <td>
        <div style="display:flex;gap:4px;align-items:center">
          <button class="spb clf-edit-btn" style="width:28px;height:28px;font-size:12px" data-clf-edit="${cr.id}" title="Редактировать">✏️</button>
          ${cr.status!=='hall'?`<button class="spb s5 clf-hall-btn" style="width:28px;height:28px;font-size:11px" data-clf-hall="${cr.id}" title="В зал славы">🏆</button>`:''}
          <button class="spb s0 clf-del-btn" style="width:28px;height:28px;font-size:11px" data-clf-del="${cr.id}" title="Удалить">✕</button>
        </div>
      </td>
      <td>
        ${cr.screenshot_url
          ?`<img class="clf-thumb" src="${cr.screenshot_url}" onclick="event.stopPropagation();window.open('${cr.screenshot_url}','_blank')">`
          :`<div class="clf-thumb-placeholder">${cr.status==='hall'?'🏆':cr.status==='used'?'📊':'🎨'}</div>`
        }
      </td>
      <td>
        <div style="font-weight:700;color:#fff;font-size:12px">${cr.name}</div>
        ${cr.notes?`<div style="font-size:10px;color:var(--text3);margin-top:2px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${cr.notes}</div>`:''}
      </td>
      <td><span class="zgeo gchip ${geoClass}">${cr.geo}</span></td>
      <td><span class="fchip">${cr.funnel||'—'}</span></td>
      <td><span style="font-size:10px;font-weight:700;color:${statusColor}">${statusLabel}</span></td>
      <td style="font-family:var(--mono);font-weight:700;color:${ctrColor}">${cr.avg_ctr?cr.avg_ctr+'%':'—'}</td>
      <td style="font-family:var(--mono);font-weight:700;color:${cplColor}">${cr.avg_cpl?'$'+cr.avg_cpl:'—'}</td>
      <td style="font-family:var(--mono);color:var(--text2)">${cr.avg_cql?'$'+cr.avg_cql:'—'}</td>

async function saveCreoLib(){
  const name=document.getElementById('cl-name').value.trim()
  if(!name){toast('Введи название','err');return}
  const geo=document.getElementById('cl-geo').value
  const funnel=document.getElementById('cl-funnel').value

  const fileInp=document.getElementById('cl-img-inp')
  const fileInp2=document.getElementById('cl-img-inp')

    const{error:upErr}=await db.storage.from('creo-screenshots').upload(path,uploadFile,{upsert:true,contentType:uploadFile.type||'image/png'})

    else{const{data:ud}=db.storage.from('creo-screenshots').getPublicUrl(path);screenshot_url=ud.publicUrl}
    _pastedImageFile=null
  }

  const payload={name,geo,funnel,buyer,status,notes,screenshot_url,hall_geo}

  if(clEditId){
    const{error}=await db.from('creo_library').update(payload).eq('id',clEditId)
    if(!error){const cr=CREO_LIB.find(x=>x.id===clEditId);if(cr)Object.assign(cr,payload);toast('Обновлено','ok')}
    else{toast('Ошибка: '+error.message,'err');return}
  }else{

    else{toast('Ошибка: '+(error?.message||'unknown'),'err');return}
  }
  document.getElementById('mo-creo-lib').classList.remove('open')
  renderCreoTable()
}

// Auto-update creo status when added to zaliv
// Called from openCreoAddModal after archiving
async function markCreosAsUsed(creoNames, stats){
  for(const name of creoNames){
    const cr=CREO_LIB.find(x=>x.name===name||x.name===name.trim())
    if(!cr)continue
    const launches=(cr.launches||0)+1
    // Weighted average: blend old stats with new
    const w=1/launches
    const newCtr=cr.avg_ctr?Math.round((cr.avg_ctr*(1-w)+(stats.ctr||0)*w)*100)/100:(stats.ctr||0)
    const newCpl=cr.avg_cpl?Math.round((cr.avg_cpl*(1-w)+(stats.cpl||0)*w)*100)/100:(stats.cpl||0)
    const newCql=cr.avg_cql?Math.round((cr.avg_cql*(1-w)+(stats.cql||0)*w)*100)/100:(stats.cql||0)
    const upd={status:'used',launches,avg_ctr:newCtr,avg_cpl:newCpl,avg_cql:newCql}
    const{error}=await db.from('creo_library').update(upd).eq('id',cr.id)
    if(!error)Object.assign(cr,upd)
  }
  renderCreoTable()
  toast('Статка по крео обновлена','ok')
}

// Tab key → callout block (Obsidian-style)
document.getElementById('jeditor').addEventListener('keydown',function(e){
  if(e.key==='Tab'){
    e.preventDefault()
    const sel=window.getSelection()
    if(!sel.rangeCount)return
    const range=sel.getRangeAt(0)
    const node=range.startContainer
    // Find the closest block-level element
    const block=node.nodeType===3
      ?node.parentElement?.closest('h1,h2,h3,h4,p,div:not(.jeditor):not(.callout),li')
      :node.closest('h1,h2,h3,h4,p,div:not(.jeditor):not(.callout),li')
    if(block&&block.tagName==='LI'){
      document.execCommand('indent',false,null)
      return
    }
    if(block&&block.id!=='jeditor'){
      // Wrap in callout preserving all content/HTML
      const callout=document.createElement('div')
      callout.className='callout'
      callout.innerHTML=block.innerHTML||block.textContent
      block.parentNode.replaceChild(callout,block)
      // Place cursor at end of callout
      const r=document.createRange()
      r.selectNodeContents(callout)
      r.collapse(false)
      sel.removeAllRanges()
      sel.addRange(r)
    }else{
      // Fallback: insert callout block
      document.execCommand('insertHTML',false,'<div class="callout"><br></div>')
    }
  }
})

// Delete table when cursor is inside it
function deleteTable(){

  if(!sel.rangeCount)return

  if(table){table.remove();toast('Таблица удалена','ok')}

// ── AUTO-MATCH CAMPAIGN IDs ──
async function autoMatchCampaignIds(){
  if(!db)return
  setSS('syncing','Матчинг campaign IDs...')
  try{
    const r=await fetch(SB_URL+'/functions/v1/get-campaigns',{
      method:'POST',
      headers:{'Authorization':'Bearer '+SB_ANON,'Content-Type':'application/json'},
      body:'{}'
    })
    const d=await r.json()
    if(!d.campaigns?.length){setSS('ok','—');return}

    let matched=0
    // Track which campaign_ids have already been assigned
    const usedCampIds=new Set(ZALIVS.filter(z=>z.campaign_id).map(z=>z.campaign_id))

    for(const camp of d.campaigns){
      // Skip if this campaign_id already assigned to any zaliv
      if(usedCampIds.has(String(camp.id)))continue

      // Find first zaliv without campaign_id that matches this campaign name
      const normCamp=camp.name.toLowerCase().replace(/\s+/g,'').slice(0,25)
      const match=ZALIVS.find(z=>{
        if(z.campaign_id)return false // already has ID
        const normZ=z.name.toLowerCase().replace(/\s+/g,'').slice(0,25)
        return normZ===normCamp||normZ.includes(normCamp.slice(0,15))||normCamp.includes(normZ.slice(0,15))
      })
      if(match){
        await db.from('zalivs').update({campaign_id:String(camp.id)}).eq('id',match.id)
        match.campaign_id=String(camp.id)
        usedCampIds.add(String(camp.id))
        matched++
        console.log('Matched:',match.name,'→',camp.id)
      }
    }
    setSS('ok',matched>0?`Сопоставлено ${matched} кампаний`:'Нет новых совпадений')
    if(matched>0){
      toast(`Автоматически сопоставлено ${matched} campaign IDs`,'ok')
      rzalivs()
    }else{
      toast('Совпадений не найдено — введи ID вручную в редактировании','info')
    }
  }catch(e){
    setSS('','Ошибка');console.error(e)
  }
}

function renderAnTree(){
  const el=document.getElementById('an-tree')
  if(!el)return
  const q=(document.getElementById('an-search')?.value||'').toLowerCase()

  // Group zalivs by geo → year → month
  // Use all zalivs + analyses
  const geo_yr_month = {}

  // From analyses - group by period_from month, not created_at
  RK_ANALYSES.forEach(a=>{
    const geo=a.geo||'?'
    // Use period_from to determine month (when the campaign ran)
    let mo=a.month_key||'?'
    if(a.period_from){
      // period_from format: YYYY-MM-DD or DD.MM.YYYY
      let pf=a.period_from
      if(pf.includes('.')){const p=pf.split('.');const yr2=new Date().getFullYear();pf=`${yr2}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`}
      mo=pf.slice(0,7) // YYYY-MM
    }
    const yr=mo.split('-')[0]||'2026'
    const zid=a.zaliv_id
    if(!geo_yr_month[geo])geo_yr_month[geo]={}
    if(!geo_yr_month[geo][yr])geo_yr_month[geo][yr]={}
    if(!geo_yr_month[geo][yr][mo])geo_yr_month[geo][yr][mo]={}
    if(!geo_yr_month[geo][yr][mo][zid])geo_yr_month[geo][yr][mo][zid]={name:a.zaliv_name,count:0,ind:null}
    geo_yr_month[geo][yr][mo][zid].count++
  })

  // Add zalivs without analyses — use REAL date from campaign name, not today
  ZALIVS.forEach(z=>{
    if(q&&!z.name.toLowerCase().includes(q))return
    const geo=z.geo||'?'
    // Parse month from z.date (DD.MM) or from campaign name
    const curYr=new Date().getFullYear().toString()
    let mo=`${curYr}-${String(new Date().getMonth()+1).padStart(2,'0')}` // fallback
    let dateStr=z.date||parseDateFromCampName(z.name)
    if(dateStr&&dateStr.includes('.')){
      const p=dateStr.split('.')
      if(p.length>=2)mo=`${curYr}-${p[1].padStart(2,'0')}`
    }
    const yr=mo.split('-')[0]
    if(!geo_yr_month[geo])geo_yr_month[geo]={}
    if(!geo_yr_month[geo][yr])geo_yr_month[geo][yr]={}
    if(!geo_yr_month[geo][yr][mo])geo_yr_month[geo][yr][mo]={}
    if(!geo_yr_month[geo][yr][mo][z.id]){
      geo_yr_month[geo][yr][mo][z.id]={name:z.name,count:0,ind:z.ind}
    }else{
      geo_yr_month[geo][yr][mo][z.id].ind=z.ind
    }
  })

  const MONTH_NAMES=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь']
  const moName=mk=>{const m=parseInt(mk?.split('-')[1]||1);return MONTH_NAMES[m-1]||mk}
  const indColor=ind=>ind==='profit'?'#2ea043':ind==='drop'?'#e08040':'#e04050'

  let html=''
  Object.entries(geo_yr_month).sort().forEach(([geo,yrs])=>{
    Object.entries(yrs).sort((a,b)=>b[0]-a[0]).forEach(([yr,months])=>{
      html+=`<div class="an-tree-yr" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'':'none'">
        <span class="zgeo gchip ${geo==='PL'?'gpl':'gplua'}" style="font-size:9px;padding:1px 5px">${geo}</span>
        <span style="font-weight:700;font-size:12px">RKFB ${geo} ${yr}</span>
        <span style="font-size:10px;color:var(--text3);margin-left:auto">${Object.values(months).reduce((s,m)=>s+Object.keys(m).length,0)} РК</span>
      </div>
      <div class="an-yr-body">`

      Object.entries(months).sort((a,b)=>b[0].localeCompare(a[0])).forEach(([mo,zalivs])=>{
        html+=`<div class="an-tree-sect">${moName(mo)} ${yr}</div>`
        Object.entries(zalivs).forEach(([zid,info])=>{
          if(q&&!info.name.toLowerCase().includes(q))return
          const dot=indColor(info.ind)
          const isActive=_anSelZalivId===parseInt(zid)
          html+=`<div class="an-tree-item${isActive?' active':''}" onclick="selectAnZaliv(${zid})">
            <div class="an-dot" style="background:${dot};flex-shrink:0"></div>
            <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${info.name}</span>
            ${info.count>0?`<span class="an-meta">${info.count}×</span>`:'<span class="an-meta" style="color:var(--bord2)">+ анализ</span>'}
          </div>`
        })
      })
      html+=`</div>`
    })
  })

  el.innerHTML=html||'<div class="empty" style="padding:20px;font-size:11px">Нет данных</div>'
}

function applyAnPreset(preset){
  const zid=parseInt(document.getElementById('an-zaliv-sel')?.value)
  const z=ZALIVS.find(x=>x.id===zid)
  const raw=z?.date||''
  let start=new Date()
  if(raw){const p=raw.split('.');if(p.length===2){const yr=new Date().getFullYear();start=new Date(`${yr}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`)}}
  const fmt=d=>d.toISOString().split('T')[0]
  const add=n=>new Date(start.getTime()+n*864e5)
  const map={'1dc':[fmt(start),fmt(start)],'2dc':[fmt(add(1)),fmt(add(1))],'3dc':[fmt(start),fmt(add(1))],'kwartal':[fmt(start),fmt(add(2))]}
  const [f,t]=map[preset]||[fmt(start),fmt(start)]
  document.getElementById('an-from').value=f
  document.getElementById('an-to').value=t
}

async function generateAnalysis(){
  const zalivId=parseInt(document.getElementById('an-zaliv-sel')?.value)
  if(!zalivId){toast('Выбери залив','err');return}
  const z=ZALIVS.find(x=>x.id===zalivId)
  if(!z)return
  const from=document.getElementById('an-from').value
  const to=document.getElementById('an-to').value
  if(!from||!to){toast('Укажи период','err');return}
  const wrap=document.getElementById('an-results-wrap')
  if(!wrap)return
  wrap.innerHTML='<div class="empty" style="padding:16px">⏳ Загрузка из Meta...</div>'

  if(!z.campaign_id){
    wrap.innerHTML='<div class="empty" style="padding:16px;color:#e08040">⚠ Нет Campaign ID — введи в редактировании залива</div>'
    return
  }

  // Fetch adsets first
  var adsets=[]
  try{
    const r=await fetch(SB_URL+'/functions/v1/get-campaigns',{
      method:'POST',headers:{'Authorization':'Bearer '+SB_ANON,'Content-Type':'application/json'},
      body:JSON.stringify({action:'get_adsets',campaign_id:z.campaign_id})
    })

    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">

      ${adsets.map(a=>`<button class="pb" onclick="selectAdsetView('${a.id}',${zalivId},'${from}','${to}')" data-adset="${a.id}" title="${a.name}">${a.name.slice(0,25)}${a.name.length>25?'...':''}</button>`).join('')}
    </div>
    <div id="an-adset-result"></div>
  </div>`

function recalcAnalysis(){
  const v=id=>parseFloat(document.getElementById(id)?.value)||0
  const spend=v('an-i-spend')
  const clicks=v('an-i-clicks')
  const leads=v('an-i-leads')
  const quals=v('an-i-quals')
  const cr=clicks>0?Math.round(leads/clicks*10000)/100:0
  const cpl=leads>0?Math.round(spend/leads*100)/100:0
  const ar=leads>0?Math.round(quals/leads*10000)/100:0
  const cql=quals>0?Math.round(spend/quals*100)/100:0
  const cplC=cpl>0&&cpl<10?'#2ea043':cpl<15?'#e08040':cpl>0?'#e04050':'#fff'
  const el=id=>document.getElementById(id)
  if(el('an-v-cr'))el('an-v-cr').textContent=cr+'%'
  if(el('an-v-cpl')){el('an-v-cpl').textContent=cpl>0?'$'+cpl:'—';el('an-v-cpl').style.color=cplC}
  if(el('an-v-ar'))el('an-v-ar').textContent=ar+'%'
  if(el('an-v-cql'))el('an-v-cql').textContent=cql>0?'$'+cql:'—'
}

async function saveCurrentAnalysis(zid,spendArg,clicksArg,reachArg,ctrArg,cpcArg,cpmArg,freqArg,avgViewArg,buyer,geo,funnel,from,to,adsetId,adsetName){
  const z=ZALIVS.find(x=>x.id===zid)
  const vv=id=>parseFloat(document.getElementById(id)?.value)||0
  const spend=vv('an-i-spend')||spendArg
  const clicks=vv('an-i-clicks')||clicksArg
  const reach=vv('an-i-reach')||reachArg
  const ctr=vv('an-i-ctr')||ctrArg
  const cpc=vv('an-i-cpc')||cpcArg
  const cpm=vv('an-i-cpm')||cpmArg
  const freq=vv('an-i-freq')||freqArg
  const avgView=vv('an-i-viewtime')||avgViewArg
  const amfreq=vv('an-i-amfreq')
  const leads=vv('an-i-leads')
  const quals=vv('an-i-quals')
  const notes=document.getElementById('an-notes')?.value||''
  const cr=clicks>0?Math.round(leads/clicks*10000)/100:0
  const cpl=leads>0?Math.round(spend/leads*100)/100:0
  const ar=leads>0?Math.round(quals/leads*10000)/100:0
  const cql=quals>0?Math.round(spend/quals*100)/100:0
  const now=new Date()
  const monthKey=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`

  // Determine month from period_from (when campaign ran)
  let periodMonthKey=monthKey
  if(from){
    let pf=from
    if(pf.includes('.')){const p=pf.split('.');const yr2=new Date().getFullYear();pf=`${yr2}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`}
    periodMonthKey=pf.slice(0,7)
  }
  const payload={
    zaliv_id:zid,zaliv_name:z?.name||'',
    period_from:from,period_to:to,
    reach,frequency:freq,amfreq,cpm,avg_view_time:avgView,
    clicks,cpc,ctr,spend,leads,quals,cr,cpl,ar,cql,
    buyer:buyer||CURRENT_USER?.name||'',geo,funnel,notes,
    month_key:periodMonthKey,
    adset_id:adsetId&&adsetId!=='all'&&adsetId!=='undefined'?adsetId:null,
    adset_name:adsetName&&adsetName!=='Вся кампания'?adsetName:null
  }
  // Save to adset_analyses if adset selected
  if(adsetId&&adsetId!=='all'&&adsetId!=='undefined'){
    await db.from('adset_analyses').insert({
      ...payload,campaign_id:ZALIVS.find(x=>x.id===zid)?.campaign_id||'',
      adset_id:adsetId,adset_name:adsetName||''
    })
  }
  const{data,error}=await db.from('rk_analyses').insert(payload).select().single()

  if(!error&&data){
    RK_ANALYSES.unshift(data)
    toast('Анализ сохранён ✓','ok')
    renderAnTree()
    selectAnZaliv(zid)
  }else{
    toast('Ошибка: '+(error?.message||'unknown'),'err')
    console.error(error)
  }
}

    toast('Анализ обновлён ✓','ok')
    document.getElementById('an-edit-form-'+id)?.remove()
    renderAnZalivHistory(a.zaliv_id)
  }else{
    toast('Ошибка: '+error.message,'err')
  }
}


// ── INSIGHTS → Supabase ──
async function loadInsights(){
  if(!db)return
  try{
    const{data}=await db.from('creo_insights').select('*').order('created_at',{ascending:false})
    INSIGHTS=data||[]
  }catch(e){
    // Fallback to localStorage
    try{INSIGHTS=JSON.parse(localStorage.getItem('creo_insights')||'[]')}catch(e2){INSIGHTS=[]}
  }
}

async function addInsightInline(){
  try{
    const tag=document.getElementById('insight-tag')?.value||'insight'
    const text=document.getElementById('insight-new-text')?.value?.trim()
    if(!text){toast('Напиши мысль','err');return}
    const buyer=CURRENT_USER?.name||'Unknown'
    const newInsight={tag,text,buyer,created_at:new Date().toISOString()}
    // Save to Supabase
    const{data,error}=await db.from('creo_insights').insert({tag,text,buyer}).select().single()
    if(!error&&data){
      INSIGHTS.unshift(data)
    }else{
      // Fallback localStorage
      INSIGHTS.unshift({...newInsight,date:new Date().toLocaleDateString('ru')})
      localStorage.setItem('creo_insights',JSON.stringify(INSIGHTS))
    }
    document.getElementById('insight-new-text').value=''
    renderInsightBoard()
    toast('Сохранено','ok')
  }catch(e){console.error('addInsightInline:',e);toast('Ошибка: '+e.message,'err')}
}

async function delInsight(id){
  // id can be DB id or array index
  const item=INSIGHTS[id]
  if(!item)return
  if(item.id){
    await db.from('creo_insights').delete().eq('id',item.id)
  }
  INSIGHTS.splice(id,1)
  if(!item.id)localStorage.setItem('creo_insights',JSON.stringify(INSIGHTS))
  renderInsightBoard()
}

function normDate(d){
  // Normalize DD.MM or DD.MM.YYYY or YYYY-MM-DD → YYYY-MM-DD
  if(!d)return ''
  if(d.includes('-'))return d.slice(0,10)
  if(d.includes('.')){const p=d.split('.');const yr=p[2]||new Date().getFullYear();return `${yr}-${(p[1]||'01').padStart(2,'0')}-${(p[0]||'01').padStart(2,'0')}`}
  return d
}

function rdashBuyer(buyer){
  const from=document.getElementById('pd-from')?.value
  const to=document.getElementById('pd-to')?.value
  const analyses=RK_ANALYSES.filter(a=>{
    if(a.buyer!==buyer)return false
    const pf=normDate(a.period_from)
    if(from&&pf&&pf<from)return false
    if(to&&pf&&pf>to)return false
    return true
  })

  // Relabel KPI cards for buyer view
  const setLabel=(idx,txt)=>{const labs=document.querySelectorAll('#page-dash .krow .klab');if(labs[idx])labs[idx].textContent=txt}
  setLabel(0,'SPEND '+buyer.toUpperCase())
  setLabel(1,'ЛИДЫ')
  setLabel(2,'CPL')
  setLabel(3,'CQL')
  setLabel(4,'КВАЛЫ')
  setLabel(5,'CTR AVG')

  const setKpi=(id,val,color)=>{const el=document.getElementById(id);if(el){el.textContent=val;if(color)el.style.color=color;el.style.textShadow=''}}

  if(!analyses.length){
    ['d-spend','d-daily','d-cpl','d-cql','d-roi','d-ctr'].forEach(id=>setKpi(id,'—'))
    const cv=document.getElementById('dyn-chart')
    if(cv){const ctx=cv.getContext('2d');ctx.clearRect(0,0,cv.width,cv.height)}
    const title=document.querySelector('#page-dash .ctit')
    return
  }

  // ── DEDUP: one analysis per RK to avoid double-counting ──
  // Multiple analyses per RK (1DC/2DC/3DC/Kwartal) overlap in period → summing inflates quals.
  // Adset-level analyses also duplicate campaign-level (campaign = sum of adsets).
  // Rule: per zaliv_id, prefer campaign-level (no adset_id), then widest period, then latest.
  function pickOnePerRK(list){
    const byZaliv={}
    list.forEach(a=>{
      const zid=a.zaliv_id
      if(!byZaliv[zid]){byZaliv[zid]=a;return}
      const cur=byZaliv[zid]
      // Prefer campaign-level over adset-level
      const aIsCamp=!a.adset_id, curIsCamp=!cur.adset_id
      if(aIsCamp&&!curIsCamp){byZaliv[zid]=a;return}
      if(!aIsCamp&&curIsCamp)return
      // Both same level — prefer widest period span
      const span=x=>{const f=normDate(x.period_from),t=normDate(x.period_to);if(!f||!t)return 0;return (new Date(t)-new Date(f))}
      const sa=span(a),sc=span(cur)
      if(sa>sc){byZaliv[zid]=a;return}
      if(sa<sc)return
      // Same span — prefer latest created
      if((a.created_at||'')>(cur.created_at||''))byZaliv[zid]=a
    })
    return Object.values(byZaliv)
  }
  const dedup=pickOnePerRK(analyses)

  const totSpend=Math.round(dedup.reduce((s,a)=>s+(a.spend||0),0)*100)/100
  const totLeads=dedup.reduce((s,a)=>s+(a.leads||0),0)
  const totQuals=dedup.reduce((s,a)=>s+(a.quals||0),0)
  const totClicks=dedup.reduce((s,a)=>s+(a.clicks||0),0)
  const avgCpl=totLeads>0?Math.round(totSpend/totLeads*100)/100:0
  const avgCql=totQuals>0?Math.round(totSpend/totQuals*100)/100:0
  // CTR avg weighted by clicks
  const ctrVals=dedup.filter(a=>a.ctr>0)
  const avgCtr=ctrVals.length?Math.round(ctrVals.reduce((s,a)=>s+a.ctr,0)/ctrVals.length*100)/100:0

  setKpi('d-spend','$'+totSpend,'var(--yellow)')
  setKpi('d-daily',totLeads,'#2ea043') // ЛИДЫ slot
  const cplC=avgCpl>0&&avgCpl<10?'var(--green)':avgCpl<=13?'var(--yellow)':avgCpl>0?'var(--red)':'var(--text)'
  setKpi('d-cpl','$'+avgCpl,cplC)
  const cqlC=avgCql>0&&avgCql<25?'var(--green)':avgCql<=35?'var(--yellow)':avgCql>0?'var(--red)':'var(--text)'
  setKpi('d-cql','$'+avgCql,cqlC)
  setKpi('d-roi',totQuals,'#4080ff') // КВАЛЫ slot
  setKpi('d-ctr',avgCtr+'%','#fff')

  // Clear comparison arrows (not relevant for buyer view)
  ;['d-spend','d-daily','d-cpl','d-cql','d-roi','d-ctr'].forEach(id=>{
    const p=document.getElementById(id+'-prev');if(p)p.textContent=''
    const a=document.getElementById(id+'-arr');if(a)a.textContent=''
  })

  // Build chart by date — CPL/CQL/CTR/Spend (from deduped set)
  const byDate={}
  dedup.forEach(a=>{
    const d=normDate(a.period_from||a.period_to)
    if(!d)return
    if(!byDate[d])byDate[d]={spend:0,leads:0,quals:0,ctrSum:0,ctrN:0}
    byDate[d].spend+=a.spend||0
    byDate[d].leads+=a.leads||0
    byDate[d].quals+=a.quals||0
    if(a.ctr>0){byDate[d].ctrSum+=a.ctr;byDate[d].ctrN++}
  })
  const chartRows=Object.entries(byDate).sort().map(([d,v])=>({
    day:d,
    cpl:v.leads>0?Math.round(v.spend/v.leads*100)/100:0,
    cql:v.quals>0?Math.round(v.spend/v.quals*100)/100:0,
    ctr:v.ctrN>0?Math.round(v.ctrSum/v.ctrN*100)/100:0,
    spend_pl:v.spend, spend_plua:0
  }))
  drawChart(chartRows)

  // Chart title
  const ctit=document.querySelector('#page-dash .card:last-child .ctit')
  if(ctit)ctit.textContent='Динамика · '+buyer
}

// Reset KPI labels back to general dashboard
function resetDashLabels(){
  const labels=['SPEND','SPEND DAILY','CPL','CQL','ROI','CTR AVG']
  const labs=document.querySelectorAll('#page-dash .krow .klab')
  labs.forEach((el,i)=>{if(labels[i])el.textContent=labels[i]})
  const ctit=document.querySelector('#page-dash .card:last-child .ctit')
  if(ctit)ctit.textContent='Динамика'
}
