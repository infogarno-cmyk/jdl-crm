// ── INIT ──
async function init(){
  setSS('syncing','Загрузка...')
  const today=new Date().toISOString().split('T')[0]
  ;['pd-from','pd-to','sp-from','sp-to'].forEach(id=>document.getElementById(id).value=today)
  try{db=supabase.createClient(SB_URL,SB_ANON)}catch(e){console.error(e)}
  await Promise.all([loadZ(),loadD(),loadT(),loadJ(),loadM(),loadSales(),loadTemplates(),loadCreoReports(),loadCreoLib()])
  rdash();setupRT();setSS('ok','Данные загружены')
}
function setSS(s,t){document.getElementById('sdot').className='sdot '+s;document.getElementById('stxt').textContent=t}
async function manualSync(){
  setSS('syncing','Синхронизация...')
  try{
    const r=await fetch(SB_URL+'/functions/v1/sync',{method:'POST',headers:{'Authorization':'Bearer '+SB_ANON,'Content-Type':'application/json'},body:'{}'})
    const d=await r.json()
    if(d.ok){await loadM();await loadSales();rdash();setSS('ok','Обновлено · '+d.days+' дней')}else setSS('','Ошибка')
  }catch(e){setSS('','Ошибка соединения')}
}
function setupRT(){
  if(!db)return
  db.channel('jdl-rt')
    .on('postgres_changes',{event:'*',schema:'public',table:'zalivs'},()=>loadZ().then(rzalivs))
    .on('postgres_changes',{event:'*',schema:'public',table:'tasks'},()=>{if(!_saveOrderTimer)loadT().then(rtasks)})
    .on('postgres_changes',{event:'*',schema:'public',table:'domains'},()=>loadD().then(rdomains))
    .on('postgres_changes',{event:'*',schema:'public',table:'journal_docs'},()=>loadJ().then(rtree))
    .on('postgres_changes',{event:'*',schema:'public',table:'metrics_daily'},()=>loadM().then(()=>{rdash();if(expZ){const el=document.getElementById('ex-metrics-'+expZ);if(el){const z=ZALIVS.find(x=>x.id===expZ);if(z)el.innerHTML=getZalivMetrics(z)}}}))
    .on('postgres_changes',{event:'*',schema:'public',table:'creo_reports'},()=>loadCreoReports().then(rcreo))
    .on('postgres_changes',{event:'*',schema:'public',table:'creo_library'},()=>loadCreoLib().then(renderCreoPage))
    .subscribe()
}

// ── LOAD ──
async function loadZ(){if(!db)return;const{data}=await db.from('zalivs').select('*').order('created_at',{ascending:false});ZALIVS=data||[]}
async function loadD(){if(!db)return;const{data}=await db.from('domains').select('*').order('created_at',{ascending:false});DOMAINS=data||[]}
async function loadT(){if(!db)return;const{data}=await db.from('tasks').select('*').order('sort_order',{ascending:true});TASKS=data||[]}
async function loadM(){
  if(!db)return;const{data}=await db.from('metrics_daily').select('*').order('day',{ascending:true});METRICS=data||[]
  if(METRICS.length>0){const l=METRICS[METRICS.length-1];const m=Math.round((Date.now()-new Date(l.synced_at))/60000);setSS('ok','Синк '+m+'м назад')}
}
async function loadJ(){
  if(!db)return
  const{data}=await db.from('journal_docs').select('*').order('sort_order',{ascending:true})
  const docs=data||[];jFolders=[];jLoose=[];const fm={}
  docs.forEach(d=>{if(d.folder_id){if(!fm[d.folder_id])fm[d.folder_id]={id:d.folder_id,name:d.folder_name,docs:[]};fm[d.folder_id].docs.push(d)}else jLoose.push(d)})
  jFolders=Object.values(fm)
  if(!curDoc&&docs.length>0)curDoc=docs[0].id
}
async function loadSales(){
  try{
    const r=await fetch(GARNO_URL+'/rest/v1/garnocrm?select=data&id=eq.1',{headers:{'apikey':GARNO_KEY,'Authorization':'Bearer '+GARNO_KEY}})
    if(!r.ok)return;const arr=await r.json()
    if(arr&&arr[0]&&arr[0].data&&arr[0].data.sales){
      SALES_DATA=arr[0].data.sales.filter(s=>{const src=(s.source||'').toLowerCase();return!src.includes('шоу')&&!src.includes('showroom')&&!src.includes('salon')&&!src.includes('show')})
    }
  }catch(e){console.log('Sales:',e)}
}
async function loadTemplates(){
  if(!db)return
  try{const{data,error}=await db.from('zaliv_templates').select('*').order('created_at',{ascending:false});if(!error)TEMPLATES=data||[];else TEMPLATES=JSON.parse(localStorage.getItem('jdl_templates')||'[]')}
  catch(e){TEMPLATES=JSON.parse(localStorage.getItem('jdl_templates')||'[]')}
}

function countUp(el,target,pre='',suf='',dur=800){
  const n=parseFloat(target);if(isNaN(n)){el.textContent=target;return}
  const start=Date.now();const timer=setInterval(()=>{
    const p=Math.min((Date.now()-start)/dur,1),e=1-Math.pow(1-p,3),cur=n*e
    el.textContent=pre+(Number.isInteger(n)?Math.round(cur):cur.toFixed(1))+suf
    if(p>=1){clearInterval(timer);el.textContent=pre+target+suf}
  },16)
}

function rdash(){
  const from=document.getElementById('pd-from').value,to=document.getElementById('pd-to').value
  const rows=METRICS.filter(m=>m.day>=from&&m.day<=to)
  let tS=0,tPL=0,tPLUA=0,tL=0,tQ=0,tSzl=0
  rows.forEach(r=>{tS+=parseFloat(r.spend_pl||0)+parseFloat(r.spend_plua||0);tPL+=parseFloat(r.spend_pl||0);tPLUA+=parseFloat(r.spend_plua||0);tL+=(r.leads_pl||0)+(r.leads_plua||0);tQ+=r.quals||0;tSzl+=parseFloat(r.sales_amount_zl||0)})
  const days=rows.length||1,cpl=tL>0?(tS/tL).toFixed(1):0,cql=tQ>0?(tS/tQ).toFixed(1):0
  const spD=(tS/days).toFixed(0),profit=tSzl*0.3*0.25,roi=tS>0?Math.round((profit-tS)/tS*100):0
  const avgCtr=rows.length>0?(rows.reduce((s,r)=>s+parseFloat(r.ctr||0),0)/rows.length).toFixed(2):0
  // ── COMPARISON PERIOD ──
  // Calculate previous period of same length
  const fromDate = new Date(from + 'T00:00:00')
  const toDate = new Date(to + 'T00:00:00')
  const periodDays = Math.max(1, Math.round((toDate - fromDate) / 86400000) + 1)
  const prevTo = new Date(fromDate - 86400000).toISOString().split('T')[0]
  const prevFrom = new Date(fromDate - periodDays * 86400000).toISOString().split('T')[0]
  const prevRows = METRICS.filter(m => m.day >= prevFrom && m.day <= prevTo)
  let pS=0, pL=0, pQ=0, pSzl=0
  prevRows.forEach(r=>{pS+=parseFloat(r.spend_pl||0)+parseFloat(r.spend_plua||0);pL+=(r.leads_pl||0)+(r.leads_plua||0);pQ+=r.quals||0;pSzl+=parseFloat(r.sales_amount_zl||0)})
  const pDays = prevRows.length || 1
  const pCpl = pL>0 ? pS/pL : 0
  const pCql = pQ>0 ? pS/pQ : 0
  const pSpD = pS/pDays
  const pProfit = pSzl*0.3*0.25
  const pRoi = pS>0 ? Math.round((pProfit-pS)/pS*100) : 0
  const pCtr = prevRows.length>0 ? prevRows.reduce((s,r)=>s+parseFloat(r.ctr||0),0)/prevRows.length : 0

  function setCompare(id, cur, prev, higherIsBetter) {
    const arrEl = document.getElementById(id+'-arr')
    const prevEl = document.getElementById(id+'-prev')
    if(!arrEl||!prevEl||!prev) return
    const diff = cur - prev
    const pct = prev !== 0 ? Math.round(Math.abs(diff)/Math.abs(prev)*100) : 0
    const isUp = diff > 0
    const isGood = higherIsBetter ? isUp : !isUp
    const flat = Math.abs(diff) < 0.01 * Math.abs(prev || 1)
    if(flat){arrEl.textContent='→';arrEl.className='karr flat'}
    else{
      arrEl.textContent = isUp ? '↑' : '↓'
      arrEl.className = 'karr ' + (isGood ? (isUp?'up-good':'dn-good') : (isUp?'up-bad':'dn-bad'))
    }
    prevEl.textContent = typeof prev === 'number' && prev > 0 ? (id.includes('roi')?prev+'%':'$'+Math.round(prev)) + (pct&&!flat?' ('+pct+'%)':'') : ''
  }

  countUp(document.getElementById('d-spend'),Math.round(tS),'$')
  countUp(document.getElementById('d-daily'),spD,'$')
  setCompare('d-spend', tS, pS, true)

  countUp(cplEl,cpl,'$')
  setCompare('d-cpl', parseFloat(cpl), pCpl, false)

  cqlEl.style.color=cqlN>0&&cqlN<25?'var(--green)':cqlN<=35?'var(--yellow)':cqlN>0?'var(--red)':'var(--text)'
  cqlEl.style.textShadow=cqlN>0&&cqlN<25?'0 0 12px rgba(46,160,67,.7)':cqlN<=35&&cqlN>0?'0 0 12px rgba(212,160,23,.7)':cqlN>0?'0 0 12px rgba(224,64,80,.6)':''
  countUp(cqlEl,cql,'$')

  const roiEl=document.getElementById('d-roi')
  roiEl.style.color=roi>=100?'var(--green)':roi>0?'var(--yellow)':roi<0?'var(--red)':'var(--text)'

  countUp(roiEl,roi,roi>0?'+':'','%')
  setCompare('d-roi', roi, pRoi, true)
  countUp(document.getElementById('d-ctr'),avgCtr,'','%')
  setCompare('d-ctr', parseFloat(avgCtr), pCtr, true)
  document.getElementById('d-zalivs').innerHTML=ZALIVS.slice(0,5).map(z=>`<div class="zrow"><div class="zdot" style="background:${z.ind==='profit'?'var(--green)':z.ind==='drop'?'var(--yellow)':'var(--red)'}"></div><span class="zgeo ${z.geo==='PL'?'gpl':'gplua'}">${z.geo}</span><div class="zname">${z.name}</div><div class="zbud">$${z.rk_budget}/d</div></div>`).join('')||'<div class="empty">Нет заливов</div>'
  const mx=Math.max(tPL,tPLUA,1)
  document.getElementById('d-geo').innerHTML=`<div class="brow"><div class="bhdr"><span class="zgeo gpl">PL</span><span style="font-weight:700;color:var(--yellow);font-family:var(--mono)">$${Math.round(tPL)}</span></div><div class="btrk"><div class="bfill" style="width:${Math.round(tPL/mx*100)}%;background:#4080ff"></div></div></div><div class="brow"><div class="bhdr"><span class="zgeo gplua">PLUA</span><span style="font-weight:700;color:var(--yellow);font-family:var(--mono)">$${Math.round(tPLUA)}</span></div><div class="btrk"><div class="bfill" style="width:${Math.round(tPLUA/mx*100)}%;background:#9060d0"></div></div></div>`

  const sf=SALES_DATA.filter(s=>{const d=parseDt(s.createdAt);if(!d)return false;const day=d.toISOString().split('T')[0];return day>=from&&day<=to})

function drawChart(rows){chartData=rows;const c=document.getElementById('dyn-chart');if(!c)return;c.width=c.parentElement.offsetWidth||600;c.height=130;renderChart(true)}
function renderChart(animate=false){
  if(!chartData||!chartData.length)return
  const rows=chartData,c=document.getElementById('dyn-chart'),ctx=c.getContext('2d')
  const W=c.width,H=c.height,P={t:10,b:22,l:10,r:10},cw=W-P.l-P.r,ch=H-P.t-P.b
  ctx.clearRect(0,0,W,H)
  const S=[{d:rows.map(r=>parseFloat(r.cpl)||0),c:'#4080ff',l:'CPL'},{d:rows.map(r=>parseFloat(r.cql)||0),c:'#d4a017',l:'CQL'},{d:rows.map(r=>parseFloat(r.ctr)||0),c:'#2ea043',l:'CTR'}]
  S.forEach(s=>{s.mn=Math.min(...s.d);s.mx=Math.max(...s.d);if(s.mx===s.mn)s.mx=s.mn+1})
  const n=rows.length,xs=n>1?cw/(n-1):0,px=i=>P.l+i*xs,py=(v,s)=>P.t+ch*(1-(v-s.mn)/(s.mx-s.mn))
  ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=1
  for(let i=0;i<=4;i++){const y=P.t+ch*i/4;ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cw,y);ctx.stroke()}
  S.forEach(s=>{
    ctx.save();ctx.beginPath();ctx.moveTo(px(0),H-P.b);ctx.lineTo(px(0),py(s.d[0],s))
    for(let i=1;i<n;i++){const x0=px(i-1),y0=py(s.d[i-1],s),x1=px(i),y1=py(s.d[i],s),cx=(x0+x1)/2;ctx.bezierCurveTo(cx,y0,cx,y1,x1,y1)}
    ctx.lineTo(px(n-1),H-P.b);ctx.closePath()
    const g=ctx.createLinearGradient(0,P.t,0,H-P.b);g.addColorStop(0,s.c+'33');g.addColorStop(1,s.c+'00');ctx.fillStyle=g;ctx.fill()
    ctx.beginPath();ctx.moveTo(px(0),py(s.d[0],s))
    for(let i=1;i<n;i++){const x0=px(i-1),y0=py(s.d[i-1],s),x1=px(i),y1=py(s.d[i],s),cx=(x0+x1)/2;ctx.bezierCurveTo(cx,y0,cx,y1,x1,y1)}
    ctx.strokeStyle=s.c;ctx.lineWidth=2;ctx.stroke()
    for(let i=0;i<n;i++){ctx.beginPath();ctx.arc(px(i),py(s.d[i],s),3,0,Math.PI*2);ctx.fillStyle=s.c;ctx.fill()}
    ctx.restore()
  })
  ctx.fillStyle='rgba(144,144,168,.6)';ctx.font='10px Manrope,sans-serif';ctx.textAlign='center'
  const li=[0,Math.floor((n-1)/2),n-1].filter((v,i,a)=>a.indexOf(v)===i)
  li.forEach(i=>ctx.fillText(rows[i]?.day?.slice(5)||'',px(i),H-4))
  c._S=S;c._rows=rows;c._P=P;c._cw=cw;c._ch=ch
  // Draw-in animation — smooth brush stroke per line using clip
  if(animate&&n>1){
    const FRAMES=120        // total frames for one line
    const STAGGER=50        // frames delay between lines
    const TOTAL=FRAMES + S.length*STAGGER
    let frame=0

    function animFrame(){
      frame++
      ctx.clearRect(0,0,W,H)

      // Grid lines
      ctx.save()
      ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=1
      for(let i=0;i<=4;i++){const y=P.t+ch*i/4;ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cw,y);ctx.stroke()}
      ctx.restore()

      S.forEach((s,si)=>{
        const lineStart=si*STAGGER
        const lf=frame-lineStart
        if(lf<=0)return

        // ease in-out cubic for ultra smooth motion
        const raw=Math.min(lf/FRAMES,1)
        const p=raw<0.5?4*raw*raw*raw:(raw-1)*(2*raw-2)*(2*raw-2)+1

        ctx.save()
        // Clip to left portion of chart as line "draws"
        const clipX=P.l+p*cw+4
        ctx.beginPath()
        ctx.rect(0,0,clipX,H)
        ctx.clip()

        // Gradient fill
        ctx.beginPath()
        ctx.moveTo(px(0),H-P.b)
        ctx.lineTo(px(0),py(s.d[0],s))
        for(let i=1;i<n;i++){
          const x0=px(i-1),y0=py(s.d[i-1],s),x1=px(i),y1=py(s.d[i],s),cxm=(x0+x1)/2
          ctx.bezierCurveTo(cxm,y0,cxm,y1,x1,y1)
        }
        ctx.lineTo(px(n-1),H-P.b)
        ctx.closePath()
        const g=ctx.createLinearGradient(0,P.t,0,H-P.b)
        g.addColorStop(0,s.c+'45')
        g.addColorStop(1,s.c+'00')
        ctx.fillStyle=g
        ctx.fill()

        // Line stroke with glow
        ctx.beginPath()
        ctx.moveTo(px(0),py(s.d[0],s))
        for(let i=1;i<n;i++){
          const x0=px(i-1),y0=py(s.d[i-1],s),x1=px(i),y1=py(s.d[i],s),cxm=(x0+x1)/2
          ctx.bezierCurveTo(cxm,y0,cxm,y1,x1,y1)
        }
        ctx.strokeStyle=s.c
        ctx.lineWidth=2
        ctx.shadowColor=s.c
        ctx.shadowBlur=8
        ctx.stroke()
        ctx.shadowBlur=0

        // Dots fade in as line passes them
        for(let i=0;i<n;i++){
          const dotX=px(i)
          if(dotX>clipX)continue
          const dotProgress=Math.min(1,(clipX-dotX)/20)
          ctx.beginPath()
          ctx.arc(dotX,py(s.d[i],s),2.5*dotProgress,0,Math.PI*2)
          ctx.fillStyle=s.c
          ctx.globalAlpha=dotProgress
          ctx.fill()
          ctx.globalAlpha=1
        }

        ctx.restore()
      })

      // X-axis labels
      ctx.fillStyle='rgba(144,144,168,.6)'
      ctx.font='10px Manrope,sans-serif'
      ctx.textAlign='center'
      li.forEach(i=>ctx.fillText(rows[i]?.day?.slice(5)||'',px(i),H-4))

      if(frame<TOTAL)requestAnimationFrame(animFrame)
    }
    requestAnimationFrame(animFrame)
  }
}
function chartMouseMove(e){
  const c=this;if(!c._rows)return
  const rect=c.getBoundingClientRect(),mx=(e.clientX-rect.left)*(c.width/rect.width)
  const n=c._rows.length,xs=n>1?c._cw/(n-1):0;let ci=0,md=9999
  for(let i=0;i<n;i++){const x=c._P.l+i*xs,d=Math.abs(mx-x);if(d<md){md=d;ci=i}}

}

  document.querySelectorAll('.spb[data-sc]').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();setScore(parseInt(btn.dataset.zid),parseInt(btn.dataset.sc))}))
  document.querySelectorAll('.ssel[data-zid]').forEach(sel=>{sel.addEventListener('click',e=>e.stopPropagation());sel.addEventListener('change',()=>setStatus(parseInt(sel.dataset.zid),sel))})
  document.querySelectorAll('.cadd[data-zid]').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();addCreoInline(parseInt(btn.dataset.zid))}))
  document.querySelectorAll('.ctag[data-creo]').forEach(tag=>tag.addEventListener('click',e=>{e.stopPropagation();openCreoGallery(parseInt(tag.dataset.zid),tag.dataset.creo)}))
  document.querySelectorAll('.sbsv[data-zid]').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();saveEdit(parseInt(btn.dataset.zid))}))
  document.querySelectorAll('.sbdl[data-zid]').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();delZaliv(parseInt(btn.dataset.zid))}))
  document.querySelectorAll('.spb-e[data-sc]').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();setScore(parseInt(btn.dataset.zid),parseInt(btn.dataset.sc))}))
  // Checkbox logic
  document.querySelectorAll('.zrow-check').forEach(cb=>{
    cb.addEventListener('change',updateBulkBar)
  })
  const checkAll=document.getElementById('zcheck-all')
  if(checkAll){
    checkAll.addEventListener('click',e=>{

      document.querySelectorAll('.zrow-check').forEach(cb=>{cb.checked=checked})

    })
  }
}

function getZalivMetrics(z){
  // Parse date from zaliv name e.g. D[09.06] or 09.06
  let dateStartISO=null
  const raw=z.date||''
  if(raw){
    const p=raw.split('.');
    if(p.length===2){
      const yr=new Date().getFullYear()
      dateStartISO=yr+'-'+p[1].padStart(2,'0')+'-'+p[0].padStart(2,'0')
    }
  }
  if(!dateStartISO&&z.created_at)dateStartISO=z.created_at.split('T')[0]
  const today=new Date().toISOString().split('T')[0]
  const rows=METRICS.filter(m=>(!dateStartISO||m.day>=dateStartISO)&&m.day<=today)
  if(!rows.length)return '<div style="font-size:11px;color:var(--text3)">Нет данных за период</div>'
  let spend=0,leads=0,quals=0
  rows.forEach(r=>{
    if(z.geo==='PL'){spend+=parseFloat(r.spend_pl||0);leads+=(r.leads_pl||0)}
    else if(z.geo==='PLUA'){spend+=parseFloat(r.spend_plua||0);leads+=(r.leads_plua||0)}
    else{spend+=parseFloat(r.spend_pl||0)+parseFloat(r.spend_plua||0);leads+=(r.leads_pl||0)+(r.leads_plua||0)}
    quals+=r.quals||0
  })
  spend=Math.round(spend*100)/100
  const cpl=leads>0?Math.round(spend/leads*100)/100:0
  const cql=quals>0?Math.round(spend/quals*100)/100:0
  const avgCtr=rows.length?Math.round(rows.reduce((s,r)=>s+parseFloat(r.ctr||0),0)/rows.length*100)/100:0
  const days=rows.length
  return `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">
    <div style="background:var(--bg5);border-radius:5px;padding:7px 9px;text-align:center">
      <div style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">SPEND</div>
      <div style="font-size:16px;font-weight:800;color:var(--yellow);font-family:var(--mono)">$${spend}</div>
      <div style="font-size:9px;color:var(--text3)">${days}д · $${Math.round(spend/days)}/д</div>
    </div>
    <div style="background:var(--bg5);border-radius:5px;padding:7px 9px;text-align:center">
      <div style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">CPL / CQL</div>
      <div style="font-size:16px;font-weight:800;color:${cpl>0&&cpl<10?'var(--green)':cpl<15?'var(--yellow)':'var(--red)'};font-family:var(--mono)">$${cpl}</div>
      <div style="font-size:9px;color:var(--text3)">CQL: $${cql}</div>
    </div>
    <div style="background:var(--bg5);border-radius:5px;padding:7px 9px;text-align:center">
      <div style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">LEADS / CTR</div>
      <div style="font-size:16px;font-weight:800;color:#fff;font-family:var(--mono)">${leads}</div>
      <div style="font-size:9px;color:var(--text3)">CTR: ${avgCtr}%</div>
    </div>
  </div>`
}

function togZ(id){expZ=(expZ===id?null:id);rzalivs()}
async function setInd(id,ind){await db.from('zalivs').update({ind,updated_at:new Date().toISOString()}).eq('id',id);const z=ZALIVS.find(x=>x.id===id);if(z)z.ind=ind;rzalivs()}
async function setScore(id,score){
  const z=ZALIVS.find(x=>x.id===id);if(!z)return
  const isLocked=AUTO_STATUS_LOCKED.includes(z.status)
  let newStatus=z.status;if(!isLocked)newStatus=scoreToAutoStatus(score)
  // Intercept OFF transition — предлагаем архивировать крео
  if(!isLocked&&newStatus==='OFF'&&z.status!=='OFF'&&(z.creos||[]).length>0){
    // Сначала сохраняем score, потом интерсептим
    await db.from('zalivs').update({score,updated_at:new Date().toISOString()}).eq('id',id)
    z.score=score
    if(interceptOFF(id))return // модал открыт, статус применится позже
  }
  await db.from('zalivs').update({score,status:newStatus,updated_at:new Date().toISOString()}).eq('id',id)
  const prev=z.status;z.score=score
  if(!isLocked&&newStatus!==prev){z.status=newStatus;toast(`Score ${score} → ${prev} → ${newStatus}`,'info')}
  rzalivs()
}
async function setStatus(id,sel){
  const z=ZALIVS.find(x=>x.id===id);if(!z)return
  // Intercept manual OFF
  if(sel.value==='OFF'&&z.status!=='OFF'&&(z.creos||[]).length>0){
    if(interceptOFF(id)){
      // Reset select visually until user confirms
      sel.value=z.status;sel.className='ssel '+(SCLS[z.status]||'')
      return
    }
  }
  z.status=sel.value;sel.className='ssel '+(SCLS[sel.value]||'')
  await db.from('zalivs').update({status:sel.value,updated_at:new Date().toISOString()}).eq('id',id)
}

function parseDt(ds){if(!ds)return null;if(ds.includes('-'))return new Date(ds);const p=ds.split('.');if(p.length===3)return new Date(p[2]+'-'+p[1]+'-'+p[0]);return null}
function rsales(){
  const from=document.getElementById('sp-from').value,to=document.getElementById('sp-to').value
  const f=SALES_DATA.filter(s=>{const d=parseDt(s.createdAt);if(!d)return false;const day=d.toISOString().split('T')[0];return day>=from&&day<=to})
  document.getElementById('sales-count').textContent='('+f.length+')'
  const total=f.reduce((s,r)=>s+(r.saleAmount||0),0),avg=f.length?Math.round(total/f.length):0
  document.getElementById('sales-kpi').innerHTML=`<div class="skc"><div class="sklb">Total Revenue</div><div class="skvl" id="sk-total">0 zł</div><div class="sksb">${f.length} продаж</div></div><div class="skc"><div class="sklb">Avg Deal</div><div class="skvl" id="sk-avg">0 zł</div><div class="sksb">средний чек</div></div><div class="skc"><div class="sklb">Кол-во продаж</div><div class="skvl" id="sk-cnt">0</div><div class="sksb">за период</div></div>`

let _saveOrderTimer=null
function saveTaskOrder(){
  // Debounce — wait 300ms after last drag before saving
  clearTimeout(_saveOrderTimer)
  _saveOrderTimer=setTimeout(async()=>{
    // Update sort_order for all tasks in current order
    const updates=TASKS.map((t,i)=>({id:t.id,sort_order:i*10}))
    // Single upsert instead of N updates
    for(const u of updates){
      if(TASKS.find(t=>t.id===u.id)?.sort_order!==u.sort_order){
        await db.from('tasks').update({sort_order:u.sort_order,col:TASKS.find(t=>t.id===u.id)?.col}).eq('id',u.id)
      }
    }
  },300)
}

function launchConfetti(){
  const canvas=document.getElementById('confetti-canvas')
  canvas.style.display='block'
  canvas.width=window.innerWidth;canvas.height=window.innerHeight
  const ctx=canvas.getContext('2d')
  const pieces=Array.from({length:150},()=>({
    x:Math.random()*canvas.width,y:Math.random()*canvas.height-canvas.height,
    r:Math.random()*6+4,c:`hsl(${Math.random()*360},90%,60%)`,
    vx:(Math.random()-0.5)*4,vy:Math.random()*4+2,
    rot:Math.random()*360,vr:(Math.random()-0.5)*8
  }))
  let frame=0
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height)
    pieces.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.vy+=0.08
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180)
      ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r)
      ctx.restore()
    })
    frame++
    if(frame<180)requestAnimationFrame(draw)
    else{ctx.clearRect(0,0,canvas.width,canvas.height);canvas.style.display='none'}
  }
  draw()
}

// ── DRAG & DROP v7 — чёткие зоны, сохранение порядка ──
let dragOverEl=null,dragOverPos=null

document.addEventListener('dragstart',e=>{
  const tc=e.target.closest('.tcard[data-id]');if(!tc)return
  dragId=parseInt(tc.dataset.id)
  e.dataTransfer.effectAllowed='move'
  e.dataTransfer.setData('text/plain',String(dragId))
  setTimeout(()=>tc.classList.add('dragging'),0)
})

document.addEventListener('dragend',()=>{
  document.querySelectorAll('.tcard.dragging,.tcard.drag-over-top,.tcard.drag-over-bot').forEach(t=>t.classList.remove('dragging','drag-over-top','drag-over-bot'))
  document.querySelectorAll('.kcol.dov').forEach(c=>c.classList.remove('dov'))
  dragId=null;dragOverEl=null;dragOverPos=null
})

document.addEventListener('dragover',e=>{
  e.preventDefault();e.dataTransfer.dropEffect='move'
  document.querySelectorAll('.tcard.drag-over-top,.tcard.drag-over-bot').forEach(t=>t.classList.remove('drag-over-top','drag-over-bot'))
  document.querySelectorAll('.kcol.dov').forEach(c=>c.classList.remove('dov'))
  const tc=e.target.closest('.tcard[data-id]')
  if(tc&&dragId&&parseInt(tc.dataset.id)!==dragId){
    const rect=tc.getBoundingClientRect()
    // Зона захвата — верхние 50% = вставить до, нижние 50% = вставить после
    dragOverPos=e.clientY<rect.top+rect.height*0.5?'top':'bot'
    dragOverEl=parseInt(tc.dataset.id)
    tc.classList.add(dragOverPos==='top'?'drag-over-top':'drag-over-bot')
  }else{
    dragOverEl=null;dragOverPos=null
    const col=e.target.closest('.kcol');if(col)col.classList.add('dov')
  }
})

document.addEventListener('drop',e=>{
  e.preventDefault()
  document.querySelectorAll('.tcard.drag-over-top,.tcard.drag-over-bot').forEach(t=>t.classList.remove('drag-over-top','drag-over-bot'))
  document.querySelectorAll('.kcol.dov').forEach(c=>c.classList.remove('dov'))
  if(!dragId)return

  const dragTask=TASKS.find(t=>t.id===dragId);if(!dragTask)return

  if(dragOverEl){
    const targetTask=TASKS.find(t=>t.id===dragOverEl);if(!targetTask)return
    const newCol=targetTask.col
    dragTask.col=newCol
    TASKS.splice(TASKS.indexOf(dragTask),1)
    const tIdx=TASKS.indexOf(targetTask)
    TASKS.splice(dragOverPos==='top'?tIdx:tIdx+1,0,dragTask)
    // Update col + sort_order for all affected tasks
    db.from('tasks').update({col:newCol,updated_at:new Date().toISOString()}).eq('id',dragId)
  }else{
    const col=e.target.closest('.kcol')
    if(col){
      const newCol=col.id.replace('kc-','')
      if(dragTask.col!==newCol){
        dragTask.col=newCol
        db.from('tasks').update({col:newCol,updated_at:new Date().toISOString()}).eq('id',dragId)
      }
    }
  }

  // Save sort_order to Supabase
  saveTaskOrder()
  rtasks()
  dragId=null;dragOverEl=null;dragOverPos=null
})

// Инлайн создание без prompt()
function showInlineNew(afterEl,onConfirm,placeholder='Название...'){
  document.querySelectorAll('.j-new-inline').forEach(el=>el.remove())
  const wrap=document.createElement('div');wrap.className='j-new-inline'
  const inp=document.createElement('input');inp.className='j-new-inp';inp.placeholder=placeholder
  const ok=document.createElement('button');ok.className='j-new-ok';ok.textContent='✓'
  const x=document.createElement('button');x.className='j-new-x';x.textContent='✕'
  const confirm=()=>{const v=inp.value.trim();if(v)onConfirm(v);wrap.remove()}
  const cancel=()=>wrap.remove()
  ok.addEventListener('click',confirm);x.addEventListener('click',cancel)
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')confirm();if(e.key==='Escape')cancel()})
  wrap.appendChild(inp);wrap.appendChild(ok);wrap.appendChild(x)
  const tree=document.getElementById('j-tree')
  if(afterEl)afterEl.after(wrap);else tree.appendChild(wrap)
  inp.focus()
}

function loadDocById(id){

    if(d.body&&(d.body.trim().startsWith('<')||d.body.trim()===''))ed.innerHTML=d.body||''
    else ed.innerHTML=d.body?mdToHtml(d.body):''
  }
  rtree()

function mdToHtml(md){
  return md
    .replace(/^# (.+)$/gm,'<h1>$1</h1>')
    .replace(/^## (.+)$/gm,'<h2>$1</h2>')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`(.+?)`/g,'<code>$1</code>')
    .replace(/^---$/gm,'<hr>')
    .replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>')
    .replace(/^- (.+)$/gm,'<li>$1</li>')
    .replace(/(<li>.*<\/li>\n?)+/g,s=>`<ul>${s}</ul>`)
    .replace(/(\|[^\n]+\|\n?)+/g,t=>{
      const rows=t.trim().split('\n');if(rows.length<2)return t
      const head=rows[0].split('|').filter(c=>c.trim()).map(c=>`<th>${c.trim()}</th>`).join('')
      const body=rows.slice(2).map(r=>'<tr>'+r.split('|').filter(c=>c.trim()).map(c=>`<td>${c.trim()}</td>`).join('')+'</tr>').join('')
      return`<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`
    })
    .replace(/\n/g,'<br>')
}

async function importCampaignsFromMeta(){
  if(!db)return
  setSS('syncing','Импорт РК из Meta...')
  try{
    // Получаем уже импортированные кампании
    const{data:imported}=await db.from('imported_campaigns').select('campaign_id')
    const importedIds=new Set((imported||[]).map(x=>x.campaign_id))

    // Читаем кампании напрямую из FB API
    // Токен берём из Edge Function через специальный endpoint
    const r=await fetch(SB_URL+'/functions/v1/get-campaigns',{
      method:'POST',
      headers:{'Authorization':'Bearer '+SB_ANON,'Content-Type':'application/json'},
      body:'{}'
    })
    if(!r.ok){
      // Edge Function не задеплоена — показываем инструкцию
      toast('Нужно задеплоить get-campaigns функцию. Пока добавь РК вручную.','info')
      setSS('ok','—')
      return
    }
    const d=await r.json()
    if(!d.campaigns||!d.campaigns.length){setSS('ok','Нет новых РК');toast('Нет новых кампаний в Meta','info');return}

    let added=0
    for(const camp of d.campaigns){
      if(importedIds.has(String(camp.id)))continue
      const buyer=camp.name.trim()[0]==='I'?'Illia':'Danya'
      const geo=parseGeoFromName(camp.name)
      const funnel=parseFunnelFromName(camp.name)
      const date=parseDateFromCampName(camp.name)
      const{data:zData,error}=await db.from('zalivs').insert({
        geo,name:camp.name,
        ad_budget:parseFloat(camp.daily_budget||0)/100||0,
        rk_budget:parseFloat(camp.daily_budget||0)/100||0,
        domain:'',creos:[],goals:[],
        ind:'profit',status:'Check',insights:'',
        buyer,funnel,score:3,
        date:date||new Date().toLocaleDateString('ru',{day:'2-digit',month:'2-digit'})
      }).select().single()
      if(!error&&zData){
        ZALIVS.unshift(zData)
        await db.from('imported_campaigns').insert({campaign_id:String(camp.id),zaliv_id:zData.id})
        added++
      }
    }
    setSS('ok',added>0?`Импортировано ${added} РК`:'Нет новых РК')
    if(added>0){toast(`Импортировано ${added} новых РК из Meta`,'ok');rzalivs()}
    else toast('Все кампании уже импортированы','info')
  }catch(e){
    setSS('','Ошибка импорта')
    toast('Нужно задеплоить функцию get-campaigns в Supabase','err')
    console.log('Import error:',e)
  }
}

function parseGeoFromName(name){
  const n=name.toUpperCase()
  const brIdx=n.indexOf('}')
  if(brIdx>=0){
    const after=n.substring(brIdx+1,brIdx+6)
    if(after.startsWith('PLUA'))return'PLUA'
    if(after.startsWith('UA'))return'PLUA'
    if(after.startsWith('PL'))return'PL'
  }
  if(n.includes('UA'))return'PLUA'
  return'PL'
}

function parseFunnelFromName(name){
  const n=name.toLowerCase()
  if(n.includes('kalk')||n.includes('калькул'))return'Калькулятор'
  if(n.includes('vizit')||n.includes('визит'))return'Визита'
  if(n.includes('proj')||n.includes('проект'))return'Проект'
  if(n.includes('lead')||n.includes('лид'))return'Лид-магнит'
  return'Калькулятор'
}

function parseDateFromCampName(name){
  // D[09.06] or D{09.06} → 09.06
  const m=name.match(/[DId\[{](\d{2}[.,]\d{2})/)
  if(m)return m[1].replace(',','.')
  return null
}

function openCreoAddModal(z){
  // Считаем реальные метрики из METRICS за период открута залива
  // Дата старта из названия или created_at залива
  let dateStartRaw=z.date||null
  // Парсим дату из формата DD.MM
  let dateStartISO=null
  if(dateStartRaw){
    const p=dateStartRaw.split('.')
    if(p.length===2){
      const yr=new Date().getFullYear()
      dateStartISO=`${yr}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`
    }
  }
  if(!dateStartISO&&z.created_at)dateStartISO=z.created_at.split('T')[0]
  const dateEnd=new Date().toISOString().split('T')[0]
  // Считаем суммарный spend из metrics_daily за период
  const metrics=METRICS.filter(m=>(!dateStartISO||m.day>=dateStartISO)&&m.day<=dateEnd)
  // Для geo PL берём spend_pl, для PLUA берём spend_plua
  let spend=0
  let totalLeads=0,totalQuals=0,avgCtr=0
  if(metrics.length){
    if(z.geo==='PL'){spend=metrics.reduce((s,m)=>s+parseFloat(m.spend_pl||0),0);totalLeads=metrics.reduce((s,m)=>s+(m.leads_pl||0),0)}
    else if(z.geo==='PLUA'){spend=metrics.reduce((s,m)=>s+parseFloat(m.spend_plua||0),0);totalLeads=metrics.reduce((s,m)=>s+(m.leads_plua||0),0)}
    else{spend=metrics.reduce((s,m)=>s+parseFloat(m.spend_pl||0)+parseFloat(m.spend_plua||0),0);totalLeads=metrics.reduce((s,m)=>s+(m.leads_pl||0)+(m.leads_plua||0),0)}
    totalQuals=metrics.reduce((s,m)=>s+(m.quals||0),0)
    avgCtr=metrics.length?Math.round(metrics.reduce((s,m)=>s+parseFloat(m.ctr||0),0)/metrics.length*100)/100:0

  const autoCpl=totalLeads>0?Math.round(spend/totalLeads*100)/100:0

        <span style="font-size:11px;color:var(--text3)">CQL: <strong style="color:var(--purple);font-family:var(--mono)">${autoCql>0?'$'+autoCql:'—'}</strong></span>

function renderCreoTable(){
  const geo=document.getElementById('clf-geo')?.value||''
  const status=document.getElementById('clf-status')?.value||''
  const funnel=document.getElementById('clf-funnel')?.value||''
  const q=document.getElementById('clf-q')?.value?.toLowerCase()||''

  const buyer=document.getElementById('clf-buyer')?.value||''
  let f=CREO_LIB.filter(cr=>
    (!geo||cr.geo===geo)&&
    (!status||cr.status===status)&&
    (!funnel||cr.funnel===funnel)&&
    (!buyer||cr.buyer===buyer)&&
    (!q||cr.name?.toLowerCase().includes(q)||cr.notes?.toLowerCase().includes(q))
  )

  const cnt=document.getElementById('creo-lib-count')
  if(cnt)cnt.textContent='('+f.length+')'

  // Stats strip
  const statsEl=document.getElementById('clf-stats')
  if(statsEl){
    const ready=CREO_LIB.filter(x=>x.status==='ready').length
    const used=CREO_LIB.filter(x=>x.status==='used').length
    const hall=CREO_LIB.filter(x=>x.status==='hall').length
    statsEl.innerHTML=`
      <span style="background:rgba(64,128,255,.12);border:1px solid rgba(64,128,255,.25);color:var(--blue);border-radius:20px;padding:3px 12px;font-size:11px;font-weight:700">🎯 ${ready} ждут</span>
      <span style="background:rgba(212,160,23,.12);border:1px solid rgba(212,160,23,.25);color:var(--yellow);border-radius:20px;padding:3px 12px;font-size:11px;font-weight:700">⚡ ${used} в работе</span>
      <span style="background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.25);color:#ffd700;border-radius:20px;padding:3px 12px;font-size:11px;font-weight:700">🏆 ${hall} в зале</span>
    `
  }

  const tbody=document.getElementById('clf-tbody')
  if(!tbody)return

  if(!f.length){
    tbody.innerHTML=`<tr><td colspan="11" class="empty">Нет крео — добавь первый</td></tr>`
    return
  }

  tbody.innerHTML=f.map(cr=>{
    const statusColor=cr.status==='hall'?'#ffd700':cr.status==='used'?'var(--yellow)':'var(--blue)'
    const statusLabel=cr.status==='hall'?'🏆 MWP':cr.status==='used'?'⚡ Use':'✨ Clean'
    const geoClass=cr.geo==='PL'?'gpl':'gplua'
    const ctrColor=cr.avg_ctr>2?'var(--green)':cr.avg_ctr>1?'var(--yellow)':cr.avg_ctr>0?'var(--red)':'var(--text3)'
    const cplColor=cr.avg_cpl>0&&cr.avg_cpl<10?'var(--green)':cr.avg_cpl<15?'var(--yellow)':cr.avg_cpl>0?'var(--red)':'var(--text3)'
    return`<tr style="cursor:pointer" data-clf-id="${cr.id}">
      <td>
        ${cr.screenshot_url
          ?`<img class="clf-thumb" src="${cr.screenshot_url}" onclick="event.stopPropagation();window.open('${cr.screenshot_url}','_blank')">`
          :`<div class="clf-thumb-placeholder">${cr.status==='hall'?'🏆':cr.status==='used'?'📊':'🎨'}</div>`
        }
      </td>
      <td>
        <div style="font-weight:700;color:#fff;font-size:12px">${cr.name}</div>
        ${cr.notes?`<div style="font-size:10px;color:var(--text3);margin-top:2px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${cr.notes}</div>`:''}
      </td>
      <td><span class="zgeo gchip ${geoClass}">${cr.geo}</span></td>
      <td><span class="fchip">${cr.funnel||'—'}</span></td>
      <td><span style="font-size:10px;font-weight:700;color:${statusColor}">${statusLabel}</span></td>
      <td style="font-family:var(--mono);font-weight:700;color:${ctrColor}">${cr.avg_ctr?cr.avg_ctr+'%':'—'}</td>
      <td style="font-family:var(--mono);font-weight:700;color:${cplColor}">${cr.avg_cpl?'$'+cr.avg_cpl:'—'}</td>
      <td style="font-family:var(--mono);color:var(--text2)">${cr.avg_cql?'$'+cr.avg_cql:'—'}</td>
      <td style="font-family:var(--mono);color:var(--text3)">${cr.launches||0}</td>
      <td><span class="tma">${cr.buyer||'—'}</span></td>
      <td onclick="event.stopPropagation()">
        <div style="display:flex;gap:4px">
          <button class="spb clf-edit-btn" style="width:auto;padding:0 7px;font-size:10px" data-clf-edit="${cr.id}">✏️</button>
          ${cr.status!=='hall'?`<button class="spb s5 clf-hall-btn" style="width:auto;padding:0 7px;font-size:10px" data-clf-hall="${cr.id}">🏆</button>`:''}
          <button class="spb s0 clf-del-btn" style="width:auto;padding:0 7px;font-size:10px" data-clf-del="${cr.id}">✕</button>
        </div>
      </td>
    </tr>`
  }).join('')
}

async function saveCreoLib(){
  const name=document.getElementById('cl-name').value.trim()
  if(!name){toast('Введи название','err');return}
  const geo=document.getElementById('cl-geo').value
  const funnel=document.getElementById('cl-funnel').value
  const buyer=document.getElementById('cl-buyer').value
  const status=document.getElementById('cl-status').value
  const notes=document.getElementById('cl-notes').value
  const hall_geo=status==='hall'?geo:null

  let screenshot_url=clEditId?CREO_LIB.find(x=>x.id===clEditId)?.screenshot_url:null
  const fileInp=document.getElementById('cl-img-inp')
  const fileInp2=document.getElementById('cl-img-inp')
  const uploadFile=fileInp2?.files?.[0]||_pastedImageFile
  if(uploadFile){
    const path=`creolib_${Date.now()}.png`
    const{error:upErr}=await db.storage.from('creo-screenshots').upload(path,uploadFile,{upsert:true,contentType:uploadFile.type||'image/png'})
    if(upErr){console.error('Upload error:',upErr);toast('Ошибка загрузки скрина: '+upErr.message,'err')}
    else{const{data:ud}=db.storage.from('creo-screenshots').getPublicUrl(path);screenshot_url=ud.publicUrl}
    _pastedImageFile=null
  }

  const payload={name,geo,funnel,buyer,status,notes,screenshot_url,hall_geo}

  if(clEditId){
    const{error}=await db.from('creo_library').update(payload).eq('id',clEditId)
    if(!error){const cr=CREO_LIB.find(x=>x.id===clEditId);if(cr)Object.assign(cr,payload);toast('Обновлено','ok')}
    else{toast('Ошибка: '+error.message,'err');return}
  }else{
    const{data,error}=await db.from('creo_library').insert(payload).select().single()
    if(!error&&data){CREO_LIB.unshift(data);toast('Крео добавлено','ok')}
    else{toast('Ошибка: '+(error?.message||'unknown'),'err');return}
  }
  document.getElementById('mo-creo-lib').classList.remove('open')
  renderCreoTable()
}

// Auto-update creo status when added to zaliv
// Called from openCreoAddModal after archiving
async function markCreosAsUsed(creoNames, stats){
  // creoNames: array of creo ids/names, stats: {ctr, cpl, cql} averages
  for(const name of creoNames){
    const cr=CREO_LIB.find(x=>x.name===name||x.name===name.trim())
    if(!cr)continue
    const launches=(cr.launches||0)+1
    const newCtr=stats.ctr||cr.avg_ctr||0
    const newCpl=stats.cpl||cr.avg_cpl||0
    const newCql=stats.cql||cr.avg_cql||0
    const upd={status:'used',launches,avg_ctr:newCtr,avg_cpl:newCpl,avg_cql:newCql}
    await db.from('creo_library').update(upd).eq('id',cr.id)
    Object.assign(cr,upd)
  }
  renderCreoTable()
}

// Ctrl+V paste from clipboard - store file directly
document.addEventListener('paste',e=>{
  const mo=document.getElementById('mo-creo-lib')
  if(!mo?.classList.contains('open'))return
  const items=[...e.clipboardData.items]
  const imgItem=items.find(item=>item.type.startsWith('image/'))
  if(!imgItem)return
  e.preventDefault()
  const file=imgItem.getAsFile()
  if(!file)return
  _pastedImageFile=file  // store for upload
  const r=new FileReader()
  r.onload=ev=>{
    document.getElementById('cl-img-preview').innerHTML=`<img src="${ev.target.result}" style="max-height:80px;border-radius:6px;display:block;margin:0 auto">`
    const drop=document.getElementById('cl-img-drop')
    if(drop){drop.style.borderColor='var(--green)';setTimeout(()=>drop.style.borderColor='',1500)}
    toast('Скрин вставлен ✓ — теперь нажми Сохранить','ok')
  }
  r.readAsDataURL(file)
})

    const dlId='creo-dl-'+i
    const dl=document.createElement('datalist');dl.id=dlId
    libCreos.forEach(cr=>{const o=document.createElement('option');o.value=cr.name;dl.appendChild(o)})
    document.body.appendChild(dl)
    inp.setAttribute('list',dlId)
  })
}

// Hook into archiving — mark creos as used with stats
// creoAddSave is overridden here to add markCreosAsUsed
function creoAddSave(){
  // Before saving, collect creo names and stats to mark as used
  const creosRaw=document.getElementById('ca-creos')?.value||''
  const creos=creosRaw?creosRaw.split(',').map(s=>s.trim()).filter(Boolean):[]
  if(!creos.length){toast('Нет крео для сохранения','err');return}

  const zalivId=parseInt(document.getElementById('ca-zaliv-id').value)
  const spend=parseFloat(document.getElementById('ca-spend').value)||0
  const rows=creos.map((cr,i)=>({
    zaliv_id:zalivId,creo_id:cr,
    geo:document.getElementById('ca-geo').value,
    creator:document.getElementById('ca-creator').value,
    funnel:document.getElementById('ca-funnel').value,
    date_start:document.getElementById('ca-date-start').value,
    date_end:document.getElementById('ca-date-end').value,
    spend:Math.round(spend/Math.max(creos.length,1)*100)/100,
    ctr:parseFloat(document.getElementById('ca-ctr-'+i)?.value)||0,
    cr:parseFloat(document.getElementById('ca-cr-'+i)?.value)||0,
    cpl:parseFloat(document.getElementById('ca-cpl-'+i)?.value)||0,
    cql:parseFloat(document.getElementById('ca-cql-'+i)?.value)||0,
    notes:document.getElementById('ca-notes-'+i)?.value||''
  }))

  db.from('creo_reports').insert(rows).then(({error})=>{
    if(!error){
      toast(rows.length+' крео добавлено в отчёт','ok')
      document.getElementById('mo-creo-add').classList.remove('open')
      loadCreoReports()
      applyOFFStatus(zalivId)
      // Mark creos as used in library
      const avgStats={
        ctr:Math.round(rows.reduce((s,r)=>s+(r.ctr||0),0)/rows.length*100)/100,
        cpl:Math.round(rows.reduce((s,r)=>s+(r.cpl||0),0)/rows.length*100)/100,
        cql:Math.round(rows.reduce((s,r)=>s+(r.cql||0),0)/rows.length*100)/100
      }
      markCreosAsUsed(creos,avgStats)
    }else{
      toast('Ошибка: '+error.message,'err')
    }
  })
}

document.head.insertAdjacentHTML('beforeend','<style>@keyframes cardIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}</style>')

// ── AUTO LOGIN ──

if(_saved&&USERS[_saved])doLogin(_saved)
