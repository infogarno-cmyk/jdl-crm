function applyAnPreset(preset){
  const zid=parseInt(document.getElementById('an-zaliv-sel')?.value)
  const z=ZALIVS.find(x=>x.id===zid)
  const raw=z?.date||''
  let start=new Date()
  if(raw){const p=raw.split('.');if(p.length===2){const yr=new Date().getFullYear();start=new Date(`${yr}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`)}}
  const fmt=d=>d.toISOString().split('T')[0]
  const add=n=>new Date(start.getTime()+n*864e5)
  const nk=preset.match(/^(\d)k$/);const map={'1dc':[fmt(start),fmt(start)],'2dc':[fmt(add(1)),fmt(add(1))],'3dc':[fmt(start),fmt(add(1))],'kwartal':[fmt(start),fmt(add(1))]};if(nk){const n=+nk[1];map[preset]=[fmt(add((n-1)*2)),fmt(add((n-1)*2+1))]}
  const [f,t]=map[preset]||[fmt(start),fmt(start)]
  document.getElementById('an-from').value=f
  document.getElementById('an-to').value=t
}

async function generateAnalysis(){
  const zalivId=parseInt(document.getElementById('an-zaliv-sel')?.value)
  if(!zalivId){toast('Выбери залив','err');return}
  const z=ZALIVS.find(x=>x.id===zalivId)
  if(!z)return
  const from=document.getElementById('an-from').value
  const to=document.getElementById('an-to').value
  if(!from||!to){toast('Укажи период','err');return}
  const wrap=document.getElementById('an-results-wrap')
  if(!wrap)return
  wrap.innerHTML='<div class="empty" style="padding:16px">⏳ Загрузка из Meta...</div>'

  if(!z.campaign_id){
    wrap.innerHTML='<div class="empty" style="padding:16px;color:#e08040">⚠ Нет Campaign ID — введи в редактировании залива</div>'
    return
  }

  // Fetch adsets first
  var adsets=[],adsetErr=''
  try{
    const r=await fetch(SB_URL+'/functions/v1/get-campaigns',{
      method:'POST',headers:{'Authorization':'Bearer '+SB_ANON,'Content-Type':'application/json'},
      body:JSON.stringify({action:'get_adsets',campaign_id:z.campaign_id,region:(typeof zRegion==='function'?zRegion(z):CURRENT_REGION)})
    })
    const d=await r.json()
    if(d.ok)adsets=d.adsets||[]
    // раньше ошибка тут проглатывалась, и анализ молча рисовал «Адсеты (0)»
    else{adsetErr=d.error||('HTTP '+r.status);console.warn('Анализ: адсеты не загрузились —',adsetErr,'| campaign_id',z.campaign_id)}
  }catch(e){adsetErr=e.message;console.error('Анализ: адсеты не загрузились —',e)}

  // Show adset selector + load all insights in parallel
  wrap.innerHTML=`<div style="margin-bottom:10px">
    <div class="elb" style="margin-bottom:5px">Адсеты (${adsets.length})${adsetErr?` <span style="color:var(--red);font-weight:500">· не загрузились: ${String(adsetErr).slice(0,120)}</span>`:''}</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
      <button class="pb active" onclick="selectAdsetView('all',${zalivId},'${from}','${to}')" data-adset="all">Все / кампания</button>
      ${adsets.map(a=>`<button class="pb" onclick="selectAdsetView('${a.id}',${zalivId},'${from}','${to}')" data-adset="${a.id}" title="${a.name}">${a.name.slice(0,25)}${a.name.length>25?'...':''}</button>`).join('')}
    </div>
    <div id="an-adset-result"></div>
  </div>`

  // Auto-load campaign-level
  await loadAdsetResult('all',z,from,to,adsets)
}

async function selectAdsetView(adsetId,zalivId,from,to){
  document.querySelectorAll('[data-adset]').forEach(b=>{

  })

  const adsets=[...document.querySelectorAll('[data-adset]:not([data-adset="all"])')]
    .map(b=>({id:b.dataset.adset,name:b.title||b.textContent}))
  await loadAdsetResult(adsetId,z,from,to,adsets)
}

async function loadAdsetResult(adsetId,z,from,to,adsets){

        body:JSON.stringify({action:'get_campaign_insights',campaign_id:z.campaign_id,since:from,until:to,region:CURRENT_REGION})
      })
      const d=await r.json();if(d.ok)meta=d
    }catch(e){}

      const r2=await fetch(SB_URL+'/functions/v1/get-campaigns',{
        method:'POST',headers:{'Authorization':'Bearer '+SB_ANON,'Content-Type':'application/json'},
        body:JSON.stringify({action:'get_campaign_video',campaign_id:z.campaign_id,since:from,until:to,region:CURRENT_REGION})
      })

  }

  const autoSrc=srcStats(z.id,adsetId==='all'?null:adsetId,from,to)
  const spend=meta?meta.spend:0
  const clicks=meta?meta.clicks:0
  const reach=meta?(meta.reach||meta.impressions||0):0
  const ctr=meta?meta.ctr:0
  const cpc=meta?meta.cpc:0

    </div>
    <input class="an-editable" id="${id}" type="number" step="0.01" value="${val}" oninput="recalcAnalysis()" style="width:80px;color:${col||'#fff'}">
  </div>`
  // Calculated cell (not editable)
  const ccell=(label,id,hint)=>`<div style="padding:6px 9px;border-bottom:1px solid var(--border)">
    <div style="font-size:9px;color:var(--text3);margin-bottom:3px">${label} <span style="font-size:8px;opacity:.5">${hint||''}</span></div>
    <div id="${id}" style="font-size:12px;font-weight:700;font-family:var(--mono);color:#fff">—</div>
  </div>`

  res.innerHTML=`
    <div class="an-card">
      <div style="background:var(--bg3);padding:7px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
        <div style="display:flex;align-items:center;gap:8px">
          <span class="zgeo gchip ${geoClass(z.geo)}" style="font-size:9px">${z.geo}</span>
          <span style="font-size:11px;font-weight:700;color:#fff">${adsetName}</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-size:9px;color:var(--text3)">Spend</span>
          <input class="an-editable" id="an-i-spend" type="number" step="0.01" value="${spend}" oninput="recalcAnalysis()" style="width:80px;color:#e08040">
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr">
        ${ecell('Охват','an-i-reach',reach,true)}
        ${ecell('Клики','an-i-clicks',clicks,true)}

        ${ecell('AmFreq (ввод)','an-i-amfreq',0,false)}

        ${ecell('CPM $','an-i-cpm',cpm,true)}
        ${ecell('Ср.вр (с)','an-i-viewtime',avgView,true)}

      </div>
    </div>`
  setTimeout(recalcAnalysis,0)
}


function recalcAnalysis(){
  const v=id=>parseFloat(document.getElementById(id)?.value)||0
  const spend=v('an-i-spend')
  const clicks=v('an-i-clicks')
  const leads=v('an-i-leads')
  const quals=v('an-i-quals')
  const cr=clicks>0?Math.round(leads/clicks*10000)/100:0
  const cpl=leads>0?Math.round(spend/leads*100)/100:0
  const ar=leads>0?Math.round(quals/leads*10000)/100:0
  const cql=quals>0?Math.round(spend/quals*100)/100:0
  const cplC=cpl>0&&cpl<10?'#2ea043':cpl<15?'#e08040':cpl>0?'#e04050':'#fff'
  const el=id=>document.getElementById(id)
  if(el('an-v-cr'))el('an-v-cr').textContent=cr+'%'
  if(el('an-v-cpl')){el('an-v-cpl').textContent=cpl>0?'$'+cpl:'—';el('an-v-cpl').style.color=cplC}
  if(el('an-v-ar'))el('an-v-ar').textContent=ar+'%'
  if(el('an-v-cql'))el('an-v-cql').textContent=cql>0?'$'+cql:'—'
}

async function saveCurrentAnalysis(zid,spendArg,clicksArg,reachArg,ctrArg,cpcArg,cpmArg,freqArg,avgViewArg,buyer,geo,funnel,from,to,adsetId,adsetName){
  const z=ZALIVS.find(x=>x.id===zid)
  const vv=id=>parseFloat(document.getElementById(id)?.value)||0
  const spend=vv('an-i-spend')||spendArg
  const clicks=vv('an-i-clicks')||clicksArg
  const reach=vv('an-i-reach')||reachArg
  const ctr=vv('an-i-ctr')||ctrArg
  const cpc=vv('an-i-cpc')||cpcArg
  const cpm=vv('an-i-cpm')||cpmArg
  const freq=vv('an-i-freq')||freqArg
  const avgView=vv('an-i-viewtime')||avgViewArg
  const amfreq=vv('an-i-amfreq')
  const leads=vv('an-i-leads')
  const quals=vv('an-i-quals')
  const notes=document.getElementById('an-notes')?.value||''
  const cr=clicks>0?Math.round(leads/clicks*10000)/100:0
  const cpl=leads>0?Math.round(spend/leads*100)/100:0
  const ar=leads>0?Math.round(quals/leads*10000)/100:0
  const cql=quals>0?Math.round(spend/quals*100)/100:0
  const now=new Date()
  const monthKey=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`

  // Determine month from period_from (when campaign ran)
  let periodMonthKey=monthKey
  if(from){
    let pf=from
    if(pf.includes('.')){const p=pf.split('.');const yr2=new Date().getFullYear();pf=`${yr2}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`}
    periodMonthKey=pf.slice(0,7)
  }
  const payload={
    zaliv_id:zid,zaliv_name:z?.name||'',
    period_from:from,period_to:to,
    reach,frequency:freq,amfreq,cpm,avg_view_time:avgView,
    clicks,cpc,ctr,spend,leads,quals,cr,cpl,ar,cql,
    buyer:buyer||CURRENT_USER?.name||'',geo,funnel,notes,
    month_key:periodMonthKey,
    region:CURRENT_REGION,
    adset_id:adsetId&&adsetId!=='all'&&adsetId!=='undefined'?adsetId:null,
    adset_name:adsetName&&adsetName!=='Вся кампания'?adsetName:null
  }
  // Save to adset_analyses if adset selected
  if(adsetId&&adsetId!=='all'&&adsetId!=='undefined'){
    await db.from('adset_analyses').insert({
      ...payload,campaign_id:ZALIVS.find(x=>x.id===zid)?.campaign_id||'',
      adset_id:adsetId,adset_name:adsetName||''
    })
  }
  const{data,error}=await db.from('rk_analyses').insert(payload).select().single()

  if(!error&&data){
    RK_ANALYSES.unshift(data)
    toast('Анализ сохранён ✓','ok')
    renderAnTree()
    selectAnZaliv(zid)
  }else{
    toast('Ошибка: '+(error?.message||'unknown'),'err')
    console.error(error)
  }
}

function normDate(d){
  // Normalize DD.MM or DD.MM.YYYY or YYYY-MM-DD → YYYY-MM-DD
  if(!d)return ''
  if(d.includes('-'))return d.slice(0,10)
  if(d.includes('.')){const p=d.split('.');const yr=p[2]||new Date().getFullYear();return `${yr}-${(p[1]||'01').padStart(2,'0')}-${(p[0]||'01').padStart(2,'0')}`}
  return d
}

function checkLeads(zidOrName,from,to){

  to=to||new Date().toISOString().slice(0,10)

    return{адсет:a.name,статус:a.status,домен:e?.domain||'— НЕ ПРИВЯЗАН —'}
  }))

  const keys=new Set(doms.filter(x=>x.domain).map(x=>x.domain))

  const bl=z.buyer==='Illia'?'I':z.buyer==='Danya'?'D':''
  let leads=0,quals=0;const matched={},unmatched={}
  SRC_DAILY.forEach(r=>{
    if((from&&r.day<from)||(to&&r.day>to))return

    }else unmatched[r.source]=(unmatched[r.source]||0)+(r.leads||0)
  })

  const un=Object.entries(unmatched).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,15)
  if(un.length){

    console.table(un.map(([источник,лиды])=>({источник,лиды,'зарегистрирован_как_домен':allDKeys().includes(srcParse(источник).key)?'да':'НЕТ'})))
    console.log('Если среди них есть лендинги этой РК — заведи их в Домены («+ свой домен») и привяжи к адсету.')
  }
  return{leads,quals,matched,unmatched}
}

// Оставляет ID у того залива, чьё название реально совпадает с кампанией в Meta,
// у остальных ID снимает (сами РК не удаляются — данные остаются).
async function fixDupes(from,to){
  from=from||'2026-06-01';to=to||new Date().toISOString().slice(0,10)
  const r=await fetch(SB_URL+'/functions/v1/get-campaigns',{method:'POST',headers:{'Authorization':'Bearer '+SB_ANON,'Content-Type':'application/json'},body:JSON.stringify({action:'reconcile',region:CURRENT_REGION,since:from,until:to})})
  const d=await r.json();if(!d.ok){toast('Сверка: '+(d.error||'ошибка'),'err');return}
  const metaName={};[...(d.campaigns||[]),...(d.other||[])].forEach(c=>{metaName[String(c.campaign_id)]=c.name})
  const byCid={};ZALIVS.filter(z=>z.campaign_id).forEach(z=>{const k=String(z.campaign_id);(byCid[k]=byCid[k]||[]).push(z)})
  let cleared=0
  for(const[cid,arr]of Object.entries(byCid)){
    if(arr.length<2)continue
    const mn=metaName[cid]
    // кого оставляем: точное совпадение имени с Meta → иначе совпадение по ядру → иначе самый старый залив
    let keep=null
    if(mn){
      const n=s=>s.trim().replace(/\s+/g,' ').toLowerCase()
      keep=arr.find(z=>n(z.name)===n(mn))||arr.find(z=>campCore(z.name)===campCore(mn))
    }
    keep=keep||arr.slice().sort((a,b)=>a.id-b.id)[0]
    for(const z of arr){
      if(z.id===keep.id)continue
      const{error}=await db.from('zalivs').update({campaign_id:null,updated_at:new Date().toISOString()}).eq('id',z.id)
      if(!error){z.campaign_id=null;cleared++;console.log('− снят ID у: '+z.name.slice(0,52)+(mn&&campCore(z.name)!==campCore(mn)?'  (не та кампания)':'  (дубль строки)'))}
    }
    if(mn)console.log('%c✓ '+cid+' закреплён за: '+keep.name.slice(0,52),'color:#3DBE8B')
  }
  if(cleared){toast('Снято лишних привязок: '+cleared,'ok');rzalivs();rdash()}else toast('Дублей не найдено','info')
  return cleared
}

    const pool=ZALIVS.filter(z=>!z.campaign_id)

      if(!error){t.campaign_id=String(camp.campaign_id);used.add(String(camp.campaign_id));n++;console.log('✓ привязана: '+t.name)}
      continue
    }
    // РК в CRM нет вовсе — заводим по названию из Meta

    const{data:z,error}=await db.from('zalivs').insert({

      ad_budget:0,rk_budget:0,domain:'',creos:[],goals:[],
      ind:'profit',status:'Check',insights:'',
      buyer:parseBuyerFromName(camp.name)||'Danya',
      funnel:parseFunnelFromName(camp.name),score:3,
      campaign_id:String(camp.campaign_id),
      date:date||new Date().toLocaleDateString('ru',{day:'2-digit',month:'2-digit'}),
      region:CURRENT_REGION
    }).select().single()
    if(!error&&z){

      // FDC-таски тут не заводим: это старые РК, свежие подхватит backfillFdc при загрузке
      console.log('+ создана: '+camp.name+' ($'+camp.spend+')')

  }
  const tot=n+created
  if(copies.length){console.warn('Пропущено копий из Meta: '+copies.length+' — у них ещё имя оригинала с «Copy». Переименуй в Meta и запусти снова:');copies.forEach(c=>console.warn('   '+c))
    toast('Пропущено копий: '+copies.length+' — переименуй в Meta','info')}
  if(tot){toast('Привязано: '+n+' · создано: '+created,'ok');rzalivs();rdash()}else if(!copies.length)toast('Нечего привязывать','info')
  return{linked:n,created}
}
// ── Сверка спенда: Meta (все кампании аккаунтов) vs то, что суммирует CRM ──
// Показывает ПОЧЕМУ цифры расходятся: не импортированные РК, без campaign_id, в TOGO, не тот регион.
// Подтянуть кальки прямо из объявлений Meta.
// Калька — это не домен, а ключ в реестре CRM: garno-site.vercel.app/#kalkulator3 → kalkulator3.
// Именно по этому ключу к РК привязываются лиды и квалы из GarnoCRM, поэтому писать
// сюда хост нельзя — у всех объявлений он одинаковый, и статистика обнулилась бы.
function linkKey(u){
  const keys=new Set(allDKeys())
  const norm=x=>String(x||'').toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').split(/[?#]/)[0].replace(/\/+$/,'')
  // свои домены из реестра — по полному адресу
  const n=norm(u)
  for(const m of (DOMAIN_META||[]))if(m.custom&&m.url&&n&&n.startsWith(norm(m.url)))return m.key
  let url;try{url=new URL(String(u||''))}catch(e){return ''}
  // основной случай: ключ в решётке
  const h=decodeURIComponent((url.hash||'').replace(/^#\/?/,'')).split(/[?&/]/)[0].toLowerCase()
  if(h&&keys.has(h))return h
  // запасной: последний сегмент пути
  const seg=(url.pathname.split('/').filter(Boolean).pop()||'').toLowerCase()
  if(seg&&keys.has(seg))return seg
  return ''
}

  const r=await fetch(SB_URL+'/functions/v1/get-campaigns',{method:'POST',
    headers:{'Authorization':'Bearer '+SB_ANON,'Content-Type':'application/json'},
    body:JSON.stringify({action:'get_ads',campaign_id:z.campaign_id,region:CURRENT_REGION})})
  const d=await r.json()
  if(!d.ok){console.error(d.error||d);return}
  const ads=(d.ads||[]).map(a=>{const k=(a.links||[]).map(linkKey).find(Boolean)||'';return Object.assign(a,{key:k})})

  if(ads.every(a=>!a.links))console.warn('get-campaigns не отдаёт ссылки — передеплой её, иначе кальки не определить')

  // «ничего не изменилось» и «ничего не нашлось» — разные вещи, путать их нельзя
  if(!ads.some(a=>a.key)){console.warn('Ни у одного объявления калька не найдена — записывать нечего. Смотри колонку «ссылка» в таблице выше.');return ads}
  if(!changed){console.log('%c✓ Кальки уже записаны','color:#3DBE8B');return ads}
  await db.from('zalivs').update({adset_domains:arr}).eq('id',z.id)

// Подтянуть имена кампаний из Meta в CRM.
// Переименование в кабинете в базу само не приезжает, а регион РК считается
// по имени ИЗ БАЗЫ — поэтому после правки имени в Meta строка остаётся в старом
// регионе и её спенд продолжает уходить не туда. Эта команда синхронизирует имена
// и заодно пересчитывает регион по новому имени.
async function syncNames(from,to){
  from=from||document.getElementById('pd-from')?.value
  to=to||document.getElementById('pd-to')?.value||from
  if(!from){console.log('Укажи период: syncNames("2026-09-20")');return}
  console.log('%c⏳ Сверяю имена с Meta · '+from+' → '+to,'font-weight:bold')
  const r=await fetch(SB_URL+'/functions/v1/get-campaigns',{method:'POST',
    headers:{'Authorization':'Bearer '+SB_ANON,'Content-Type':'application/json'},
    body:JSON.stringify({action:'reconcile',region:CURRENT_REGION,since:from,until:to})})
  const d=await r.json()
  if(!d.ok){console.error(d.error||d);return}
  const meta={},metaReg={}
  ;[...(d.campaigns||[]),...(d.other||[])].forEach(c=>{meta[String(c.campaign_id)]=c.name;metaReg[String(c.campaign_id)]=c.region})
  const{data,error}=await db.from('zalivs').select('id,name,region,campaign_id').not('campaign_id','is',null)
  if(error){console.error(error);return}
  const changes=[]
  for(const z of (data||[])){
    const nm=meta[String(z.campaign_id)]
    if(!nm)continue
    const tr=metaReg[String(z.campaign_id)]||nameRegion(nm), was=z.region||'PL'   // регион — по кабинету
    const nameOld=nm!==z.name, regOld=tr!==was
    if(!nameOld&&!regOld)continue
    // регион правим и тогда, когда имя уже верное: строка могла остаться в прошлом
    // регионе с момента, когда имя было другим
    const upd={};if(nameOld)upd.name=nm;if(regOld)upd.region=tr
    changes.push({было:String(z.name).slice(0,46),стало:String(nm).slice(0,46),регион:regOld?was+' → '+tr:was})
    await db.from('zalivs').update(upd).eq('id',z.id)
  }
  if(!changes.length){console.log('%c✓ Имена и регионы в CRM совпадают с Meta','color:#3DBE8B');return}
  console.log('%cОбновлено РК: '+changes.length,'color:#D4AF37;font-weight:bold')
  console.table(changes)
  toast('Имена обновлены: '+changes.length+' РК. Перезагружаю…','ok')
  setTimeout(()=>location.reload(),1600)
  return changes
}

    if(P.ctr){const p2=$('d-ctr-prev'),a2=$('d-ctr-arr');if(p2)p2.textContent=P.ctr+'%';if(a2){const d=(S.ctr-P.ctr)/P.ctr*100;a2.className='karr '+(d>=0?'up-good':'dn-bad');a2.textContent=(d>=0?'↑':'↓')+' '+Math.abs(d).toFixed(0)+'%'}}}
}

}

document.getElementById('li-go')?.addEventListener('click',doAuthLogin)

  ?.addEventListener('keydown',e=>{if(e.key==='Enter')doAuthLogin()}))

;(async()=>{
  try{
    if(!dbInit()){liErr('Не удалось подключиться к базе');dismissIntro();return}
    const{data}=await db.auth.getSession()
    const mail=data&&data.session&&data.session.user&&data.session.user.email

// ══ МОБИЛЬНАЯ НАВИГАЦИЯ ══
// Внизу — пять главных разделов под большой палец, остальное в шторке «Ещё».
// Кнопки ничего не дублируют: они нажимают те же пункты меню, что и на десктопе,
// поэтому вся логика переключения страниц остаётся одна.
;(function mobileNav(){
  const MAIN=[['dash','📊','Главная'],['tasks','✅','Задачи'],['zalivs','🚀','Заливы'],['analysis','🔬','Анализ']]
  const MORE=[['journal','📓','Журнал'],['creo','🎨','Крео'],['sales','💰','Продажи'],['domains','🌐','Домены']]
  const isMob=()=>matchMedia('(max-width:760px)').matches
  function build(){
    if(document.getElementById('mnav'))return
    const nav=document.createElement('nav');nav.id='mnav';nav.setAttribute('aria-label','Разделы')
    nav.innerHTML=MAIN.map(([id,ic,t])=>`<button data-go="${id}"><i>${ic}</i>${t}</button>`).join('')
      +`<button data-go="more"><i>☰</i>Ещё<span class="bdg" id="mnav-bdg" hidden></span></button>`
    const bg=document.createElement('div');bg.id='mmore-bg'
    const sh=document.createElement('div');sh.id='mmore';sh.setAttribute('role','dialog')
    const who=(typeof CURRENT_USER!=='undefined'&&CURRENT_USER)?CURRENT_USER:null
    sh.innerHTML=`<div class="grab"></div>
      <div class="mm-me" id="mm-me"></div>
      <div class="mm-sec">Разделы</div>
      <div class="mm-grid">${MORE.map(([id,ic,t])=>`<button data-go="${id}"><i>${ic}</i>${t}</button>`).join('')}</div>
      <div class="mm-sec">Действия</div>
      <button class="mm-row" data-act="jv"><i>◉</i>Геннадий — брифинг</button>
      <button class="mm-row" data-act="mic"><i>🎙</i>Микрофон</button>
      <button class="mm-row" data-act="sync"><i>↻</i>Синхронизация</button>
      <button class="mm-row" data-act="search"><i>🔍</i>Поиск</button>
      <button class="mm-row danger" data-act="out"><i>⎋</i>Выйти</button>`
    document.body.append(nav,bg,sh)
    // кто вошёл — берём из той же плашки, что на десктопе
    const me=()=>{const el=document.getElementById('mm-me');if(!el||typeof CURRENT_USER==='undefined'||!CURRENT_USER)return
      el.innerHTML=`<span class="mm-ava" style="background:${CURRENT_USER.bg||'var(--bg4)'};color:${CURRENT_USER.color||'var(--text)'};border-color:${CURRENT_USER.border||'var(--border)'}">${CURRENT_USER.initials||'?'}</span>
        <span><b>${CURRENT_USER.name}</b><small>${CURRENT_USER.role||''}</small></span>`}

    const close=()=>{sh.classList.remove('on');bg.classList.remove('on')}
    const open=()=>{me();sh.classList.add('on');bg.classList.add('on')}
    bg.onclick=close
    // свайп вниз закрывает шторку
    let y0=null
    sh.addEventListener('touchstart',e=>{if(sh.scrollTop<=0)y0=e.touches[0].clientY},{passive:true})
    sh.addEventListener('touchmove',e=>{if(y0!==null&&e.touches[0].clientY-y0>70){close();y0=null}},{passive:true})
    sh.addEventListener('touchend',()=>{y0=null},{passive:true})

    const go=id=>{document.getElementById('nb-'+id)?.click();close();sync()
      const c=document.querySelector('.content');if(c)c.scrollTo({top:0,behavior:'instant'})}
    nav.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return
      if(b.dataset.go==='more'){sh.classList.contains('on')?close():open();return}
      go(b.dataset.go)})
    sh.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return
      if(b.dataset.go){go(b.dataset.go);return}
      const a=b.dataset.act;close()
      if(a==='jv')document.getElementById('nb-jv')?.click()
      else if(a==='mic')document.getElementById('nb-mic')?.click()
      else if(a==='sync'&&typeof manualSync==='function')manualSync()
      else if(a==='search')document.getElementById('topbar-search')?.click()
      else if(a==='out'&&typeof doLogout==='function')doLogout()})

    // подсветка текущего раздела: следим за тем же классом, что и десктопное меню
    const sync=()=>{
      const act=document.querySelector('.nav .nb.active')?.id?.replace('nb-','')||'dash'
      const inMore=MORE.some(m=>m[0]===act)
      nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.go===act||(inMore&&b.dataset.go==='more')))
      sh.querySelectorAll('.mm-grid button').forEach(b=>b.style.borderColor=b.dataset.go===act?'var(--gold2,#e8c96a)':'')
    }
    const nv=document.querySelector('.nav')
    if(nv)new MutationObserver(sync).observe(nv,{subtree:true,attributes:true,attributeFilter:['class']})
    sync()

    // счётчик тревог с колокольчика — на кнопку «Ещё», чтобы было видно без шапки
    const bell=document.getElementById('bell-n')
    const bsync=()=>{const n=+(bell&&bell.textContent)||0,bd=document.getElementById('mnav-bdg');if(bd){bd.hidden=!n;bd.textContent=n>9?'9+':n}}
    if(bell)new MutationObserver(bsync).observe(bell,{childList:true,characterData:true,subtree:true})
    bsync()
    document.addEventListener('keydown',e=>{if(e.key==='Escape')close()})
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',build);else build()
})()

</script>
