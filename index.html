<!DOCTYPE html>
<html>
<head><meta charset="UTF-8">
<style>
body{background:#0a0a0f;color:#f0f0f5;font-family:sans-serif}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:400}
.mo.open{display:flex}
.mob{background:#111118;border:1px solid #3a3a50;border-radius:12px;display:flex;flex-direction:column;padding:0;max-height:88vh;overflow:hidden;width:460px}
.motit{font-size:15px;font-weight:800;color:#b52240;padding:20px 24px 0;margin-bottom:16px;flex-shrink:0;display:flex;justify-content:space-between}
.body-content{padding:0 24px;flex:1;overflow-y:auto}
.mofoot{flex-shrink:0;border-top:1px solid #2a2a3a;padding:14px 24px 20px;display:flex;gap:8px;justify-content:flex-end}
button{padding:7px 16px;border-radius:6px;cursor:pointer;font-size:12px}
.bcn{border:1px solid #3a3a50;background:transparent;color:#9090a8}
.bsv{border:1px solid #b52240;background:#3a0d18;color:#b52240}
.open-btn{padding:10px 20px;background:#b52240;border:none;color:#fff;border-radius:6px;cursor:pointer;font-size:14px;margin:20px}
#result{color:#2ea043;padding:20px;font-size:16px}
</style>
</head>
<body>
<div id="root"></div>
<script>
document.getElementById('root').innerHTML = `
<button class="open-btn" id="open-mo">Открыть модал</button>
<div id="result"></div>

<div class="mo" id="test-mo">
  <div class="mob">
    <div class="motit">Тест модала <button id="close-x" style="background:none;border:none;color:#5a5a70;font-size:22px;cursor:pointer">×</button></div>
    <div class="body-content">
      <p style="margin-bottom:16px;color:#9090a8">Нажми на кнопки ниже — они должны работать</p>
      <div style="background:#1e1e28;border-radius:8px;padding:14px;margin-bottom:16px">
        Контент модала
      </div>
    </div>
    <div class="mofoot">
      <button class="bcn" id="btn-cancel">Отмена</button>
      <button class="bsv" id="btn-confirm">✓ Подтвердить</button>
    </div>
  </div>
</div>
`

// Event delegation
document.addEventListener('click', function(e) {
  if(e.target.closest('#open-mo')) {
    document.getElementById('test-mo').classList.add('open')
    return
  }
  if(e.target.closest('#close-x') || e.target.closest('#btn-cancel')) {
    document.getElementById('test-mo').classList.remove('open')
    document.getElementById('result').textContent = '✓ Кнопка Отмена / X работает!'
    return
  }
  if(e.target.closest('#btn-confirm')) {
    document.getElementById('test-mo').classList.remove('open')
    document.getElementById('result').textContent = '✓ Кнопка Подтвердить РАБОТАЕТ!'
    return
  }
  // backdrop
  if(e.target.closest('.mo') && !e.target.closest('.mob')) {
    document.querySelector('.mo.open')?.classList.remove('open')
  }
})
</script>
</body>
</html>
