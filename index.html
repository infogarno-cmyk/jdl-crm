.holo{position:relative;color:transparent;-webkit-background-clip:text;background-clip:text;
  background-image:linear-gradient(var(--ha),
    rgba(255,255,255,.62) 0%, rgba(255,255,255,.62) calc(var(--hp) - 22%),
    rgba(255,110,199,.95) calc(var(--hp) - 13%), rgba(255,211,110,.95) calc(var(--hp) - 7%),
    rgba(120,255,214,.98) calc(var(--hp) - 1%), rgba(110,199,255,.98) calc(var(--hp) + 4%),
    rgba(200,110,255,.95) calc(var(--hp) + 10%), rgba(255,255,255,.62) calc(var(--hp) + 20%), rgba(255,255,255,.62) 100%);
  filter:drop-shadow(0 0 14px rgba(255,255,255,.18)) drop-shadow(0 0 30px rgba(140,200,255,.12))}
.holo-wrap:hover .holo{filter:drop-shadow(0 0 18px rgba(255,255,255,.28)) drop-shadow(0 0 40px rgba(180,140,255,.2))}
.holo::after{display:none}
.holo-wrap:hover .holo{filter:drop-shadow(0 0 28px rgba(212,175,55,.45)) saturate(1.2)}
.holo-wrap::before{display:none}
/* topbar */
.topbar{height:56px;background:linear-gradient(180deg,rgba(255,255,255,.025),transparent),var(--bg3);border-bottom:1px solid var(--border);padding:0 14px;gap:8px}
.logo{font-size:15px;font-weight:700;letter-spacing:.02em;margin-right:6px;display:flex;align-items:baseline;gap:6px}.logo em{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--bord2);transform:translateY(-3px);font-size:0}
.logo::after{display:none}
.region-tog{background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:2px;margin-left:4px}
.byseg .rt-btn.active{background:var(--blue);color:#fff}
.bell{position:relative;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--bg2);border:1px solid var(--border);cursor:pointer;font-size:13px;margin-right:4px}
.bell .n{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bord3);color:#fff;font:600 10px var(--mono);display:grid;place-items:center;border:2px solid var(--bg3)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:380px;background:var(--bg3);border-left:1px solid var(--border2);z-index:450;transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.6)}
.drawer.open{transform:none}.drawer .hd{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:600}
.drawer .x{width:28px;height:28px;border-radius:7px;background:var(--bg2);border:1px solid var(--border);color:var(--text2);cursor:pointer;display:grid;place-items:center}
.drawer .ls{overflow:auto;flex:1}
.al{padding:14px 18px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:auto 1fr;gap:12px}
.al .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:15px}.al .ic.r{background:var(--red-bg)}.al .ic.y{background:var(--yellow-bg)}.al .ic.b{background:var(--blue-bg)}.al .ic.g{background:var(--green-bg)}
.al b{font-weight:600;font-size:13px}.al p{font-size:12px;color:var(--text2);margin-top:2px}.al .act{margin-top:8px;display:flex;gap:6px}
.al .act button{border:1px solid var(--border2);background:var(--bg2);color:var(--text);font:500 11px var(--sans);padding:4px 9px;border-radius:6px;cursor:pointer}.al .act button.p{background:var(--bord2);border-color:var(--bord2)}
.rt-btn{font:600 11px var(--sans);padding:4px 9px;border-radius:7px;color:var(--text3)}.rt-btn.active{background:var(--bg5);color:var(--text);box-shadow:0 1px 0 var(--hi) inset,0 4px 10px -4px rgba(0,0,0,.6)}
.nav{height:56px;align-items:stretch;margin-left:4px}
.nb{font-size:12px;font-weight:500;text-transform:none;letter-spacing:0;padding:0 9px;border-bottom:none;color:var(--text2);position:relative;transition:color .15s}
.nb .dot{display:none}.nb:hover{color:var(--text)}
.nb.active{color:var(--text);background:transparent}.nb.active::after{content:'';position:absolute;left:9px;right:9px;bottom:-1px;height:1px;background:var(--bord3);box-shadow:0 0 12px var(--bord2)}
.nb-jt{font-weight:600;color:var(--gold)}
.search-btn{padding:5px 9px;border-radius:9px;background:var(--bg2);border:1px solid var(--border);font-size:11.5px;color:var(--text3);min-width:150px;gap:8px}.search-btn kbd{margin-left:auto;font:500 10px var(--mono);padding:2px 6px;border-radius:5px;background:var(--bg5);border:1px solid var(--border2);border-bottom-width:2px}
.uchip{border-radius:9px;background:var(--bg2);border:1px solid var(--border);padding:3px 10px 3px 3px}
.sync-btn,.ss-btn{border-radius:8px}
/* pages */
.page{padding:20px 22px}
.fhtit{font-size:22px;font-weight:600;letter-spacing:-.02em}
.fhcnt{color:var(--text3);font-weight:500}
/* panels */
.card,.kcol,.dc,.jtree,.jpane,.tstat,.insight-board,.an-card{background:linear-gradient(180deg,var(--bg4),var(--bg3));border:1px solid var(--border);border-radius:14px;box-shadow:0 1px 0 var(--hi) inset,0 20px 50px -30px rgba(0,0,0,.8)}
.card{padding:0;overflow:hidden}.card>.chdr{padding:12px 16px;border-bottom:1px solid var(--border);margin:0}.card>*:not(.chdr){margin-left:16px;margin-right:16px}.card>.ztwrap,.card>.cwrap{margin:0}
.card>.chdr+*{margin-top:12px}.card>*:last-child{margin-bottom:14px}.card>.chdr:last-child,.card>.ztwrap:last-child{margin-bottom:0}
.ctit{font-size:13.5px;font-weight:600;color:var(--text);text-transform:none;letter-spacing:0}
.clnk{font-size:11.5px;font-weight:500;padding:4px 10px;border-radius:7px;background:var(--bg2);border:1px solid var(--border);color:var(--text2)}.clnk:hover{color:var(--text);border-color:var(--border2)}
/* period bar */
.pbar{gap:8px;padding:0 0 14px;border-bottom:1px solid var(--border);margin-bottom:16px}
.pdw{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:5px 10px}.pdi{color:var(--text);font-size:12px}
.pb{border:1px solid transparent;color:var(--text3);font-weight:500;padding:5px 10px;border-radius:7px}.pb:hover{color:var(--text);background:var(--bg4)}.pb.active{background:var(--bg5);color:var(--text);border-color:var(--border);box-shadow:0 1px 0 var(--hi) inset}
.fsel{background-color:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text2);font-size:12px;padding:6px 26px 6px 10px}
.fi{background:var(--bg2);border:1px solid var(--border);border-radius:8px;font-size:13px;padding:8px 11px}.fi:focus{border-color:var(--border3)}
.bsv{border-radius:8px;font-weight:600;background:linear-gradient(180deg,var(--bord3),var(--bord2));color:#fff;border-color:var(--bord2);box-shadow:0 6px 16px -6px rgba(210,38,63,.7)}.bsv:hover{filter:brightness(1.1)}
/* hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:30px;align-items:end;padding:4px 4px 0;margin-bottom:14px}
.hero .lbl{color:var(--text3);font-size:12.5px;display:flex;align-items:center;gap:8px;font-weight:500}
.hero .live{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(61,190,139,.5);animation:hpulse 2.4s infinite}
@keyframes hpulse{0%{box-shadow:0 0 0 0 rgba(61,190,139,.5)}70%{box-shadow:0 0 0 9px rgba(61,190,139,0)}100%{box-shadow:0 0 0 0 rgba(61,190,139,0)}}
.hero .big{font:500 76px/1 var(--mono);letter-spacing:-.045em;font-variant-numeric:tabular-nums;margin-top:8px;display:flex;align-items:baseline;gap:14px}
.hero .big .cur{font-size:32px;color:#3E4457;letter-spacing:0;font-weight:400}
.hero .side{display:grid;grid-auto-flow:column;background:var(--bg2);border:1px solid var(--border);border-radius:12px;box-shadow:0 1px 0 var(--hi) inset}
.hero .side>div{padding:12px 18px;border-right:1px solid var(--border);min-width:120px}.hero .side>div:last-child{border:0}
.hero .side .k{font-size:11px;color:var(--text3);font-weight:500}
.hero .side .v{font:500 22px var(--mono);letter-spacing:-.02em;margin-top:3px;display:flex;align-items:baseline;gap:6px}.hero .side .v small{font-size:12px;color:#3E4457}
.tgl{width:34px;height:18px;border-radius:9px;background:var(--bg5);position:relative;cursor:pointer;border:1px solid var(--border2);transition:background .2s;display:inline-block}.tgl::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--text2);transition:all .2s}.tgl.on{background:var(--gold)}.tgl.on::after{left:18px;background:#2a2000}
.ev{display:grid;grid-template-columns:2px 1fr;gap:14px;padding:10px 0;border-bottom:1px solid var(--border);font-size:12.5px}.ev:last-child{border:0}.ev i{border-radius:1px;background:var(--cc);box-shadow:0 0 8px var(--cc)}.ev b{font-weight:600}.ev p{color:var(--text2);margin-top:2px}.ev .a{margin-top:6px;display:flex;gap:6px}.ev .a button{border:1px solid var(--border2);background:transparent;color:var(--text2);font:500 11px var(--sans);padding:3px 9px;border-radius:6px;cursor:pointer}.ev .a button:hover{color:var(--text);border-color:var(--text3)}
.dl{display:inline-flex;align-items:center;gap:3px;font:500 12px var(--mono);padding:2px 7px;border-radius:6px;letter-spacing:0;vertical-align:middle;line-height:1.3}
.dl.g{color:var(--green);background:var(--green-bg)}.dl.r{color:var(--red);background:var(--red-bg)}.dl.n{color:var(--text3);background:var(--bg4)}
.dl .ar{display:inline-block;animation:dlarr .5s cubic-bezier(.2,.8,.2,1) both}.dl.r .ar{animation-name:dlarrd}
@keyframes dlarr{0%{transform:translateY(8px);opacity:0}60%{transform:translateY(-2px)}100%{transform:none;opacity:1}}
@keyframes dlarrd{0%{transform:translateY(-8px);opacity:0}60%{transform:translateY(2px)}100%{transform:none;opacity:1}}
.dl.big{font-size:15px;padding:4px 10px}.dl:empty{display:none}
.tape{overflow:hidden;border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:7px 0;position:relative;margin:0 -22px 14px;background:var(--bg2)}
.tape::before,.tape::after{content:'';position:absolute;top:0;bottom:0;width:80px;z-index:2;pointer-events:none}.tape::before{left:0;background:linear-gradient(90deg,var(--bg2),transparent)}.tape::after{right:0;background:linear-gradient(270deg,var(--bg2),transparent)}
.tape .tr{display:flex;gap:36px;white-space:nowrap;animation:tape 50s linear infinite;width:max-content;padding-left:22px}.tape:hover .tr{animation-play-state:paused}
@keyframes tape{to{transform:translateX(-50%)}}
.tape span{font-size:12px;color:var(--text2);display:inline-flex;align-items:center;gap:8px}.tape i{width:6px;height:6px;border-radius:50%;display:inline-block}.tape b{font-family:var(--mono);font-weight:500;color:var(--text)}
/* KPI strip */
.krow{grid-template-columns:repeat(6,1fr);gap:0;background:linear-gradient(180deg,var(--bg4),var(--bg3));border:1px solid var(--border);border-radius:14px;box-shadow:0 1px 0 var(--hi) inset,0 20px 50px -30px rgba(0,0,0,.8);overflow:hidden;margin-bottom:14px}
.kpi{background:transparent;border:0;border-right:1px solid var(--border);border-radius:0;padding:16px 18px 14px}.kpi:last-child{border-right:0}.kpi::before{display:none}
.klab{font-size:11.5px;color:var(--text3);text-transform:none;letter-spacing:0;font-weight:500;margin-bottom:6px}
.kval{font-size:30px;font-weight:500;letter-spacing:-.03em}
.kpi-prev{color:#3E4457}
.karr{font-size:12px;padding:2px 7px;border-radius:6px;font-family:var(--mono);font-weight:500;display:inline-block;animation:karrUp 1.4s ease-in-out infinite}.karr.dn-good,.karr.dn-bad{animation-name:karrDn}
@keyframes karrUp{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes karrDn{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
.dl .ar{animation:karrUp 1.4s ease-in-out infinite}.dl.r .ar{animation-name:karrDn}
.karr.up-good,.karr.dn-good{background:var(--green-bg)}.karr.up-bad,.karr.dn-bad{background:var(--red-bg)}
/* chart */
.chleg{font-weight:500;color:var(--text);padding:4px 9px;border-radius:7px;font-size:11.5px}.chleg::before{box-shadow:0 0 8px var(--cc)}.chleg:hover{background:var(--bg2)}
.ccanv{height:150px}
.dgrid{grid-template-columns:1.3fr 1fr .9fr!important}
/* dashboard rows */
.zrow{padding:9px 0;font-size:12.5px;display:grid;grid-template-columns:8px 44px 1fr 60px 52px 16px;gap:10px;align-items:center}.zrow .zname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.zrow .zbud{text-align:right;font-family:var(--mono);color:var(--gold);font-size:11.5px}.zrow .zdot{width:8px;height:8px;border-radius:50%}
.tmini{padding:8px 0}
/* tables */
.zt th{background:var(--bg3);text-transform:none;letter-spacing:0;font-size:10.5px;font-weight:500;color:var(--text3);padding:8px 12px;border-bottom:1px solid var(--border)}
.zt td{padding:10px 12px;font-size:12.5px}
.zt tbody tr{transition:background .12s}.zt tbody tr:hover td{background:var(--bg4)}
.gchip,.zgeo{font-size:10px;font-weight:600;border-radius:5px;padding:2px 7px;border:1px solid}
.gpl,.gchip.gpl{color:#9DBBFF;border-color:rgba(110,155,255,.3);background:rgba(110,155,255,.08)}.gplua,.gchip.gplua{color:#C7B2FF;border-color:rgba(160,124,245,.3);background:rgba(160,124,245,.08)}
/* modals */
.mo{background:rgba(6,8,14,.7);backdrop-filter:blur(8px)}
.mob{background:linear-gradient(180deg,var(--bg4),var(--bg3));border:1px solid var(--border2);border-radius:16px;box-shadow:0 40px 100px -30px rgba(0,0,0,.9),0 1px 0 var(--hi) inset}
.motit{font-size:15px;font-weight:600;color:var(--text)}
.fl label{font-size:11.5px;color:var(--text3);font-weight:500;text-transform:none;letter-spacing:0}
/* toast */
.toast{border-radius:10px;background:var(--bg5);border:1px solid var(--border2);box-shadow:0 14px 40px rgba(0,0,0,.6)}
/* kanban */
.kcol{padding:12px}.kchdr{border-bottom:1px solid var(--border)}.kctit{font-size:12.5px;font-weight:600}
.tcard{background:var(--bg2);border-radius:9px;border:1px solid var(--border);border-left-width:2px}.tcard:hover{border-color:var(--border2)}
.tnm{font-weight:500}
/* zalivs split view */
.zsplit{display:grid;grid-template-columns:1fr 380px;gap:14px;align-items:start}
.zdp{position:sticky;top:12px;max-height:calc(100vh - 90px);display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,var(--bg4),var(--bg3));border:1px solid var(--border);border-radius:14px;box-shadow:0 1px 0 var(--hi) inset,0 20px 50px -30px rgba(0,0,0,.8)}
.zdp .dh{padding:16px 18px 12px;border-bottom:1px solid var(--border)}
.zdp .dh .t{font-size:14px;font-weight:600;line-height:1.3;word-break:break-all}
.zdp .dh .meta{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;font-size:11px;color:var(--text3)}
.zdp .sc{overflow:auto;flex:1}
.zdp .blk{padding:14px 18px;border-bottom:1px solid var(--border)}
.zdp .blk h4{font-size:11.5px;color:var(--text3);font-weight:500;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.zdp .blk h4 .lv{color:var(--green);display:flex;align-items:center;gap:5px;font-size:10.5px}
.lvg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lvg div{background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:9px 11px}
.lvg .k{font-size:10.5px;color:var(--text3)}.lvg .v{font:500 17px var(--mono);letter-spacing:-.02em;margin-top:2px}
.zdp .act{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:12px 18px;border-top:1px solid var(--border);background:var(--bg2)}
.zdp .act button{border:1px solid var(--border2);background:var(--bg4);color:var(--text);font:600 12px var(--sans);padding:8px;border-radius:8px;cursor:pointer}
.zdp .act button.p{background:linear-gradient(180deg,var(--bord3),var(--bord2));border-color:var(--bord2)}
.zdp .empty{display:grid;place-items:center;height:100%;padding:60px 20px}
.zdp .anh{display:flex;gap:6px;overflow-x:auto}
.zdp .an{flex:0 0 auto;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:7px 10px;min-width:100px;cursor:pointer}
.zdp .an b{display:block;font:500 10.5px var(--mono);color:var(--text3)}.zdp .an span{font:500 13px var(--mono);color:var(--gold)}.zdp .an small{display:block;color:var(--text3);font-size:10.5px;margin-top:2px}
.zdp .an.next{border-style:dashed}.zdp .an.due{border-color:rgba(212,175,55,.45)}.zdp .an.due b{color:var(--gold)}
.zdp .note{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:9px;color:var(--text);font:12.5px var(--sans);padding:9px 11px;resize:none;min-height:64px;outline:0}
.zt tbody tr.zsel td{background:linear-gradient(90deg,rgba(212,175,55,.07),transparent 60%)}.zt tbody tr.zsel td:first-child{box-shadow:inset 2px 0 0 var(--gold)}
/* lifecycle in row */
.lc{position:relative;height:16px;display:flex;align-items:center;min-width:100px}
.lc .tr{position:absolute;left:0;right:0;height:2px;background:var(--bg5);border-radius:1px}
.lc .fl2{position:absolute;left:0;height:2px;border-radius:1px;background:linear-gradient(90deg,var(--text3),var(--text2))}
.lc .m{position:absolute;top:50%;width:7px;height:7px;border-radius:50%;transform:translate(-50%,-50%);background:var(--bg3);border:1.5px solid #3E4457;z-index:1}
.lc .m.d{background:var(--green);border-color:var(--green);box-shadow:0 0 6px rgba(61,190,139,.6)}
.lc .m.w{border-color:var(--gold);animation:lcw 1.6s infinite}@keyframes lcw{50%{box-shadow:0 0 0 4px rgba(212,175,55,.18)}}
.lc .m::after{content:attr(data-l);position:absolute;top:9px;left:50%;transform:translateX(-50%);font:500 8px var(--mono);color:#3E4457;white-space:nowrap}
.lc .now{position:absolute;top:-2px;width:1px;height:20px;background:var(--bord3);box-shadow:0 0 6px var(--bord2)}
.zviews{display:flex;align-items:center;gap:4px;padding:0 0 10px;margin-bottom:10px;border-bottom:1px solid var(--border);overflow-x:auto}
.zviews .v{font-size:12.5px;font-weight:500;color:var(--text3);padding:6px 11px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:all .15s}
.zviews .v:hover{color:var(--text)}.zviews .v.on{color:var(--text);background:var(--bg2);box-shadow:0 1px 0 var(--hi) inset}
.zviews .v .n{font:500 10px var(--mono);color:#3E4457;margin-left:6px}
/* ── analysis (как в артефакте) ── */
#page-analysis{height:auto!important;overflow:visible!important;padding:20px 22px!important}
#page-analysis>div{grid-template-columns:270px 1fr!important;gap:14px;height:auto!important;min-height:600px}
#page-analysis>div>div{border-right:none!important;background:linear-gradient(180deg,var(--bg4),var(--bg3));border:1px solid var(--border);border-radius:14px;box-shadow:0 1px 0 var(--hi) inset,0 20px 50px -30px rgba(0,0,0,.8);overflow:hidden}
#an-tree{max-height:none}
.an-tree-yr{padding:9px 12px;font-size:12.5px;font-weight:600;background:var(--bg2);border-bottom:1px solid var(--border)}
.an-tree-sect{padding:8px 12px 3px;font:500 10.5px var(--sans);color:#3E4457;letter-spacing:.02em;text-transform:none}
.an-tree-item{padding:7px 12px 7px 14px;font-size:12px;border-left:2px solid transparent}.an-tree-item.active{background:linear-gradient(90deg,rgba(212,175,55,.08),transparent);border-left-color:var(--gold);color:var(--text)}
.an-tree-item .an-meta{font:500 10px var(--mono);color:#3E4457}
#an-content{padding:0!important;display:flex;flex-direction:column;gap:0}
.ah{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:16px 18px 14px;border-bottom:1px solid var(--border)}
.ah .t{font-size:15px;font-weight:600;line-height:1.3}.ah .meta{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.ah .lcw{width:320px;padding-top:6px;flex-shrink:0}.ah .lcw .lc .m::after{top:12px}
.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;padding:16px 18px}
.acd{background:linear-gradient(180deg,var(--bg4),var(--bg3));border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 1px 0 var(--hi) inset;transition:border-color .15s}.acd:hover{border-color:var(--border2)}

// ── GEO selectors are region-dependent: render + bind here ──
function populateGeoSelectors(){
  const cfg=regionCfg()
  const geos=regionGeos()
  const flagOf=g=>isUaGeo(g)?cfg.flag+'🇺🇦':cfg.flag
  // Filter selects (zalivs + domains)
  ;['zf-geo','df-geo'].forEach(id=>{
    const sel=document.getElementById(id);if(!sel)return
    const cur=sel.value
    sel.innerHTML='<option value="">🌐 GEO</option>'+geos.map(g=>`<option value="${g}">${flagOf(g)} ${g}</option>`).join('')
    if(geos.includes(cur))sel.value=cur;else sel.value=''
  })
  // Zaliv modal GEO buttons (single select)
  const mo=document.getElementById('mo-geos')
  if(mo){
    mo.innerHTML=geos.map(g=>`<div class="go" data-geo="${g}">${flagOf(g)} ${g}</div>`).join('')
    mo.querySelectorAll('[data-geo]').forEach(btn=>btn.addEventListener('click',function(){
      mo.querySelectorAll('[data-geo]').forEach(b=>b.classList.remove('sel'));this.classList.add('sel');moGeo=this.dataset.geo;updDomains();updPrev()
    }))
  }
  // Domain add GEO buttons (multi select)
  const dm=document.getElementById('dm-geos')
  if(dm){
    dm.innerHTML=geos.map(g=>`<div class="go" data-dgeo="${g}">${flagOf(g)} ${g}</div>`).join('')
    dm.querySelectorAll('[data-dgeo]').forEach(btn=>btn.addEventListener('click',function(){
      if(domGeoSel.includes(this.dataset.dgeo)){domGeoSel=domGeoSel.filter(x=>x!==this.dataset.dgeo);this.classList.remove('sel')}
      else{domGeoSel.push(this.dataset.dgeo);this.classList.add('sel')}
    }))
  }
  // Domain edit GEO buttons (multi select)
  const de=document.getElementById('de-geos')
  if(de){
    de.innerHTML=geos.map(g=>`<div class="go" data-degeo="${g}">${flagOf(g)} ${g}</div>`).join('')
    de.querySelectorAll('[data-degeo]').forEach(btn=>btn.addEventListener('click',function(){
      if(deGeoSel.includes(this.dataset.degeo)){deGeoSel=deGeoSel.filter(x=>x!==this.dataset.degeo);this.classList.remove('sel')}
      else{deGeoSel.push(this.dataset.degeo);this.classList.add('sel')}
    }))
  }
  // Creo library GEO select + filter
  const clGeo=document.getElementById('cl-geo')
  if(clGeo){
    const cur=clGeo.value
    clGeo.innerHTML=`<option value="${cfg.creoMain}">${cfg.flag} ${cfg.creoMain}</option><option value="${cfg.creoUa}">${cfg.flag}🇺🇦 ${cfg.creoUa}</option>`
    if([cfg.creoMain,cfg.creoUa].includes(cur))clGeo.value=cur
  }
  const clfGeo=document.getElementById('clf-geo')
  if(clfGeo){
    const cur=clfGeo.value
    clfGeo.innerHTML=`<option value="">GEO</option><option value="${cfg.creoMain}">${cfg.creoMain}</option><option value="${cfg.creoUa}">${cfg.creoUa}</option>`
    if([cfg.creoMain,cfg.creoUa].includes(cur))clfGeo.value=cur;else clfGeo.value=''
  }
}

document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();openSearch();return}
  if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();saveDoc();return}
  const mo=document.getElementById('mo-search')
  if(!mo.classList.contains('open'))return
  if(e.key==='Escape'){mo.classList.remove('open');return}
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();const items=document.querySelectorAll('.srch-item');items.forEach(i=>i.classList.remove('sel'))
    srchSelIdx=e.key==='ArrowDown'?Math.min(srchSelIdx+1,items.length-1):Math.max(srchSelIdx-1,0)
    items[srchSelIdx]?.classList.add('sel');items[srchSelIdx]?.scrollIntoView({block:'nearest'});return
  }
  if(e.key==='Enter'){const sel=document.querySelector('.srch-item.sel');if(sel)sel.click()}
})

// leads/quals from GarnoCRM for a zaliv (or one adset) over a period, via mapped sources
function srcStats(zid,adsetId,from,to){const maps=ADSET_SRC.filter(m=>m.zaliv_id===zid&&(adsetId?m.adset_id===adsetId:true));const srcs=new Set(maps.map(m=>m.source));if(!srcs.size)return null
  let leads=0,quals=0;SRC_DAILY.forEach(r=>{if(srcs.has(r.source)&&(!from||r.day>=from)&&(!to||r.day<=to)){leads+=r.leads||0;quals+=r.quals||0}});return{leads,quals,sources:[...srcs]}}
function zSrcStats(z){const d=z.date||parseDateFromCampName(z.name);let from=null;if(d){const p=d.split('.');if(p.length===2)from=`${new Date().getFullYear()}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`}return srcStats(z.id,null,from,null)}
async function setAdsetSource(zid,adsetId,adsetName,source){allSources();const ex=ADSET_SRC.find(m=>m.zaliv_id===zid&&m.adset_id===adsetId)
  if(!source){if(ex){await db.from('adset_sources').delete().eq('id',ex.id);ADSET_SRC=ADSET_SRC.filter(m=>m.id!==ex.id)}}
  else if(ex){await db.from('adset_sources').update({source}).eq('id',ex.id);ex.source=source}
  else{const{data}=await db.from('adset_sources').insert({zaliv_id:zid,adset_id:adsetId,adset_name:adsetName,source,region:CURRENT_REGION}).select().single();if(data)ADSET_SRC.push(data)}

function countUp(el,target,pre='',suf='',dur=800){
  const n=parseFloat(target);if(isNaN(n)){el.textContent=target;return}
  const start=Date.now();const timer=setInterval(()=>{
    const p=Math.min((Date.now()-start)/dur,1),e=1-Math.pow(1-p,3),cur=n*e
    el.textContent=pre+(Number.isInteger(n)?Math.round(cur):cur.toFixed(1))+suf
    if(p>=1){clearInterval(timer);el.textContent=pre+target+suf}
  },16)
}

function buildEvents(){
  const ev=[],al=[];const td=todayISO(),since=new Date(Date.now()-864e5).toISOString()
  const me=CURRENT_BUYER
  const mine=z=>!me||z.buyer===me
  // bad CPL (last analysis per RK)
  const seen=new Set();RK_ANALYSES.forEach(a=>{if(seen.has(a.zaliv_id))return;seen.add(a.zaliv_id);const z=ZALIVS.find(x=>x.id===a.zaliv_id);if(!z||z.ind==='off'||!mine(z))return
    if(a.frequency>2.5){ev.push(['#D4AF37','Частота '+a.frequency,`${z.name.slice(0,40)} — аудитория выгорает`,[['В Крео',"gp('creo',document.getElementById('nb-creo'))"]]]);al.push(['y','◔','Частота '+a.frequency,z.name.slice(0,44),z.id])}})
  // needs analysis
  const need=ZALIVS.filter(z=>mine(z)&&zNeedsAn(z));if(need.length){ev.push(['#D4AF37','Ждут анализа: '+need.length,need.slice(0,3).map(z=>z.name.slice(0,28)).join(' · '),[['Открыть',"document.querySelector('[data-zv=\\'noan\\']')?.click();gp('zalivs',document.getElementById('nb-zalivs'))"]]]);al.push(['b','◷','Ждут анализа: '+need.length,need.slice(0,3).map(z=>z.name.slice(0,30)).join(' · '),need[0].id])}
  // new analyses
  RK_ANALYSES.filter(a=>a.created_at>=since).slice(0,2).forEach(a=>ev.push(['#3DBE8B','Анализ сохранён',`${(a.zaliv_name||'').slice(0,36)} — CPL $${a.cpl||0} · ${a.leads||0} л / ${a.quals||0} кв`,[]]))
  // sales 24h
  const pdt=s=>{if(!s)return null;if(s.includes('-'))return new Date(s);const p=s.split('.');return p.length===3?new Date(p[2]+'-'+p[1]+'-'+p[0]):null};const sl=(SALES_DATA||[]).filter(s=>{const d=pdt(s.createdAt);return d&&d.getTime()>=Date.now()-864e5});if(sl.length)ev.push(['#3DBE8B','Продажа'+(sl.length>1?'и: '+sl.length:''),sl.slice(0,2).map(s=>(s.saleAmount||0).toLocaleString('ru')+' '+cur()+(s.source?' · '+s.source:'')).join(' · '),[['Sales',"gp('sales',document.getElementById('nb-sales'))"]]])
  // tasks overdue
  const due=TASKS.filter(t=>t.deadline&&t.deadline<td&&t.col!=='done'&&t.col!=='archived'&&(!me||t.assignee===me));if(due.length){ev.push(['#F03A55','Просрочено задач: '+due.length,due.slice(0,3).map(t=>t.title.slice(0,30)).join(' · '),[['Таски',"gp('tasks',document.getElementById('nb-tasks'))"]]]);al.push(['r','⏰','Просрочено задач: '+due.length,due.slice(0,3).map(t=>t.title.slice(0,30)).join(' · '),0])}
  // grind
  GRIND.filter(g=>g.created_at>=since).slice(0,2).forEach(g=>ev.push([({insight:'#D4AF37',plan:'#6E9BFF',test:'#A07CF5'})[g.gtype],g.gtype.toUpperCase()+' · '+(g.buyer||''),g.text.slice(0,90),[]]))
  return{ev,al}
}

  heroCountUp($('hero-l'),leads,v=>Math.round(v));heroCountUp($('hero-q'),quals,v=>Math.round(v));heroCountUp($('hero-daily'),daily,v=>'$'+Math.round(v))

function rdash(){
  const buyer=document.getElementById('df-buyer')?.value||''
  if(buyer){rdashBuyer(buyer);return}
  resetDashLabels()
  const from=document.getElementById('pd-from').value,to=document.getElementById('pd-to').value
  const rows=METRICS.filter(m=>m.day>=from&&m.day<=to)
  let tS=0,tPL=0,tPLUA=0,tL=0,tQ=0,tSzl=0
  rows.forEach(r=>{tS+=parseFloat(r.spend_pl||0)+parseFloat(r.spend_plua||0);tPL+=parseFloat(r.spend_pl||0);tPLUA+=parseFloat(r.spend_plua||0);tL+=(r.leads_pl||0)+(r.leads_plua||0);tQ+=r.quals||0;tSzl+=parseFloat(r.sales_amount_zl||0)})
  const days=rows.length||1,cpl=tL>0?(tS/tL).toFixed(1):0,cql=tQ>0?(tS/tQ).toFixed(1):0
  const spD=(tS/days).toFixed(0),profit=tSzl*0.3*0.25,roi=tS>0?Math.round((profit-tS)/tS*100):0
  const avgCtr=rows.length>0?(rows.reduce((s,r)=>s+parseFloat(r.ctr||0),0)/rows.length).toFixed(2):0
  // ── HERO ──
  heroRender(tS,tL,tQ,+spD,from,to)
  // ── COMPARISON PERIOD ──
  // Calculate previous period of same length
  const fromDate = new Date(from + 'T00:00:00')
  const toDate = new Date(to + 'T00:00:00')
  const periodDays = Math.max(1, Math.round((toDate - fromDate) / 86400000) + 1)
  const prevTo = new Date(fromDate - 86400000).toISOString().split('T')[0]
  const prevFrom = new Date(fromDate - periodDays * 86400000).toISOString().split('T')[0]
  const prevRows = METRICS.filter(m => m.day >= prevFrom && m.day <= prevTo)
  window._chartPrev=prevRows
  let pS=0, pL=0, pQ=0, pSzl=0
  prevRows.forEach(r=>{pS+=parseFloat(r.spend_pl||0)+parseFloat(r.spend_plua||0);pL+=(r.leads_pl||0)+(r.leads_plua||0);pQ+=r.quals||0;pSzl+=parseFloat(r.sales_amount_zl||0)})
  const pDays = prevRows.length || 1
  const pCpl = pL>0 ? pS/pL : 0
  const pCql = pQ>0 ? pS/pQ : 0
  const pSpD = pS/pDays
  const pProfit = pSzl*0.3*0.25
  const pRoi = pS>0 ? Math.round((pProfit-pS)/pS*100) : 0
  const pCtr = prevRows.length>0 ? prevRows.reduce((s,r)=>s+parseFloat(r.ctr||0),0)/prevRows.length : 0
  heroDelta(tS,pS)

  function setCompare(id, cur, prev, higherIsBetter) {
    const arrEl = document.getElementById(id+'-arr')
    const prevEl = document.getElementById(id+'-prev')
    if(!arrEl||!prevEl) return
    if(!document.getElementById('cmp-tgl')?.classList.contains('on')||!prev){arrEl.textContent='';prevEl.textContent='';return}
    arrEl.style.animation='none';void arrEl.offsetWidth;arrEl.style.animation=''
    const diff = cur - prev
    const pct = prev !== 0 ? Math.round(Math.abs(diff)/Math.abs(prev)*100) : 0
    const isUp = diff > 0
    const isGood = higherIsBetter ? isUp : !isUp
    const flat = Math.abs(diff) < 0.01 * Math.abs(prev || 1)
    if(flat){arrEl.textContent='→';arrEl.className='karr flat'}
    else{
      arrEl.textContent = isUp ? '↑' : '↓'
      arrEl.className = 'karr ' + (isGood ? (isUp?'up-good':'dn-good') : (isUp?'up-bad':'dn-bad'))
    }
    prevEl.textContent = typeof prev === 'number' && prev > 0 ? (id.includes('roi')?prev+'%':'$'+Math.round(prev)) + (pct&&!flat?' ('+pct+'%)':'') : ''
  }

function renderChartFocused(focusKey){
  if(!chartData||!chartData.length)return
  const rows=chartData,cv=document.getElementById('dyn-chart'),ctx=cv.getContext('2d')
  const W=cv.width,H=cv.height,P={t:10,b:22,l:10,r:10},cw=W-P.l-P.r,ch=H-P.t-P.b
  ctx.clearRect(0,0,W,H)
  const nz=v=>{const x=parseFloat(v);return x>0?x:null}
  const allS=[
    {k:'cpl',d:rows.map(r=>nz(r.cpl)),c:'#4080ff'},
    {k:'cql',d:rows.map(r=>nz(r.cql)),c:'#d4a017'},
    {k:'ctr',d:rows.map(r=>parseFloat(r.ctr)||0),c:'#2ea043'},
    {k:'spend',d:rows.map(r=>parseFloat(r.spend_pl||0)+parseFloat(r.spend_plua||0)),c:'#e04050'}
  ]
  allS.forEach(s=>{const vals=s.d.filter(v=>v!=null);s.mn=vals.length?Math.min(...vals):0;s.mx=vals.length?Math.max(...vals):1;if(s.mx===s.mn)s.mx=s.mn+1})
  const n=rows.length,xs=n>1?cw/(n-1):0,px=i=>P.l+i*xs,py=(v,s)=>P.t+ch*(1-(v-s.mn)/(s.mx-s.mn))
  allS.forEach(s=>{
    const isFocus=s.k===focusKey
    ctx.globalAlpha=isFocus?1:0.1
    // gap-aware
    let started=false
    for(let i=0;i<n;i++){
      if(s.d[i]==null){started=false;continue}
      if(!started){ctx.beginPath();ctx.moveTo(px(i),py(s.d[i],s));started=true}
      else ctx.lineTo(px(i),py(s.d[i],s))
      // if next is null or end, stroke
      if(i===n-1||s.d[i+1]==null){ctx.strokeStyle=s.c;ctx.lineWidth=isFocus?2.5:1;ctx.stroke()}
    }
    ctx.globalAlpha=1
  })
}

function drawChart(rows){chartData=rows;const c=document.getElementById('dyn-chart');if(!c)return;c.width=c.parentElement.offsetWidth||600;c.height=130;renderChart(true)}
function renderChart(animate=false){
  if(!chartData||!chartData.length)return
  const rows=chartData,c=document.getElementById('dyn-chart'),ctx=c.getContext('2d')
  const W=c.width,H=c.height,P={t:10,b:22,l:10,r:10},cw=W-P.l-P.r,ch=H-P.t-P.b
  ctx.clearRect(0,0,W,H)
  const activeMets=new Set([...(document.querySelectorAll('.chleg.active')||[])].map(el=>el.dataset.cmet))
  // For CPL/CQL: 0 means no leads/quals that day → break the line (null), don't drop to bottom
  const nz=v=>{const n=parseFloat(v);return n>0?n:null}
  const allS=[
    {k:'cpl',d:rows.map(r=>nz(r.cpl)),c:'#6E9BFF',l:'CPL',gap:true},
    {k:'cql',d:rows.map(r=>nz(r.cql)),c:'#D4AF37',l:'CQL',gap:true},
    {k:'ctr',d:rows.map(r=>parseFloat(r.ctr)||0),c:'#3DBE8B',l:'CTR'},
    {k:'spend',d:rows.map(r=>parseFloat(r.spend_pl||0)+parseFloat(r.spend_plua||0)),c:'#F03A55',l:'Spend'}
  ]
  const S=allS.filter(s=>activeMets.size===0||activeMets.has(s.k))
  // ghost (prev period) series
  const GH=(window._chartPrev&&document.getElementById('chleg-ghost')?.classList.contains('active'))?allS.filter(s=>activeMets.size===0||activeMets.has(s.k)).map(s=>({k:s.k,c:s.c,d:window._chartPrev.map(r=>s.k==='cpl'?nz(r.cpl):s.k==='cql'?nz(r.cql):s.k==='ctr'?(parseFloat(r.ctr)||0):(parseFloat(r.spend_pl||0)+parseFloat(r.spend_plua||0)))})):[]
  S.forEach((s,i)=>{const g=GH.find(x=>x.k===s.k);const vals=[...s.d,...(g?g.d:[])].filter(v=>v!=null);s.mn=vals.length?Math.min(...vals):0;s.mx=vals.length?Math.max(...vals):1;if(s.mx===s.mn)s.mx=s.mn+1;if(g){g.mn=s.mn;g.mx=s.mx}})
  const n=rows.length,xs=n>1?cw/(n-1):0,px=i=>P.l+i*xs,py=(v,s)=>P.t+ch*(1-(v-s.mn)/(s.mx-s.mn))
  ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=1
  for(let i=0;i<=4;i++){const y=P.t+ch*i/4;ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cw,y);ctx.stroke()}
  GH.forEach(s=>{ctx.save();ctx.globalAlpha=.4;ctx.setLineDash([4,4]);let st=false;for(let i=0;i<Math.min(n,s.d.length);i++){if(s.d[i]==null){st=false;continue}if(!st){ctx.beginPath();ctx.moveTo(px(i),py(s.d[i],s));st=true}else ctx.lineTo(px(i),py(s.d[i],s));if(i===n-1||s.d[i+1]==null){ctx.strokeStyle=s.c;ctx.lineWidth=1.2;ctx.stroke()}}ctx.restore()})
  S.forEach(s=>{
    ctx.save()
    // Draw line in continuous segments, breaking at null values
    let segStart=-1
    const drawSeg=(a,b)=>{
      if(b<=a)return
      // gradient fill under segment
      ctx.beginPath();ctx.moveTo(px(a),H-P.b);ctx.lineTo(px(a),py(s.d[a],s))
      for(let i=a+1;i<=b;i++){const x0=px(i-1),y0=py(s.d[i-1],s),x1=px(i),y1=py(s.d[i],s),cx=(x0+x1)/2;ctx.bezierCurveTo(cx,y0,cx,y1,x1,y1)}
      ctx.lineTo(px(b),H-P.b);ctx.closePath()
      const g=ctx.createLinearGradient(0,P.t,0,H-P.b);g.addColorStop(0,s.c+'33');g.addColorStop(1,s.c+'00');ctx.fillStyle=g;ctx.fill()
      // stroke
      ctx.beginPath();ctx.moveTo(px(a),py(s.d[a],s))
      for(let i=a+1;i<=b;i++){const x0=px(i-1),y0=py(s.d[i-1],s),x1=px(i),y1=py(s.d[i],s),cx=(x0+x1)/2;ctx.bezierCurveTo(cx,y0,cx,y1,x1,y1)}
      ctx.strokeStyle=s.c;ctx.lineWidth=2;ctx.stroke()
    }
    for(let i=0;i<n;i++){
      if(s.d[i]!=null){
        if(segStart<0)segStart=i
      }else{
        if(segStart>=0){drawSeg(segStart,i-1);segStart=-1}
      }
    }
    if(segStart>=0)drawSeg(segStart,n-1)
    // dots only where data exists; isolated points (no neighbours) get a bigger ringed dot so they're visible
    for(let i=0;i<n;i++){
      if(s.d[i]==null)continue
      const isolated=(i===0||s.d[i-1]==null)&&(i===n-1||s.d[i+1]==null)
      ctx.beginPath();ctx.arc(px(i),py(s.d[i],s),isolated?4.5:3,0,Math.PI*2);ctx.fillStyle=s.c;ctx.fill()
      if(isolated){ctx.beginPath();ctx.arc(px(i),py(s.d[i],s),7,0,Math.PI*2);ctx.strokeStyle=s.c;ctx.lineWidth=1.5;ctx.globalAlpha=.5;ctx.stroke();ctx.globalAlpha=1}
    }
    ctx.restore()
  })
  ctx.fillStyle='rgba(144,144,168,.6)';ctx.font='10px Manrope,sans-serif';ctx.textAlign='center'
  const li=[0,Math.floor((n-1)/2),n-1].filter((v,i,a)=>a.indexOf(v)===i)
  li.forEach(i=>ctx.fillText(rows[i]?.day?.slice(5)||'',px(i),H-4))
  c._S=S;c._rows=rows;c._P=P;c._cw=cw;c._ch=ch
  // Draw-in animation — smooth brush stroke per line using clip
  if(animate&&n>1){
    const FRAMES=120        // total frames for one line
    const STAGGER=50        // frames delay between lines
    const TOTAL=FRAMES + S.length*STAGGER
    let frame=0

    function animFrame(){
      frame++
      ctx.clearRect(0,0,W,H)

      // Grid lines
      ctx.save()
      ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=1
      for(let i=0;i<=4;i++){const y=P.t+ch*i/4;ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cw,y);ctx.stroke()}
      ctx.restore()

      S.forEach((s,si)=>{
        const lineStart=si*STAGGER
        const lf=frame-lineStart
        if(lf<=0)return

        // ease in-out cubic for ultra smooth motion
        const raw=Math.min(lf/FRAMES,1)
        const p=raw<0.5?4*raw*raw*raw:(raw-1)*(2*raw-2)*(2*raw-2)+1

        ctx.save()
        // Clip to left portion of chart as line "draws"
        const clipX=P.l+p*cw+4
        ctx.beginPath()
        ctx.rect(0,0,clipX,H)
        ctx.clip()

        // Draw in gap-aware segments (break where s.d[i]==null)
        const segs=[]
        let ss=-1
        for(let i=0;i<n;i++){
          if(s.d[i]!=null){if(ss<0)ss=i}
          else{if(ss>=0){segs.push([ss,i-1]);ss=-1}}
        }
        if(ss>=0)segs.push([ss,n-1])

        segs.forEach(([a,b])=>{
          if(b<=a){
            // single point — just a dot handled below
            return
          }
          // Gradient fill
          ctx.beginPath()
          ctx.moveTo(px(a),H-P.b)
          ctx.lineTo(px(a),py(s.d[a],s))
          for(let i=a+1;i<=b;i++){const x0=px(i-1),y0=py(s.d[i-1],s),x1=px(i),y1=py(s.d[i],s),cxm=(x0+x1)/2;ctx.bezierCurveTo(cxm,y0,cxm,y1,x1,y1)}
          ctx.lineTo(px(b),H-P.b);ctx.closePath()
          const g=ctx.createLinearGradient(0,P.t,0,H-P.b);g.addColorStop(0,s.c+'45');g.addColorStop(1,s.c+'00');ctx.fillStyle=g;ctx.fill()
          // Stroke with glow
          ctx.beginPath();ctx.moveTo(px(a),py(s.d[a],s))
          for(let i=a+1;i<=b;i++){const x0=px(i-1),y0=py(s.d[i-1],s),x1=px(i),y1=py(s.d[i],s),cxm=(x0+x1)/2;ctx.bezierCurveTo(cxm,y0,cxm,y1,x1,y1)}
          ctx.strokeStyle=s.c;ctx.lineWidth=2;ctx.shadowColor=s.c;ctx.shadowBlur=8;ctx.stroke();ctx.shadowBlur=0
        })

        // Dots fade in as line passes them; isolated points get a bigger ringed dot
        for(let i=0;i<n;i++){
          if(s.d[i]==null)continue
          const dotX=px(i)
          if(dotX>clipX)continue
          const dotProgress=Math.min(1,(clipX-dotX)/20)
          const isolated=(i===0||s.d[i-1]==null)&&(i===n-1||s.d[i+1]==null)
          const dy=py(s.d[i],s)
          ctx.beginPath()
          ctx.arc(dotX,dy,(isolated?4.5:2.5)*dotProgress,0,Math.PI*2)
          ctx.fillStyle=s.c
          ctx.globalAlpha=dotProgress
          ctx.fill()
          if(isolated){ctx.beginPath();ctx.arc(dotX,dy,7*dotProgress,0,Math.PI*2);ctx.strokeStyle=s.c;ctx.lineWidth=1.5;ctx.globalAlpha=dotProgress*.5;ctx.stroke()}
          ctx.globalAlpha=1
        }

        ctx.restore()
      })

      // X-axis labels
      ctx.fillStyle='rgba(144,144,168,.6)'
      ctx.font='10px Manrope,sans-serif'
      ctx.textAlign='center'
      li.forEach(i=>ctx.fillText(rows[i]?.day?.slice(5)||'',px(i),H-4))

      if(frame<TOTAL)requestAnimationFrame(animFrame)
    }
    requestAnimationFrame(animFrame)
  }
}
function chartMouseMove(e){

}

      <div class="blk" style="border-left:2px solid var(--purple)"><h4>Адсет → калькулятор GarnoCRM <span id="zdp-ads-n">${_zAdsCache[zid]?_zAdsCache[zid].length+' адсетов':''}</span></h4><div style="font-size:11px;color:var(--text3);margin:-4px 0 10px">Выбери у каждого адсета источник, под которым лиды приходят в GarnoCRM — лиды и квалы будут считаться сами по дням.</div><div id="zdp-ads">${_zAdsCache[zid]?_zAdsCache[zid].map(a=>{const m=ADSET_SRC.find(x=>x.zaliv_id===zid&&x.adset_id===a.id);const st=srcStats(zid,a.id);return`<div class="zad"><div class="sw ${a.status==='ACTIVE'?'on':''}" onclick="toggleAdset(${zid},'${a.id}',this)"></div><div class="n">${a.name}<small>${a.status==='ACTIVE'?'активен':'выключен'}${a.daily_budget?' · $'+(a.daily_budget/100).toFixed(0)+'/д':''}${st?` · <span style="color:var(--green)">${st.leads} л / ${st.quals} кв</span>`:''}</small><input class="srcsel" list="srclist" value="${m?.source||''}" placeholder="источник в GarnoCRM (kalkulator1, igarnoland2cz…)" onchange="setAdsetSource(${zid},'${a.id}','${a.name.replace(/'/g,'')}',this.value.trim().toLowerCase())"></div></div>`}).join('')||'<span style="font-size:11px;color:var(--text3)">нет адсетов</span>':z.campaign_id?'<span class="clnk" onclick="loadZalivAdsets('+zid+')">⚡ загрузить адсеты</span>':'<span style="font-size:11px;color:var(--text3)">нет campaign_id</span>'}</div>

async function loadZalivAdsets(zid){const z=ZALIVS.find(x=>x.id===zid);if(!z?.campaign_id)return
  try{const r=await fetch(SB_URL+'/functions/v1/get-campaigns',{method:'POST',headers:{'Authorization':'Bearer '+SB_ANON,'Content-Type':'application/json'},body:JSON.stringify({action:'get_adsets',campaign_id:z.campaign_id,region:CURRENT_REGION})});const d=await r.json();if(d.ok){_zAdsCache[zid]=d.adsets||[];allSources();selZaliv(zid)}else toast('Meta: '+(d.error||'ошибка'),'err')}catch(e){toast('Meta недоступна','err')}finally{delete _zAdsLoading[zid]}}
async function toggleAdset(zid,adsetId,el){const on=!el.classList.contains('on');el.classList.toggle('on',on)
  try{const r=await fetch(SB_URL+'/functions/v1/get-campaigns',{method:'POST',headers:{'Authorization':'Bearer '+SB_ANON,'Content-Type':'application/json'},body:JSON.stringify({action:'set_adset_status',adset_id:adsetId,status:on?'ACTIVE':'PAUSED',region:CURRENT_REGION})});const d=await r.json();if(d.ok){const a=(_zAdsCache[zid]||[]).find(x=>x.id===adsetId);if(a)a.status=on?'ACTIVE':'PAUSED';toast('Адсет '+(on?'включён':'выключен'),'ok')}else{el.classList.toggle('on',!on);toast('Meta: '+(d.error||'ошибка'),'err')}}catch(e){el.classList.toggle('on',!on);toast('Meta недоступна','err')}}
function zAnKeyOf(a,z){const f=normDate(a.period_from),t=normDate(a.period_to);if(!f||!t)return'';const span=Math.round((new Date(t)-new Date(f))/864e5);const raw=z.date||parseDateFromCampName(z.name)||'1.1';const p=raw.split('.');const d0=new Date(new Date().getFullYear(),+p[1]-1,+p[0]);const off=Math.round((new Date(f)-d0)/864e5);if(span===0&&off===0)return'1dc';if(span===0&&off===1)return'2dc';if(span===1)return'3dc';if(off>=4)return'2k';return'kwartal'}
async function loadZaliveLive(zid){
  const z=ZALIVS.find(x=>x.id===zid);if(!z?.campaign_id)return
  const td=new Date().toISOString().split('T')[0]
  try{const r=await fetch(SB_URL+'/functions/v1/get-campaigns',{method:'POST',headers:{'Authorization':'Bearer '+SB_ANON,'Content-Type':'application/json'},body:JSON.stringify({action:'get_campaign_insights',campaign_id:z.campaign_id,since:td,until:td,region:CURRENT_REGION})});const d=await r.json();if(d.ok){_zLiveCache[zid]={...d,at:new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})};selZaliv(zid)}else toast('Meta: '+(d.error||'ошибка'),'err')}catch(e){toast('Meta недоступна','err')}
}

// ── ZALIVS ──
function scoreToAutoStatus(s){return s<=2?'OFF':s<=4?'Check':'Scale'}
async function cycleZcat(zid){const z=ZALIVS.find(x=>x.id===zid);if(!z)return;const o=['','mwp','test','trash'];z.cat=o[(o.indexOf(z.cat||'')+1)%o.length];await db.from('zalivs').update({cat:z.cat||null}).eq('id',zid);rzalivs();toast('Категория: '+(z.cat?z.cat.toUpperCase():'убрана'),'ok')}
function gchip(g){return`<span class="zgeo gchip ${geoClass(g)}">${g}</span>`}
var _zView='mine',_zSel=null
var LCM=[[1,'1DC','1dc'],[3,'3DC','3dc'],[4,'K','kwartal'],[7,'2K','2k']],LCT=9
function zDays(z){const raw=z.date||parseDateFromCampName(z.name)||'';if(!raw)return 0;const p=raw.split('.');if(p.length<2)return 0;const d=new Date(new Date().getFullYear(),+p[1]-1,+p[0]);return Math.max(0,Math.floor((Date.now()-d)/864e5))}
function zAnKeys(z){const set=new Set();RK_ANALYSES.filter(a=>a.zaliv_id===z.id).forEach(a=>{const k=zAnKeyOf(a,z);if(k)set.add(k)});return set}
function zLifecycle(z){const d=zDays(z),an=zAnKeys(z),pos=x=>Math.min(100,x/LCT*100),on=z.ind!=='off';return`<div class="lc" title="день ${d}"><div class="tr"></div><div class="fl2" style="width:${pos(d)}%"></div>${LCM.map(m=>`<div class="m ${an.has(m[2])?'d':(d>=m[0]&&on?'w':'')}" style="left:${pos(m[0])}%" data-l="${m[1]}"></div>`).join('')}<div class="now" style="left:${pos(d)}%"></div></div>`}
function zNeedsAn(z){if(z.ind==='off'||z.togo)return false;const d=zDays(z),an=zAnKeys(z);return LCM.some(m=>d>=m[0]&&!an.has(m[2]))}
function zCpl(z){const a=RK_ANALYSES.filter(x=>x.zaliv_id===z.id).sort((p,q)=>(q.created_at||'').localeCompare(p.created_at||''))[0];return a?+a.cpl||0:0}
function zViewFilter(z){const me=CURRENT_BUYER||'';if(_zView==='togo')return !!z.togo;if(z.togo)return false;switch(_zView){case'mine':return z.ind!=='off'&&(!me||z.buyer===me);case'noan':return zNeedsAn(z);case'test':return z.cat==='test';default:return true}}
function spbs(z){return Array.from({length:7},(_,i)=>`<button class="spb${z.score===i?' s'+i:''}" data-zid="${z.id}" data-sc="${i}">${i}</button>`).join('')}

function rzalivs(){
  const geo=document.getElementById('zf-geo').value,st=document.getElementById('zf-status').value,q=document.getElementById('zf-q').value.toLowerCase()
  const sort=document.getElementById('zf-sort')?.value||'new'
  const buyer=document.getElementById('zf-buyer')?.value||''
  let f=ZALIVS.filter(z=>
    (!geo||z.geo===geo)&&
    (!st||z.status===st)&&
    (!buyer||z.buyer===buyer)&&
    (!_zfInd||z.ind===_zfInd)&&(!_zfCat||(z.cat||'')===_zfCat)&&
    (!q||z.name.toLowerCase().includes(q))&&zViewFilter(z)
  )
  // view counters
  const base=ZALIVS.filter(z=>(!geo||z.geo===geo)&&(!buyer||z.buyer===buyer));document.querySelectorAll('#zviews .v').forEach(v=>{const s=_zView;_zView=v.dataset.zv;v.querySelector('.n').textContent=base.filter(zViewFilter).length;_zView=s})
  // Sort — parse real date from z.date or campaign name
  const getZDate=z=>{
    const raw=z.date||parseDateFromCampName(z.name)||''
    if(!raw)return 0
    const p=raw.split('.')
    if(p.length===2){
      const yr=new Date().getFullYear()
      return new Date(yr+'-'+p[1].padStart(2,'0')+'-'+p[0].padStart(2,'0')).getTime()
    }
    return 0
  }
  if(sort==='new')f=[...f].sort((a,b)=>getZDate(b)-getZDate(a))
  else if(sort==='old')f=[...f].sort((a,b)=>getZDate(a)-getZDate(b))
  else if(sort==='score')f=[...f].sort((a,b)=>(b.score||0)-(a.score||0))
  else if(sort==='budget')f=[...f].sort((a,b)=>(b.rk_budget||0)-(a.rk_budget||0))
  document.getElementById('z-count').textContent='('+f.length+')'
  let html=''
  const lastAn=z=>RK_ANALYSES.filter(a=>a.zaliv_id===z.id).sort((p,q)=>(q.created_at||'').localeCompare(p.created_at||''))[0]||{}
  const CRCOL=['linear-gradient(160deg,#4a3a1a,#8a6a24)','linear-gradient(160deg,#1f3a5a,#3c6a9a)','linear-gradient(160deg,#3a2456,#6a44a0)','linear-gradient(160deg,#1e4a3a,#2f7a5a)']
  const groups={profit:[],drop:[],off:[],togo:[]};f.forEach(z=>(z.togo?groups.togo:(groups[z.ind]||groups.off)).push(z))
  const GN={profit:'Profit',drop:'Drop',off:'Off',togo:'TOGO · ждут своего времени'},GC={profit:'var(--green)',drop:'var(--yellow)',off:'#3E4457',togo:'var(--purple)'}
  ;['togo','profit','drop','off'].forEach(gk=>{
    const g=groups[gk];if(!g.length)return
    const sp=g.reduce((s,z)=>s+(z.rk_budget||0),0),ctrs=g.map(z=>_zBulk[z.campaign_id]?.ctr||0).filter(Boolean),av=ctrs.length?(ctrs.reduce((a,b)=>a+b,0)/ctrs.length).toFixed(2)+'%':'—'
    html+=`<tr class="zgrp${gk==='off'?' zcl':''}" data-grp="${gk}"><td colspan="11"><span class="zgh"><span class="car">▾</span><i style="background:${GC[gk]}"></i>${GN[gk]} <span class="gn">${g.length}</span><span class="gsum">Σ <b>$${Math.round(sp)}</b><span>CTR ${av}</span></span></span></td></tr>`
    g.forEach(z=>{
      const a=lastAn(z),cpl=+a.cpl||0,ctr=+a.ctr||0,d=zDays(z)
      const cplC=cpl?(cpl<12?'var(--green)':cpl<15?'var(--yellow)':'var(--red)'):'var(--text3)',ctrC=ctr>2?'var(--green)':ctr>1.3?'inherit':'var(--red)'
      const rc=`zr2 g-${gk}${expZ===z.id?' rex':''}${_zSel===z.id?' zsel':''}`
      html+=`<tr class="${rc}" data-zid="${z.id}" style="cursor:pointer">
      <td><input type="checkbox" class="zcheck zrow-check" data-zid="${z.id}" onclick="event.stopPropagation()"></td>
      <td><span class="zst" style="background:${GC[gk]};${gk!=='off'?'box-shadow:0 0 8px '+GC[gk]:''}" onclick="event.stopPropagation();indMenu(event,${z.id})" title="P / D / O"></span></td>
      <td><div class="zctl">${z.togo?'':`<div class="sw ${z.ind!=='off'?'on':''}" onclick="event.stopPropagation();setInd(${z.id},'${z.ind==='off'?'profit':'off'}')" title="${z.ind==='off'?'Включить':'Выключить'}"></div>`}<span class="stpill ${SCLS[z.status]||''}" onclick="event.stopPropagation();stMenu(event,${z.id})" title="Статус">${z.status||'—'}</span></div></td>
      <td>${gchip(z.geo)}</td>
      <td class="znm"><div class="rkn">${z.name}</div><div class="zsub"><span class="tg">${z.funnel||'—'}</span><span class="tg b">${(z.buyer||'?')[0]}</span>${z.cat?`<span class="zcat ${z.cat}" onclick="event.stopPropagation();cycleZcat(${z.id})">${z.cat.toUpperCase()}</span>`:''}<span class="zd">${d} дн.</span></div></td>
      <td>${z.togo?`<button class="zrk-add" style="color:var(--purple);border-color:rgba(160,124,245,.4)" onclick="event.stopPropagation();activateTogo(${z.id})">→ В работу</button>`:zLifecycle(z)}</td>
      <td class="m budg" style="color:var(--gold)">$${z.ad_budget||0}<small style="color:#3E4457">/$${z.rk_budget||0}</small></td>
      <td class="m">${(()=>{const s=zSrcStats(z);return s?`${s.leads} <span style="color:#3E4457">/</span> <span style="color:var(--green)">${s.quals}</span>`:'—'})()}</td>
      <td class="m" style="color:${(()=>{const lv=_zBulk[z.campaign_id];const v=lv?lv.ctr:ctr;return v>2?'var(--green)':v>1.3?'inherit':v?'var(--red)':'inherit'})()}">${(()=>{const lv=_zBulk[z.campaign_id];const v=lv?lv.ctr:ctr;return v?(+v).toFixed(2)+'%':'—'})()}</td>

      <td><div class="th">${(z.creos||[]).slice(0,3).map((cn,j)=>`<i style="background:${CRCOL[j]}" class="ctag" data-zid="${z.id}" data-creo="${cn}" title="${cn}"></i>`).join('')}${(z.creos||[]).length>3?`<i class="n">+${z.creos.length-3}</i>`:(z.creos||[]).length<5?`<i class="n cadd" data-zid="${z.id}">+</i>`:''}</div></td>
      </tr>`
      if(expZ===z.id)html+=exRow(z)
    })
  })
  document.getElementById('zt-body').innerHTML=html||`<tr><td colspan="11" class="empty">Нет заливов</td></tr>`
  document.querySelectorAll('tr.zgrp').forEach(tr=>tr.addEventListener('click',()=>{tr.classList.toggle('zcl');const g=tr.dataset.grp;document.querySelectorAll('tr.g-'+g).forEach(r=>r.style.display=tr.classList.contains('zcl')?'none':'')}))
  document.querySelectorAll('tr.zgrp.zcl').forEach(tr=>document.querySelectorAll('tr.g-'+tr.dataset.grp).forEach(r=>r.style.display='none'))
  document.querySelectorAll('#zt-body tr[data-zid]').forEach(tr=>{
    tr.addEventListener('click',e=>{
      if(e.target.closest('button,select,a,.ctag,.exrow,.exin,.exbl,.insta,.efi,.sbsv,.sbdl,.spb-e,.spb,.rmbtn,.ef-creo-del,.ef-creo-row'))return

async function fetchCampaignMetrics(z){
  const el=document.getElementById('ex-metrics-'+z.id)
  if(!el)return
  try{
    // Parse date_start from zaliv date field
    let since=null
    const raw=z.date||''
    if(raw){
      const p=raw.split('.')
      if(p.length===2){
        const yr=new Date().getFullYear()
        since=`${yr}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`
      }
    }
    if(!since&&z.created_at)since=z.created_at.split('T')[0]
    const until=new Date().toISOString().split('T')[0]

    const r=await fetch(SB_URL+'/functions/v1/get-campaigns',{
      method:'POST',
      headers:{'Authorization':'Bearer '+SB_ANON,'Content-Type':'application/json'},
      body:JSON.stringify({action:'get_campaign_insights',campaign_id:z.campaign_id,since,until,region:CURRENT_REGION})
    })
    const d=await r.json()
    if(!d.ok||d.error){
      el.innerHTML='<div style="font-size:11px;color:var(--red)">Ошибка: '+(d.error||'Meta API')+'</div>'
      return
    }
    const cplColor=d.cpl>0&&d.cpl<10?'var(--green)':d.cpl<15?'var(--yellow)':d.cpl>0?'var(--red)':'var(--text)'
    el.innerHTML=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">
      <div style="background:var(--bg5);border-radius:5px;padding:7px 9px;text-align:center">
        <div style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">SPEND</div>
        <div style="font-size:16px;font-weight:800;color:var(--yellow);font-family:var(--mono)">$${d.spend}</div>
        <div style="font-size:9px;color:var(--text3)">${d.days}д · $${d.spend_daily}/д</div>
      </div>
      <div style="background:var(--bg5);border-radius:5px;padding:7px 9px;text-align:center">
        <div style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">CPL</div>
        <div style="font-size:16px;font-weight:800;color:${cplColor};font-family:var(--mono)">${d.cpl>0?'$'+d.cpl:'—'}</div>
        <div style="font-size:9px;color:var(--text3)">CTR: ${d.ctr}%</div>
      </div>
      <div style="background:var(--bg5);border-radius:5px;padding:7px 9px;text-align:center">
        <div style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">LEADS</div>
        <div style="font-size:16px;font-weight:800;color:#fff;font-family:var(--mono)">${d.leads}</div>
        <div style="font-size:9px;color:var(--text3)">${d.clicks} кликов</div>
      </div>
    </div>`
  }catch(e){
    if(el)el.innerHTML='<div style="font-size:11px;color:var(--red)">Ошибка загрузки</div>'
  }
}

async function setInd(id,ind){await db.from('zalivs').update({ind,updated_at:new Date().toISOString()}).eq('id',id);const z=ZALIVS.find(x=>x.id===id);if(z)z.ind=ind;rzalivs();if(_zSel===id)selZaliv(id)}
async function setScore(id,score){
  const z=ZALIVS.find(x=>x.id===id);if(!z)return
  const isLocked=AUTO_STATUS_LOCKED.includes(z.status)
  let newStatus=z.status;if(!isLocked)newStatus=scoreToAutoStatus(score)
  // Intercept OFF transition — предлагаем архивировать крео
  if(!isLocked&&newStatus==='OFF'&&z.status!=='OFF'&&(z.creos||[]).length>0){
    // Сначала сохраняем score, потом интерсептим
    await db.from('zalivs').update({score,updated_at:new Date().toISOString()}).eq('id',id)
    z.score=score
    if(interceptOFF(id))return // модал открыт, статус применится позже
  }
  await db.from('zalivs').update({score,status:newStatus,updated_at:new Date().toISOString()}).eq('id',id)
  const prev=z.status;z.score=score
  if(!isLocked&&newStatus!==prev){z.status=newStatus;toast(`Score ${score} → ${prev} → ${newStatus}`,'info')}
  rzalivs()
}
async function setStatus(id,sel){
  const z=ZALIVS.find(x=>x.id===id);if(!z)return
  // Intercept manual OFF
  if(sel.value==='OFF'&&z.status!=='OFF'&&(z.creos||[]).length>0){
    if(interceptOFF(id)){
      // Reset select visually until user confirms
      sel.value=z.status;sel.className='ssel '+(SCLS[z.status]||'')
      return
    }
  }
  z.status=sel.value;sel.className='ssel '+(SCLS[sel.value]||'')
  await db.from('zalivs').update({status:sel.value,updated_at:new Date().toISOString()}).eq('id',id)
}

function addCreoInline(id){
  const z=ZALIVS.find(x=>x.id===id);if(!z||(z.creos||[]).length>=5)return
  const libGeo=geoToCreoGeo(z.geo)||''
  const opts=CREO_LIB.filter(cr=>!libGeo||cr.geo===libGeo)
  const btn=document.querySelector('[data-zid="'+id+'"].cadd')
  if(!btn)return
  const wrap=document.createElement('div')
  wrap.style.cssText='display:flex;gap:4px;margin-top:3px'
  const sel=document.createElement('select')
  sel.className='ssel';sel.style.cssText='flex:1;font-size:11px;max-width:160px'
  sel.innerHTML='<option value="">— крео —</option>'+
    opts.map(cr=>'<option value="'+cr.name+'">'+cr.name+(cr.status==='hall'?' 🏆':cr.status==='used'?' ⚡':' ✨')+'</option>').join('')
  const ok=document.createElement('button')
  ok.className='sbsv';ok.textContent='✓';ok.style.cssText='padding:2px 8px;font-size:11px'
  const x=document.createElement('button')
  x.className='sbdl';x.textContent='✕';x.style.cssText='padding:2px 7px;font-size:11px'
  ok.addEventListener('click',function(e){
    e.stopPropagation()
    const v=sel.value;if(!v)return
    z.creos=(z.creos||[]).concat([v])
    db.from('zalivs').update({creos:z.creos}).eq('id',id).then(()=>rzalivs())
    wrap.remove()
  })
  x.addEventListener('click',function(e){e.stopPropagation();wrap.remove();btn.style.display=''})
  wrap.appendChild(sel);wrap.appendChild(ok);wrap.appendChild(x)
  btn.parentNode.insertBefore(wrap,btn)
  btn.style.display='none'
}

function parseDt(ds){if(!ds)return null;if(ds.includes('-'))return new Date(ds);const p=ds.split('.');if(p.length===3)return new Date(p[2]+'-'+p[1]+'-'+p[0]);return null}

  document.getElementById('sales-count').textContent='('+f.length+')'

  const sm={};f.forEach(s=>{const src=s.source||'Неизвестно';if(!sm[src])sm[src]={count:0,amount:0};sm[src].count++;sm[src].amount+=s.saleAmount||0})
  document.getElementById('sales-sources').innerHTML=Object.entries(sm).sort((a,b)=>b[1].amount-a[1].amount).map(([src,v])=>`<div class="ssrc"><div class="sstop"><span class="ssn">${src}</span><span class="sscnt">${v.count} пр.</span></div><div class="ssamt">${v.amount.toLocaleString('ru')} ${cur()}</div><div class="sssub">avg ${Math.round(v.amount/v.count).toLocaleString('ru')} ${cur()}</div></div>`).join('')||'<div class="empty">Нет продаж</div>'

}

async function saveTk(title,col,who,extra){
  if(!title||!title.trim())return
  const maxSo=TASKS.filter(t=>t.col===col).reduce((mx,t)=>Math.max(mx,t.sort_order||0),0)
  const row={title:title.trim(),col,assignee:who||'',deadline:extra?.deadline||null,sort_order:maxSo+10,
    ttype:extra?.ttype||'other',rk_id:extra?.rk_id||null,rk_name:extra?.rk_name||null,rk_region:extra?.rk_region||null,
    started_at:col==='process'?new Date().toISOString():null,time_spent:0}
  const{data,error}=await db.from('tasks').insert(row).select().single()
  if(!error&&data){TASKS.push(data);rtasks();return data}

// ── column change with timer ──
async function moveTask(t,newCol){
  if(t.col===newCol)return
  const now=new Date().toISOString();const upd={col:newCol,updated_at:now}
  if(newCol==='process'){upd.started_at=now}
  else if(t.col==='process'&&t.started_at){upd.time_spent=(t.time_spent||0)+Math.round((Date.now()-new Date(t.started_at).getTime())/1000);upd.started_at=null}
  if(newCol==='done'){upd.done_at=now}
  Object.assign(t,upd)
  await db.from('tasks').update(upd).eq('id',t.id)
}

// ── STATS ──
function taskStats(){
  const per=+document.getElementById('tf-per')?.value||7;const uf=document.getElementById('tf-u')?.value||'';const tf=document.getElementById('tf-type')?.value||''
  const from=per?new Date(Date.now()-(per-1)*864e5).toISOString().split('T')[0]:'0000'
  const pool=TASKS.filter(t=>(!uf||t.assignee===uf)&&(!tf||(t.ttype||'other')===tf)&&(t.col==='done'||t.col==='archived'||t.col==='process')&&((t.done_at||t.updated_at||'').slice(0,10)>=from||t.col==='process'))
  const byType={};let total=0
  pool.forEach(t=>{const k=t.ttype||'other';const ms=taskElapsed(t);byType[k]=byType[k]||{n:0,ms:0};byType[k].n++;byType[k].ms+=ms;total+=ms})
  const todayMs=TASKS.filter(t=>(!uf||t.assignee===uf)&&((t.done_at||'').slice(0,10)===todayISO()||t.col==='process')).reduce((s,t)=>s+taskElapsed(t),0)
  return{byType,total,todayMs,n:pool.length}
}
function renderStats(){
  const el=document.getElementById('tstat');if(!el)return
  const s=taskStats()
  el.innerHTML=`<div class="tsh"><b>⏱ Время по задачам</b><span style="font-size:11px;color:var(--text3)">за ${({1:'сегодня',7:'неделю',30:'месяц',0:'всё время'})[+document.getElementById('tf-per').value]} · ${s.n} задач</span><span style="margin-left:auto;font:700 13px var(--mono);color:var(--yellow)">Σ ${fmtDur(s.total)}</span><span style="font:600 11px var(--mono);color:var(--green)">сегодня ${fmtDur(s.todayMs)}</span></div>
  <div class="tsg">${Object.keys(TTYPES).map(k=>{const v=s.byType[k]||{n:0,ms:0};return`<div class="tsc"><div class="k"><i style="width:7px;height:7px;border-radius:50%;background:${TTCOL[k]};display:inline-block"></i>${TTYPES[k]}</div><div class="v">${fmtDur(v.ms)}</div><div class="s">${v.n} задач · avg ${v.n?fmtDur(v.ms/v.n):'—'}</div></div>`}).join('')}</div>
  <div class="tsbar">${Object.keys(TTYPES).map(k=>{const v=s.byType[k]||{ms:0};const w=s.total?v.ms/s.total*100:0;return w?`<i style="width:${w}%;background:${TTCOL[k]}" title="${TTYPES[k]} ${Math.round(w)}%"></i>`:''}).join('')}</div>`
}

function buildJdlToday(){
  const since=Date.now()-864e5,sinceISO=new Date(since).toISOString();const td=todayISO()
  const ev=[]
  // new RK
  const newRk=(window._ALL_ZALIVS||ZALIVS).filter(z=>z.created_at>=sinceISO)
  if(newRk.length)ev.push(['#6E9BFF','Новые РК: '+newRk.length,newRk.slice(0,4).map(z=>z.name.slice(0,42)).join(' · ')])
  // analyses
  const newAn=RK_ANALYSES.filter(a=>a.created_at>=sinceISO)
  if(newAn.length)ev.push(['#3DBE8B','Анализов сделано: '+newAn.length,newAn.slice(0,4).map(a=>(a.zaliv_name||'').slice(0,30)+' — CPL $'+(a.cpl||0)).join(' · ')])
  // bad CPL from analyses last 24h
  // metrics today/yesterday
  const m=METRICS.slice(-2);if(m.length===2){const[y,t]=m;const sp=x=>+(x.spend_pl||0)+(+x.spend_plua||0);const dl=y.leads_pl+y.leads_plua;ev.push(['#D4AF37','Вчера · '+CURRENT_REGION,'спенд $'+Math.round(sp(y))+' · лиды '+dl+' · квалы '+(y.quals||0)+' · CPL $'+(y.cpl||0)+' · CQL $'+(y.cql||0)])}
  // tasks
  const doneT=TASKS.filter(t=>(t.done_at||'')>=sinceISO);const todoT=TASKS.filter(t=>t.col==='todo'&&(!CURRENT_USER||t.assignee===CURRENT_USER.name));const dueT=TASKS.filter(t=>t.deadline&&t.deadline<td&&t.col!=='done'&&t.col!=='archived')
  if(doneT.length)ev.push(['#3DBE8B','Закрыто задач: '+doneT.length,'время '+fmtDur(doneT.reduce((s,t)=>s+taskElapsed(t),0))])
  if(dueT.length)ev.push(['#F03A55','Просрочено задач: '+dueT.length,dueT.slice(0,3).map(t=>t.title.slice(0,36)).join(' · ')])
  if(todoT.length)ev.push(['#6E9BFF','На сегодня в TO DO: '+todoT.length,todoT.slice(0,4).map(t=>t.title.slice(0,36)).join(' · ')])
  // sales
  const pdt=s=>{if(!s)return null;if(s.includes('-'))return new Date(s);const p=s.split('.');return p.length===3?new Date(p[2]+'-'+p[1]+'-'+p[0]):null};const sl=(SALES_DATA||[]).filter(s=>{const d=pdt(s.createdAt);return d&&d.getTime()>=since});if(sl.length)ev.push(['#D4AF37','Продажи за 24ч: '+sl.length,sl.reduce((a,s)=>a+(s.saleAmount||0),0).toLocaleString('ru')+' '+cur()])
  const ins=GRIND.filter(g=>g.created_at>=sinceISO)
  return{ev,ins}
}

// ── DRAG & DROP v7 — чёткие зоны, сохранение порядка ──
var dragOverEl=null,dragOverPos=null

document.addEventListener('dragstart',e=>{
  const tc=e.target.closest('.tcard[data-id]');if(!tc)return
  dragId=parseInt(tc.dataset.id)
  e.dataTransfer.effectAllowed='move'
  e.dataTransfer.setData('text/plain',String(dragId))
  setTimeout(()=>tc.classList.add('dragging'),0)
})

document.addEventListener('dragend',()=>{
  document.querySelectorAll('.tcard.dragging,.tcard.drag-over-top,.tcard.drag-over-bot').forEach(t=>t.classList.remove('dragging','drag-over-top','drag-over-bot'))
  document.querySelectorAll('.kcol.dov').forEach(c=>c.classList.remove('dov'))
  dragId=null;dragOverEl=null;dragOverPos=null
})

document.addEventListener('dragover',e=>{
  e.preventDefault();e.dataTransfer.dropEffect='move'
  document.querySelectorAll('.tcard.drag-over-top,.tcard.drag-over-bot').forEach(t=>t.classList.remove('drag-over-top','drag-over-bot'))
  document.querySelectorAll('.kcol.dov').forEach(c=>c.classList.remove('dov'))
  const tc=e.target.closest('.tcard[data-id]')
  if(tc&&dragId&&parseInt(tc.dataset.id)!==dragId){
    const rect=tc.getBoundingClientRect()
    // Зона захвата — верхние 50% = вставить до, нижние 50% = вставить после
    dragOverPos=e.clientY<rect.top+rect.height*0.5?'top':'bot'
    dragOverEl=parseInt(tc.dataset.id)
    tc.classList.add(dragOverPos==='top'?'drag-over-top':'drag-over-bot')
  }else{
    dragOverEl=null;dragOverPos=null
    const col=e.target.closest('.kcol');if(col)col.classList.add('dov')
  }
})

document.addEventListener('drop',e=>{
  e.preventDefault()
  document.querySelectorAll('.tcard.drag-over-top,.tcard.drag-over-bot').forEach(t=>t.classList.remove('drag-over-top','drag-over-bot'))
  document.querySelectorAll('.kcol.dov').forEach(c=>c.classList.remove('dov'))
  if(!dragId)return

  const dragTask=TASKS.find(t=>t.id===dragId);if(!dragTask)return

  if(dragOverEl){
    const targetTask=TASKS.find(t=>t.id===dragOverEl);if(!targetTask)return
    const newCol=targetTask.col
    moveTask(dragTask,newCol)
    TASKS.splice(TASKS.indexOf(dragTask),1)
    const tIdx=TASKS.indexOf(targetTask)
    TASKS.splice(dragOverPos==='top'?tIdx:tIdx+1,0,dragTask)
  }else{
    const col=e.target.closest('.kcol')
    if(col){
      const newCol=col.id.replace('kc-','')
      if(dragTask.col!==newCol)moveTask(dragTask,newCol)
    }
  }

  // Save sort_order to Supabase
  saveTaskOrder()
  rtasks()
  dragId=null;dragOverEl=null;dragOverPos=null
})

// Инлайн создание без prompt()
function showInlineNew(afterEl,onConfirm,placeholder='Название...'){
  document.querySelectorAll('.j-new-inline').forEach(el=>el.remove())
  const wrap=document.createElement('div');wrap.className='j-new-inline'
  const inp=document.createElement('input');inp.className='j-new-inp';inp.placeholder=placeholder
  const ok=document.createElement('button');ok.className='j-new-ok';ok.textContent='✓'
  const x=document.createElement('button');x.className='j-new-x';x.textContent='✕'
  const confirm=()=>{const v=inp.value.trim();if(v)onConfirm(v);wrap.remove()}
  const cancel=()=>wrap.remove()
  ok.addEventListener('click',confirm);x.addEventListener('click',cancel)
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')confirm();if(e.key==='Escape')cancel()})
  wrap.appendChild(inp);wrap.appendChild(ok);wrap.appendChild(x)
  const tree=document.getElementById('j-tree')
  if(afterEl)afterEl.after(wrap);else tree.appendChild(wrap)
  inp.focus()
}

function loadDocById(id){
  curDoc=id
  const all=[...jLoose,...jFolders.flatMap(f=>f.docs)],d=all.find(x=>String(x.id)===String(id))
  if(d){
    document.getElementById('j-title').value=d.title
    const ed=document.getElementById('jeditor')
    // Если хранится как HTML — ставим напрямую; если старый markdown — конвертим
    if(d.body&&(d.body.trim().startsWith('<')||d.body.trim()===''))ed.innerHTML=d.body||''
    else ed.innerHTML=d.body?mdToHtml(d.body):''
  }
  rtree()
}

function mdToHtml(md){
  return md
    .replace(/^# (.+)$/gm,'<h1>$1</h1>')
    .replace(/^## (.+)$/gm,'<h2>$1</h2>')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`(.+?)`/g,'<code>$1</code>')
    .replace(/^---$/gm,'<hr>')
    .replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>')
    .replace(/^- (.+)$/gm,'<li>$1</li>')
    .replace(/(<li>.*<\/li>\n?)+/g,s=>`<ul>${s}</ul>`)
    .replace(/(\|[^\n]+\|\n?)+/g,t=>{
      const rows=t.trim().split('\n');if(rows.length<2)return t
      const head=rows[0].split('|').filter(c=>c.trim()).map(c=>`<th>${c.trim()}</th>`).join('')
      const body=rows.slice(2).map(r=>'<tr>'+r.split('|').filter(c=>c.trim()).map(c=>`<td>${c.trim()}</td>`).join('')+'</tr>').join('')
      return`<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`
    })
    .replace(/\n/g,'<br>')
}

    })

}

// ══════════════════════════════════════════
async function importCampaignsFromMeta(){
  if(!db)return
  setSS('syncing','Импорт РК из Meta...')
  try{
    // Получаем уже импортированные кампании
    const{data:imported}=await db.from('imported_campaigns').select('campaign_id')
    const importedIds=new Set((imported||[]).map(x=>x.campaign_id))

    // Читаем кампании напрямую из FB API
    // Токен берём из Edge Function через специальный endpoint
    const r=await fetch(SB_URL+'/functions/v1/get-campaigns',{
      method:'POST',
      headers:{'Authorization':'Bearer '+SB_ANON,'Content-Type':'application/json'},
      body:JSON.stringify({action:'get_campaigns',region:CURRENT_REGION})
    })
    if(!r.ok){
      // Edge Function не задеплоена — показываем инструкцию
      toast('Нужно задеплоить get-campaigns функцию. Пока добавь РК вручную.','info')
      setSS('ok','—')
      return
    }
    const d=await r.json()
    if(!d.campaigns||!d.campaigns.length){setSS('ok','Нет новых РК');toast('Нет новых кампаний в Meta','info');return}

    let added=0,replaced=0
    for(const camp of d.campaigns){
      const buyer=parseBuyerFromName(camp.name)||'Danya'
      const geo=parseGeoFromName(camp.name)
      const funnel=parseFunnelFromName(camp.name)
      const date=parseDateFromCampName(camp.name)
      const budget=parseFloat(camp.daily_budget||0)/100||0

      // Check if zaliv with exact same name already exists
      // Normalize names for comparison
      const normName=n=>n.trim().replace(/\s+/g,' ').toLowerCase()
      // Find match but ensure campaign_id not already used by another zaliv
      const campIdStr=String(camp.id)
      const alreadyAssigned=ZALIVS.find(z=>z.campaign_id===campIdStr&&z.name.trim()!==camp.name.trim())
      if(alreadyAssigned){
        console.log('campaign_id already assigned to different zaliv:',alreadyAssigned.name)
        replaced++; continue
      }
      const existing=ZALIVS.find(z=>normName(z.name)===normName(camp.name))

      if(existing){
        // Replace: update existing zaliv with fresh data + campaign_id
        const upd={
          campaign_id:String(camp.id),
          ad_budget:budget,
          rk_budget:budget,
          geo,funnel,buyer,
          date:date||existing.date,
          updated_at:new Date().toISOString()
        }
        const{error}=await db.from('zalivs').update(upd).eq('id',existing.id)
        if(!error){
          Object.assign(existing,upd)
          // Update imported_campaigns
          await db.from('imported_campaigns').upsert({campaign_id:String(camp.id),zaliv_id:existing.id},{onConflict:'campaign_id'})
          replaced++
          console.log('Replaced:',camp.name)
        }
        continue
      }

      // Skip if already imported by campaign_id
      if(importedIds.has(String(camp.id)))continue

      // New zaliv
      const{data:zData,error}=await db.from('zalivs').insert({
        geo,name:camp.name,
        ad_budget:budget,rk_budget:budget,
        domain:'',creos:[],goals:[],
        ind:'profit',status:'Check',insights:'',
        buyer,funnel,score:3,
        campaign_id:String(camp.id),
        date:date||new Date().toLocaleDateString('ru',{day:'2-digit',month:'2-digit'}),
        region:CURRENT_REGION
      }).select().single()
      if(!error&&zData){
        ZALIVS.unshift(zData);(window._ALL_ZALIVS||[]).unshift(zData);autoFdcTask(zData)
        await db.from('imported_campaigns').insert({campaign_id:String(camp.id),zaliv_id:zData.id})
        added++
      }
    }
    setSS('ok',(added+replaced)>0?`Импорт: +${added} новых, ${replaced} обновлено`:'Нет изменений')
    if(typeof autoMatchCampaignIds==='function')autoMatchCampaignIds()
    if(added>0||replaced>0){
      toast(`Импорт Meta: +${added} новых, ${replaced} обновлено`,'ok')
      rzalivs()
    }else toast('Нет новых кампаний за последние 3 дня','info')
    // Auto-match campaign IDs for existing zalivs
    setTimeout(autoMatchCampaignIds,500)
  }catch(e){
    setSS('','Ошибка импорта')
    toast('Нужно задеплоить функцию get-campaigns в Supabase','err')
    console.log('Import error:',e)
  }
}

// ── REGION GEO helpers (config REGION_GEOS declared at top) ──
function regionCfg(){return REGION_GEOS[CURRENT_REGION]||REGION_GEOS.PL}
function regionGeos(){const c=regionCfg();return [c.main,c.ua]}
// Is this GEO the "UA" variant of its region?
function isUaGeo(g){return g==='PLUA'||g==='CZUA'}
// GEO chip css class: main geo → gpl (blue), ua variant → gplua (purple)
function geoClass(g){return isUaGeo(g)?'gplua':'gpl'}
// Map zaliv GEO → creo library GEO (PL→PL, PLUA→UAPL, CZ→CZ, CZUA→UACZ)
function geoToCreoGeo(g){
  const m={PL:'PL',PLUA:'UAPL',CZ:'CZ',CZUA:'UACZ'}
  return m[g]||g
}

function parseGeoFromName(name){
  const n=name.toUpperCase()
  const c=regionCfg()
  const brIdx=n.indexOf('}')
  if(brIdx>=0){
    const after=n.substring(brIdx+1,brIdx+6)
    if(after.startsWith(c.ua))return c.ua
    if(after.startsWith('UA'))return c.ua
    if(after.startsWith(c.main))return c.main
  }
  if(n.includes('UA'))return c.ua
  return c.main
}

function parseFunnelFromName(name){
  const n=name.toLowerCase()
  if(n.includes('kalk')||n.includes('калькул'))return'Калькулятор'
  if(n.includes('vizit')||n.includes('визит'))return'Визита'
  if(n.includes('proj')||n.includes('проект'))return'Проект'
  if(n.includes('lead')||n.includes('лид'))return'Лид-магнит'
  return'Калькулятор'
}

function parseBuyerFromName(name){const m=(name||'').match(/^\s*\d*\s*([DI])\s*[{\[(]/i);if(!m)return'';return m[1].toUpperCase()==='I'?'Illia':'Danya'}
function parseDateFromCampName(name){
  // Matches: D{17.06} I[16.06] D[09.06] etc
  // After first letter, optionally {[ then DD.MM
  const m=name.match(/^[A-Za-z][{\[(]?(\d{2}[.,]\d{2})/)
  if(m)return m[1].replace(',','.')
  // fallback: any DD.MM pattern
  const m2=name.match(/(\d{2}[.,]\d{2})/)
  if(m2)return m2[1].replace(',','.')
  return null
}

function rcreo(){
  const geo=document.getElementById('crf-geo').value
  const creator=document.getElementById('crf-creator').value
  const funnel=document.getElementById('crf-funnel').value
  const q=document.getElementById('crf-q').value.toLowerCase()

    (!geo||r.geo===geo)&&
    (!creator||r.creator===creator)&&

    (!q||r.creo_id?.toLowerCase().includes(q)||r.notes?.toLowerCase().includes(q))

  const avgCpl=f.length?Math.round(f.reduce((s,r)=>s+(r.cpl||0),0)/f.length*100)/100:0
  const avgCql=f.length?Math.round(f.reduce((s,r)=>s+(r.cql||0),0)/f.length*100)/100:0
  const avgCr=f.length?Math.round(f.reduce((s,r)=>s+(r.cr||0),0)/f.length*100)/100:0

    <div class="creo-stat-box"><div class="creo-stat-lbl">Крео</div><div class="creo-stat-val">${f.length}</div></div>
    <div class="creo-stat-box"><div class="creo-stat-lbl">AVG CTR</div><div class="creo-stat-val" style="color:${avgCtr>2?'var(--green)':avgCtr>1?'var(--yellow)':'var(--red)'}">${avgCtr}%</div></div>
    <div class="creo-stat-box"><div class="creo-stat-lbl">AVG CPL</div><div class="creo-stat-val" style="color:${avgCpl>0&&avgCpl<10?'var(--green)':avgCpl<15?'var(--yellow)':'var(--red)'}">${avgCpl>0?'$'+avgCpl:'—'}</div></div>
    <div class="creo-stat-box"><div class="creo-stat-lbl">AVG CQL</div><div class="creo-stat-val">${avgCql>0?'$'+avgCql:'—'}</div></div>
    <div class="creo-stat-box"><div class="creo-stat-lbl">TOTAL SPEND</div><div class="creo-stat-val" style="color:var(--yellow)">${totalSpend>0?'$'+totalSpend:'—'}</div></div>
  `

  if(!sorted.length){
    document.getElementById('creo-tbody').innerHTML=`<tr><td colspan="12" class="empty">Нет отчётов по крео. Добавятся автоматически при выключении РК.</td></tr>`

    const ctrColor=r.ctr>2?'var(--green)':r.ctr>1?'var(--yellow)':'var(--red)'

      <td>${r.geo?`<span class="zgeo gchip ${geoClass(r.geo)}">${r.geo}</span>`:'—'}</td>

      <td style="font-size:10px;color:var(--text3);font-family:var(--mono)">${r.date_start||'—'}${r.date_end?'→'+r.date_end:''}</td>
      <td><input class="creo-edit-inp" style="color:${ctrColor};width:60px" data-rid="${r.id}" data-field="ctr" value="${r.ctr||0}"></td>
      <td><input class="creo-edit-inp" style="width:60px" data-rid="${r.id}" data-field="cr" value="${r.cr||0}"></td>

        <button class="cbtn-del" data-rid="${r.id}">✕</button>
      </td>
    </tr>`
  }).join('')

  document.querySelectorAll('.cbtn-save[data-rid]').forEach(btn=>btn.addEventListener('click',()=>saveCreoReport(parseInt(btn.dataset.rid))))
  document.querySelectorAll('.cbtn-del[data-rid]').forEach(btn=>btn.addEventListener('click',()=>delCreoReport(parseInt(btn.dataset.rid))))
  // Enter to save
  document.querySelectorAll('.creo-edit-inp,.creo-notes-inp').forEach(inp=>{
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')saveCreoReport(parseInt(inp.dataset.rid))})
  })
}

async function saveCreoReport(id){
  const r=CREO_REPORTS.find(x=>x.id===id);if(!r)return
  // Collect all inputs for this report
  const fields=['ctr','cr','cpl','cql','notes']
  const upd={}
  fields.forEach(f=>{
    const inp=document.querySelector(`[data-rid="${id}"][data-field="${f}"]`)
    if(inp)upd[f]=f==='notes'?inp.value:parseFloat(inp.value)||0
  })
  await db.from('creo_reports').update(upd).eq('id',id)
  Object.assign(r,upd)
  toast('Сохранено','ok')
}

async function delCreoReport(id){
  if(!confirm('Удалить отчёт?'))return
  await db.from('creo_reports').delete().eq('id',id)
  CREO_REPORTS=CREO_REPORTS.filter(x=>x.id!==id)
  rcreo();toast('Удалено','ok')
}

var offPendingZalivId=null

function interceptOFF(zalivId){
  const z=ZALIVS.find(x=>x.id===zalivId);if(!z)return false
